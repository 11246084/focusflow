        '403':
          $ref: '#/components/responses/ShortScriptManageForbiddenError'
        '404':
          $ref: '#/components/responses/ShortScriptNotFoundError'
  /api/v1/short-scripts/{scriptId}/generate:
    post:
      tags:
        - Short Scripts
      summary: 以 LLM 生成新一版腳本
      description: |
        允許的前置狀態為 `evidence_ready` 或 `changes_requested`，成功後轉為 `generated` 並在 `versions` 附加一版。

        上一版的回饋類型決定是否重撈證據：`retrieval` 會先重新檢索並凍結證據，`narrative` 沿用原證據、只把回饋帶進 prompt。
        生成結果引用了證據包以外的片段時，最多重試 `SHORT_SCRIPT_GENERATION_RETRY_LIMIT` 次。
        失敗回應的 `error.details`（嘗試次數、驗證錯誤、最後一次原始輸出）只在非 production 環境回傳。
      operationId: generateShortScriptVersion
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      responses:
        '200':
          description: 已生成新版本，回傳更新後的腳本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortScriptResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ShortScriptManageForbiddenError'
        '404':
          $ref: '#/components/responses/ShortScriptNotFoundError'
        '409':
          $ref: '#/components/responses/ShortScriptStateInvalidError'
        '422':
          description: |
            - `SHORT_SCRIPT_EVIDENCE_EMPTY`：`retrieval` 回饋重撈後證據不足
            - `SHORT_SCRIPT_ARC_NOT_APPLICABLE`：證據沒有轉折句，不適用 8 拍敘事弧線
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                arcNotApplicable:
                  value:
                    success: false
                    message: The frozen evidence contains no reversal, so the 8-shot arc does not apply.
                    error:
                      code: SHORT_SCRIPT_ARC_NOT_APPLICABLE
        '500':
          description: 未設定 `GEMINI_API_KEY`，不會 fallback 成模板輸出（`SHORT_SCRIPT_PROVIDER_NOT_CONFIGURED`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                providerNotConfigured:
                  value:
                    success: false
                    message: GEMINI_API_KEY is required for short script generation.
                    error:
                      code: SHORT_SCRIPT_PROVIDER_NOT_CONFIGURED
        '502':
          description: |
            - `SHORT_SCRIPT_GENERATION_FAILED`：LLM provider 呼叫失敗
            - `SHORT_SCRIPT_OUTPUT_INVALID`：重試上限內都無法解析成 JSON
            - `SHORT_SCRIPT_CITATION_INVALID`：重試上限內都未通過引用與格式驗證
            - `EMBEDDING_PROVIDER_ERROR`：`retrieval` 回饋重撈證據時 embedding provider 失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                citationInvalid:
                  value:
                    success: false
                    message: Generated script cited chunk ids outside the frozen evidence.
                    error:
                      code: SHORT_SCRIPT_CITATION_INVALID
                generationFailed:
                  value:
                    success: false
                    message: Short script generation provider failed.
                    error:
                      code: SHORT_SCRIPT_GENERATION_FAILED
  /api/v1/short-scripts/{scriptId}/review:
    post:
      tags:
        - Short Scripts
      summary: 審核腳本（要求修改或否決）
      description: |
        `decision` 只接受 `request_changes` 與 `dismiss`。`approved` 不開放人工設定：
        腳本只會在對應成品通過審核並上架後，由系統標成 `approved`；傳 `approve` 會回 `400`。

        `request_changes` 必須附 `feedback` 與 `feedbackType`（`retrieval` 或 `narrative`，由教師指定，系統不猜）。
        `dismiss` 的 `feedback` 會存成 `dismissReason`。回饋記在最新一版上。
      operationId: reviewShortScript
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortScriptReviewRequest'
            examples:
              requestChanges:
                value:
                  decision: request_changes
                  feedbackType: narrative
                  feedback: 反轉太晚出現，請提前到第三鏡。
              dismiss:
                value:
                  decision: dismiss
                  feedback: 主題與下週課程重複。
      responses:
        '200':
          description: 審核已記錄，回傳更新後的腳本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortScriptResponse'
        '400':
          description: "`scriptId` 格式錯誤（`INVALID_ID`），或 `decision`、`feedbackType`、`feedback` 驗證失敗（`VALIDATION_ERROR`）。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownDecision:
                  value:
                    success: false
                    message: Unknown review decision.
                    error:
                      code: VALIDATION_ERROR
                feedbackTypeRequired:
                  value:
                    success: false
                    message: feedbackType must be retrieval or narrative when requesting changes.
                    error:
                      code: VALIDATION_ERROR
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ShortScriptManageForbiddenError'
        '404':
          $ref: '#/components/responses/ShortScriptNotFoundError'
        '409':
          $ref: '#/components/responses/ShortScriptStateInvalidError'
  /api/v1/short-scripts/{scriptId}/asset:
    post:
      tags:
        - Short Scripts
      summary: 依腳本上傳成品影片
      description: |
        教師依腳本產出影片後上傳，建立 draft ShortAsset，**不會直接進學生牆**；對學生公開的閘門是成品審核（`POST /api/v1/shorts/{shortAssetId}/review`）。

        - 必須確認 AI 揭露標示與教師數位分身書面同意（`aiDisclosureConfirmed`、`consentConfirmed` 皆為 `true`）。
        - 腳本至少要有一個生成版本；`versionNo` 省略時使用最新一版，指定的版本不存在即回 `400`。
        - 同一腳本已有尚未上架的成品（通常是被退回的那支）時，會把它換成新一代（`generationVersion` +1），不另建資產。
        - 回應後 backend 會在背景把影片以 unlisted 上傳 YouTube 供教師預覽；上傳結果請看之後讀到的 `upload` 欄位。
        - 驗證失敗時已寫入磁碟的上傳檔會被刪除。
      operationId: uploadShortScriptAsset
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShortScriptAssetUploadRequest'
      responses:
        '201':
          description: 成品已建立（或已換代），等待審核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherShortAssetResponse'
        '400':
          description: |
            - `INVALID_ID`：`scriptId` 格式錯誤
            - `VALIDATION_ERROR`：缺少 `video` 檔案、指定的 `versionNo` 不存在，或標題為空
            - `SHORT_ASSET_DISCLOSURE_REQUIRED`：未確認 AI 揭露標示與書面同意
            - `INVALID_FILE_TYPE`：上傳的不是影片
            - `UPLOAD_ERROR`：multipart 解析失敗或檔案超過 500 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                disclosureRequired:
                  value:
                    success: false
                    message: AI disclosure and written consent must be confirmed before uploading.
                    error:
                      code: SHORT_ASSET_DISCLOSURE_REQUIRED
                fileRequired:
                  value:
                    success: false
                    message: A short video file is required.
                    error:
                      code: VALIDATION_ERROR
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ShortScriptManageForbiddenError'
        '404':
          $ref: '#/components/responses/ShortScriptNotFoundError'
        '409':
          description: 腳本還沒有任何生成版本可以拍攝（`SHORT_SCRIPT_STATE_INVALID`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noVersion:
                  value:
                    success: false
                    message: The script has no generated version to film from.
                    error:
                      code: SHORT_SCRIPT_STATE_INVALID
  /api/v1/short-assets/{assetId}/upload/retry:
    post:
      tags:
        - Short Scripts
      summary: 重試成品影片的 YouTube 上傳
      description: |
        只允許從未送出過（`upload.status` 為 null）或 `failed` 且 `retrySafe=true` 的成品重試；
        可能已送出影片 bytes 的失敗必須先人工確認 YouTube Studio，避免重複影片。

        成功代表影片已以 unlisted 傳上 YouTube。成品若在上傳前已通過審核，會同時標成 `published` 進學生牆；
        否則維持 `draft`。回應 message 固定為 `Short asset published.`，請以 `status` 判斷是否已上架。
      operationId: retryShortAssetYouTubeUpload
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: YouTube 上傳成功，回傳更新後的成品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherShortAssetResponse'
        '400':
          description: "`assetId` 格式錯誤（`INVALID_ID`），或成品缺少 AI 揭露／書面同意確認（`SHORT_ASSET_DISCLOSURE_REQUIRED`）。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    success: false
                    message: Invalid short asset id.
                    error:
                      code: INVALID_ID
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ShortScriptManageForbiddenError'
        '404':
          description: 功能未啟用（`NOT_FOUND`）、成品不存在（`SHORT_ASSET_NOT_FOUND`），或成品所屬課程不存在（`COURSE_NOT_FOUND`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                featureDisabled:
                  value:
                    success: false
                    message: Not found.
                    error:
                      code: NOT_FOUND
                assetNotFound:
                  value:
                    success: false
                    message: Short asset not found.
                    error:
                      code: SHORT_ASSET_NOT_FOUND
        '409':
          description: |
            - `YOUTUBE_UPLOAD_ALREADY_COMPLETED`：已上傳過
            - `YOUTUBE_UPLOAD_RETRY_NOT_ALLOWED`：目前不是可重試的狀態
            - `YOUTUBE_UPLOAD_RETRY_UNSAFE`：上次失敗可能已送出 bytes，須先人工確認
            - `YOUTUBE_UPLOAD_RETRY_LIMIT_REACHED`：已達 `YOUTUBE_UPLOAD_MAX_ATTEMPTS`
            - `SHORT_ASSET_SOURCE_FILE_MISSING`：本機影片檔已不存在，需重新上傳
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                retryUnsafe:
                  value:
                    success: false
                    message: The previous attempt may have sent video bytes; check YouTube Studio before retrying.
                    error:
                      code: YOUTUBE_UPLOAD_RETRY_UNSAFE
                sourceFileMissing:
                  value:
                    success: false
                    message: Local short video file is missing; cannot upload to YouTube.
                    error:
                      code: SHORT_ASSET_SOURCE_FILE_MISSING
        '502':
          description: YouTube OAuth 或上傳 API 失敗（`YOUTUBE_UPLOAD_FAILED`）；失敗已記錄在成品的 `upload` 欄位。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: YouTube 上傳憑證未設定完整（`YOUTUBE_UPLOAD_NOT_CONFIGURED`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notConfigured:
                  value:
                    success: false
                    message: YouTube upload is not configured.
                    error:
                      code: YOUTUBE_UPLOAD_NOT_CONFIGURED
  /api/v1/courses/{courseId}/short-assets:
    get:
      tags:
        - Short Scripts
      summary: 列出課程的成品影片（教師視角）
      description: |
        回傳課程下所有 ShortAsset（含 draft、published、archived），依建立時間由新到舊排序，並附 YouTube 上傳狀態。
        學生可見的 feed 請改用 `GET /api/v1/youtube/shorts`。
      operationId: listCourseShortAssets
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功取得成品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherShortAssetListResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ShortScriptManageForbiddenError'
        '404':
          $ref: '#/components/responses/ShortScriptCourseNotFoundError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    LineSignature:
      type: apiKey
      in: header
      name: x-line-signature
      description: |
        使用 `LINE_CHANNEL_SECRET`，對「完整且未改動的 raw webhook body」計算出的 HMAC-SHA256 signature。

        這是一個 `integration-facing` 的簽章驗證流程；Swagger UI 不會自動替你計算 signature。
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: 目標課程的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
    VideoId:
      name: videoId
      in: path
      required: true
      description: 目標影片的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
    ShortAssetId:
      name: shortAssetId
      in: path
      required: true
      description: 目標 ShortAsset 的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
    BatchId:
      name: batchId
      in: path
      required: true
      description: 後端產生的影片批次 ID。
      schema:
        type: string
        pattern: '^batch_[0-9]{14}_[a-f0-9]{8}$'
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      description: 目標回報的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
    FeedbackAttachmentId:
      name: attachmentId
      in: path
      required: true
      description: 回報附件的 MongoDB ObjectId，取自回報的 `attachments[].attachmentId`。
      schema:
        $ref: '#/components/schemas/ObjectId'
    ScriptId:
      name: scriptId
      in: path
      required: true
      description: 目標短影片腳本的 MongoDB ObjectId（腳本回應中的 `_id`）。
      schema:
        $ref: '#/components/schemas/ObjectId'
    AssetId:
      name: assetId
      in: path
      required: true
      description: 目標 ShortAsset 的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
  responses:
    ValidationError:
      description: request payload 驗證失敗。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: 一般欄位驗證失敗
              description: 代表 request 結構存在欄位缺漏、型別錯誤，或其他基本驗證失敗情況。
              value:
                success: false
                message: Validation failed.
                error:
                  code: VALIDATION_ERROR
                  details:
                    - title is required
    InvalidCredentialsError:
      description: email 或 password 不正確。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              summary: 帳號或密碼錯誤
              description: 使用者提供的 email 或 password 無法通過驗證。
              value:
                success: false
                message: Invalid email or password.
                error:
                  code: INVALID_CREDENTIALS
    UnauthorizedError:
      description: 缺少 bearer token，或 token 對應的使用者目前不可用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: 尚未通過身份驗證
              description: 請求未帶入必要的 Bearer token，或目前請求情境需要先完成認證。
              value:
                success: false
                message: Authentication required.
                error:
                  code: UNAUTHORIZED
    ForbiddenError:
      description: 已登入，但角色不符合此端點要求。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: 角色權限不足
              description: 呼叫者已登入，但角色不符合這個端點的授權條件。
              value:
                success: false
                message: You do not have permission to perform this action.
                error:
                  code: FORBIDDEN
    InvalidIdError:
      description: path 或 body 內的 ObjectId 格式不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidId:
              summary: ObjectId 格式錯誤
              description: path 或 body 中的資源識別值不是合法的 MongoDB ObjectId。
              value:
                success: false
                message: Invalid resource id.
                error:
                  code: INVALID_ID
    UserNotFoundError:
      description: token 驗證成功，但對應的使用者已不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userNotFound:
              summary: 找不到 token 對應的使用者
              description: token 本身可被驗證，但資料庫中已找不到對應 user。
              value:
                success: false
                message: User not found.
                error:
                  code: USER_NOT_FOUND
    CourseAccessDeniedError:
      description: 呼叫端沒有存取這門課的權限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseAccessDenied:
              summary: 沒有課程存取權
              description: 呼叫者雖已登入，但不符合這門課目前的課程存取規則。
              value:
                success: false
                message: You do not have access to this course.
                error:
                  code: COURSE_ACCESS_DENIED
    CourseManageDeniedError:
      description: 呼叫端沒有管理這門課或影片的權限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseManageDenied:
              summary: 沒有課程管理權
              description: 呼叫者不是課程 owner teacher，也不是 admin，因此不能執行管理型操作。
              value:
                success: false
                message: You do not have permission to manage this course.
                error:
                  code: COURSE_MANAGE_DENIED
    CourseNotFoundError:
      description: 找不到指定課程。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseNotFound:
              summary: 課程不存在
              description: 請求中的課程識別值格式正確，但資料庫中找不到對應課程。
              value:
                success: false
                message: Course not found.
                error:
                  code: COURSE_NOT_FOUND
    VideoNotFoundError:
      description: 找不到指定影片。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            videoNotFound:
              summary: 影片不存在
              description: 請求中的影片識別值格式正確，但資料庫中找不到對應影片。
              value:
                success: false
                message: Video not found.
                error:
                  code: VIDEO_NOT_FOUND
    ShortAssetNotFoundError:
      description: 找不到指定 ShortAsset。對格式正確但不存在的 id，會在 ownership 檢查前回傳此錯誤。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                success: false
                message: Short asset not found.
                error:
                  code: SHORT_ASSET_NOT_FOUND
    ShortAssetReviewForbiddenError:
      description: 呼叫者角色不允許使用審核 API，或 teacher 不是該 ShortAsset 所屬課程的 owner。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            roleForbidden:
              summary: 角色不是 teacher 或 admin
              value:
                success: false
                message: You do not have permission to perform this action.
                error:
                  code: FORBIDDEN
            assetAccessDenied:
              summary: Teacher 不是所屬課程 owner
              value:
                success: false
                message: You do not have permission to review this short asset.
                error:
                  code: SHORT_ASSET_ACCESS_DENIED
    ShortAssetReviewConflictError:
      description: |
        審核 CAS 未通過。`SHORT_ASSET_REVIEW_STALE` 表示 request 的 generation 已不是目前版本；
        `SHORT_ASSET_REVIEW_CONFLICT` 表示目前 generation 已有審核結果或並發審核已先完成。
        Client 應重新讀取 ShortAsset，且不得自動重送原 review request。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            stale:
              summary: 素材 generation 已更新
              value:
                success: false
                message: The short asset generation changed. Reload before reviewing.
                error:
                  code: SHORT_ASSET_REVIEW_STALE
            conflict:
              summary: 同一 generation 已有審核結果
              value:
                success: false
                message: This short asset generation already has a review.
                error:
                  code: SHORT_ASSET_REVIEW_CONFLICT
    FaqInvalidationFailedError:
      description: mutation 前的 FAQ 快取清除失敗；影片與課程關聯尚未修改，可安全重試。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            faqInvalidationFailed:
              summary: FAQ 清除失敗，mutation 未開始
              value:
                success: false
                message: FAQ cache cleanup failed. No video changes were applied; please retry.
                error:
                  code: FAQ_INVALIDATION_FAILED
    VideoMetadataOnlyError:
      description: "`metadataOnly` 的 bridge video 不提供 processing state。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            videoMetadataOnly:
              summary: bridge video 僅有 metadata
              description: 這支影片目前是 `metadataOnly` 狀態，只用於 QA scope，不暴露 processing 狀態。
              value:
                success: false
                message: This video is metadata-only for QA scope and does not expose processing status.
                error:
                  code: VIDEO_METADATA_ONLY
    VideoProcessingTransitionInvalidError:
      description: 目前 processing state 無法轉移到要求的目標狀態。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidTransition:
              summary: processing 狀態轉移不合法
              description: 目前影片的 processing state 與要求的目標狀態不相容，因此不能執行轉移。
              value:
                success: false
                message: Cannot transition video processing from completed to queued.
                error:
                  code: VIDEO_PROCESSING_TRANSITION_INVALID
    QaRuntimeMisconfiguredError:
      description: QA runtime 設定對這次操作而言不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            qaRuntimeMisconfigured:
              summary: QA runtime 設定錯誤
              description: provider、金鑰或 mode 的設定不符合目前執行條件，因此 backend 直接以 `hard_fail` 結束。
              value:
                success: false
                message: GEMINI_API_KEY is required when QA_ANSWER_PROVIDER=gemini.
                error:
                  code: QA_RUNTIME_MISCONFIGURED
                  details:
                    readiness: hard_fail
    QaAtlasNotReadyError:
      description: "`atlas` vector-search mode 已配置，但仍未達到 Phase-1 可執行條件。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            qaAtlasNotReady:
              summary: Atlas mode 尚未 ready
              description: backend 偵測到 `atlas` mode 已被啟用，但目前不符合 Phase-1 可用條件，因此拒絕執行。
              value:
                success: false
                message: Atlas vector search is configured but not ready. Check the Atlas index, query embedding provider, and /health before retrying.
                error:
                  code: QA_ATLAS_NOT_READY
    LineNotConfiguredError:
      description: backend 缺少 `LINE_CHANNEL_SECRET`，因此無法完成 LINE signature 驗證。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            lineNotConfigured:
              summary: LINE signature 驗證條件不足
              description: backend 尚未配置 `LINE_CHANNEL_SECRET`，因此無法驗證 LINE webhook 的簽章。
              value:
                success: false
                message: LINE_CHANNEL_SECRET is not configured.
                error:
                  code: LINE_NOT_CONFIGURED
    FeedbackNotFoundError:
      description: 找不到指定回報。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            feedbackNotFound:
              value:
                success: false
                message: Feedback not found.
                error:
                  code: FEEDBACK_NOT_FOUND
    EmbeddingProviderError:
      description: 片段檢索時 query embedding provider 失敗或回傳無效向量（`EMBEDDING_PROVIDER_ERROR`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            embeddingProviderError:
              value:
                success: false
                message: Failed to generate query embedding.
                error:
                  code: EMBEDDING_PROVIDER_ERROR
    ShortScriptManageForbiddenError:
      description: 角色不是 teacher 或 admin（`FORBIDDEN`），或 teacher 不是課程 owner（`COURSE_MANAGE_DENIED`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            roleForbidden:
              value:
                success: false
                message: You do not have permission to perform this action.
                error:
                  code: FORBIDDEN
            courseManageDenied:
              value:
                success: false
                message: You do not have permission to manage this course.
                error:
                  code: COURSE_MANAGE_DENIED
    ShortScriptCourseNotFoundError:
      description: "`SHORT_SCRIPT_AUTOMATION_ENABLED` 未啟用（`NOT_FOUND`），或課程不存在（`COURSE_NOT_FOUND`）。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            featureDisabled:
              value:
                success: false
                message: Not found.
                error:
                  code: NOT_FOUND
            courseNotFound:
              value:
                success: false
                message: Course not found.
                error:
                  code: COURSE_NOT_FOUND
    ShortScriptNotFoundError:
      description: "`SHORT_SCRIPT_AUTOMATION_ENABLED` 未啟用（`NOT_FOUND`）、腳本不存在（`SHORT_SCRIPT_NOT_FOUND`），或腳本所屬課程已不存在（`COURSE_NOT_FOUND`）。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            featureDisabled:
              value:
                success: false
                message: Not found.
                error:
                  code: NOT_FOUND
            scriptNotFound:
              value:
                success: false
                message: Short script not found.
                error:
                  code: SHORT_SCRIPT_NOT_FOUND
    ShortScriptStateInvalidError:
      description: 腳本目前狀態不允許這個轉換（`SHORT_SCRIPT_STATE_INVALID`），例如對 `dismissed` 腳本再生成。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            stateInvalid:
              value:
                success: false
                message: Cannot move a short script from dismissed to generated.
                error:
                  code: SHORT_SCRIPT_STATE_INVALID
  schemas:
    ObjectId:
      description: MongoDB ObjectId 的字串格式。
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f191e810c19729de860eb
    UserRole:
      description: 系統目前支援的使用者角色列舉。
      type: string
      enum:
        - admin
        - teacher
        - student
    CourseStatus:
      description: 課程狀態列舉。
      type: string
      enum:
        - draft
        - published
        - archived
    BridgeMode:
      description: |
        Phase-1 課程或影片的 `bridge` 呈現模式。

        `bridge` 代表目前資料仍處於 app-owned records 與 pipeline metadata 共存的過渡狀態。
        `qa_scope_only` 代表這份資料主要只用來提供 QA 範圍，不保證具備完整 app-owned video 行為。
      type: string
      enum:
        - standard
        - qa_scope_only
        - mixed_scope
    VideoSourceType:
      description: 影片來源型別列舉。
      type: string
      enum:
        - upload
        - external_url
        - youtube
    VideoProcessingStatus:
      description: 影片 processing 狀態列舉。
      type: string
      enum:
        - queued
        - processing
        - completed
        - failed
    VideoBatchStatus:
      type: string
      enum:
        - creating
        - processing
        - completed
        - partial
        - failed
    ReadinessStatus:
      description: runtime readiness 狀態列舉。
      type: string
      enum:
        - ready
        - degraded
        - hard_fail
    LineDeliveryMode:
      description: LINE webhook / reply flow 的交付模式列舉。
      type: string
      enum:
        - live
        - backend_only
        - disabled
    SuccessBase:
      description: 所有成功回應共用的 envelope 基底。
      type: object
      required:
        - success
        - message
      properties:
        success:
          const: true
        message:
          type: string
    ErrorResponse:
      description: 所有錯誤回應共用的 envelope 格式。
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          const: false
        message:
          type: string
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
            details:
              description: 可選的 endpoint-specific error details；實際結構會依 error 類型而不同。
    DiagnosticItem:
      description: 用於 warnings、hardFailures 或 degradedReasons 的診斷項目。
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    PublicUser:
      description: 對 API 使用者公開的 user 資訊，不包含敏感欄位。
      type: object
      required:
        - id
        - name
        - email
        - role
        - isActive
        - hasAvatar
        - avatarUpdatedAt
        - isLineBound
        - lineBindAt
        - activeCourseId
        - lineConversationState
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        hasAvatar:
          description: 目前帳號是否有可由 authenticated avatar API 讀取的頭貼。
          type: boolean
        avatarUpdatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        isLineBound:
          description: 是否已綁定 LINE 帳號；不暴露實際 LINE user id。
          type: boolean
        lineBindAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        activeCourseId:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        lineConversationState:
          type: string
          enum:
            - idle
            - awaiting_course_selection
        createdAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    TeacherSummary:
      description: 課程或影片回應中使用的 teacher 簡化資料。
      type: object
      required:
        - _id
        - name
        - email
        - role
        - isActive
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
    CourseBridgeFields:
      description: |
        課程在 Phase-1 下的 `bridge` 補充欄位。

        這些欄位用來說明目前課程是一般課程、混合課程，或僅作為 QA scope 的 bridge 課程。
      type: object
      required:
        - isBridgeCourse
        - qaScopeOnly
        - bridgeMode
        - videoCount
        - appVideoCount
        - bridgeVideoCount
        - appOwnedVideoCount
        - metadataOnlyVideoCount
        - courseVideoRefCount
        - bridgeExternalVideoIds
        - courseVideoIds
        - bridgeContract
        - bridgeContractPath
      properties:
        isBridgeCourse:
          description: "`true` 代表這門課目前不是純 `standard` 呈現，而是 bridge-first 的課程視圖。"
          type: boolean
        qaScopeOnly:
          description: "`true` 代表這門課目前偏向 QA scope 使用，而不是完整 app-owned course 體驗。"
          type: boolean
        bridgeMode:
          $ref: '#/components/schemas/BridgeMode'
        videoCount:
          type: integer
          minimum: 0
        appVideoCount:
          description: 課程下 app-owned video 的正式統計欄位。
          type: integer
          minimum: 0
        bridgeVideoCount:
          description: 課程下 bridge / pipeline metadata video 的正式統計欄位。
          type: integer
          minimum: 0
        appOwnedVideoCount:
          description: "`appVideoCount` 的 readability alias，統計來源完全相同，僅用於讓 frontend / demo 更容易理解。"
          type: integer
          minimum: 0
        metadataOnlyVideoCount:
          description: "`bridgeVideoCount` 的 readability alias，統計來源完全相同，僅用於強調這些影片目前是 `metadataOnly` bridge video。"
          type: integer
          minimum: 0
        courseVideoRefCount:
          type: integer
          minimum: 0
        bridgeExternalVideoIds:
          type: array
          items:
            type: string
        courseVideoIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        bridgeContract:
          description: backend 目前採用的 bridge contract 名稱。
          type: string
          example: course_video_refs_v1
        bridgeContractPath:
          description: bridge contract 的資料串接路徑說明。
          type: string
          example: course.videoIds -> videos._id -> videos.videoId -> video_segments_text.videoId
    Course:
      description: 課程主體回應，含基本課程資料與 Phase-1 bridge 欄位。
      allOf:
        - type: object
          required:
            - _id
            - title
            - description
            - teacherId
            - videoIds
            - status
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            title:
              type: string
            description:
              type: string
            teacherId:
              $ref: '#/components/schemas/TeacherSummary'
            videoIds:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
            status:
              $ref: '#/components/schemas/CourseStatus'
            createdAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            updatedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
        - $ref: '#/components/schemas/CourseBridgeFields'
    CourseRef:
      description: 影片或其他巢狀回應中使用的最小課程參考資料。
      type: object
      required:
        - _id
        - title
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        status:
          $ref: '#/components/schemas/CourseStatus'
        teacherId:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/TeacherSummary'
    EnrollmentStudent:
      type: object
      required:
        - id
        - name
        - email
        - isActive
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
    Enrollment:
      type: object
      required:
        - id
        - courseId
        - status
        - progress
        - student
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        courseId:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum: [active, revoked]
        enrolledAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        progress:
          type: number
          minimum: 0
          maximum: 100
        student:
          $ref: '#/components/schemas/EnrollmentStudent'
    EnrollmentAssignRequest:
      type: object
      required:
        - studentEmail
      properties:
        studentEmail:
          type: string
          format: email
          description: 已註冊 active student 的完整 Email；後端會 trim 並轉小寫後精確比對。
    EnrollmentItemResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          properties:
            data:
              type: object
              required:
                - enrollment
              properties:
                enrollment:
                  $ref: '#/components/schemas/Enrollment'
    EnrollmentListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          properties:
            data:
              type: object
              required:
                - enrollments
              properties:
                enrollments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Enrollment'
    UserRef:
      description: 巢狀回應中使用的最小使用者參考資料。
      type: object
      required:
        - _id
        - name
        - email
        - role
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    VideoProcessing:
      description: 影片 processing 狀態本體。
      type: object
      required:
        - status
        - errorMessage
        - errorCode
        - queuedAt
        - startedAt
        - completedAt
        - failedAt
        - attemptCount
      properties:
        status:
          $ref: '#/components/schemas/VideoProcessingStatus'
        errorMessage:
          anyOf:
            - type: string
            - type: 'null'
        errorCode:
          anyOf:
            - type: string
            - type: 'null'
        queuedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        startedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        failedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        attemptCount:
          type: integer
          minimum: 0
    VideoBatchItem:
      type: object
      required:
        - itemId
        - originalName
        - title
        - uploadStatus
        - status
      properties:
        itemId:
          type: string
        originalName:
          type: string
        title:
          type: string
        videoId:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        uploadStatus:
          type: string
          enum: [uploaded, failed]
        processingStatus:
          anyOf:
            - $ref: '#/components/schemas/VideoProcessingStatus'
            - type: 'null'
        status:
          $ref: '#/components/schemas/VideoBatchStatus'
        errorCode:
          anyOf:
            - type: string
            - type: 'null'
        errorMessage:
          anyOf:
            - type: string
            - type: 'null'
        attemptCount:
          type: integer
          minimum: 0
    VideoBatch:
      type: object
      required:
        - batchId
        - courseId
        - createdBy
        - status
        - processingMode
        - counts
        - progressPercent
        - items
      properties:
        batchId:
          type: string
        courseId:
          $ref: '#/components/schemas/ObjectId'
        createdBy:
          $ref: '#/components/schemas/ObjectId'
        status:
          $ref: '#/components/schemas/VideoBatchStatus'
        processingMode:
          type: string
          enum:
            - single_adapter
            - pipeline_batch
        counts:
          type: object
          required: [total, completed, failed, processing]
          properties:
            total: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            processing: { type: integer, minimum: 0 }
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoBatchItem'
        createdAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    YouTubeUploadLifecycle:
      description: YouTube 自動上傳、有限重試與本地來源清理的持久化狀態。
      type: object
      required:
        - status
        - attemptCount
        - retrySafe
      properties:
        status:
          type: string
          enum:
            - uploading
            - uploaded
            - failed
        error:
          anyOf:
            - type: string
            - type: 'null'
        uploadedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        attemptCount:
          type: integer
          minimum: 0
        lastAttemptAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        failedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        retrySafe:
          type: boolean
          description: 僅在確認尚未開始傳送影片 bytes 時才會是 true。
        nextRetryAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        localCleanupAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        localCleanupError:
          anyOf:
            - type: string
            - type: 'null'
    Video:
      description: |
        影片回應主體。

        Phase-1 下同一個 `Video` schema 可能同時承載：
        - 完整的 app-owned video
        - 僅提供 QA scope 的 `metadataOnly` bridge video
      type: object
      required:
        - _id
        - courseId
        - title
        - sourceType
        - sourceUrl
        - uploadedBy
        - processing
        - video_id
        - videoId
        - externalVideoId
        - file_name
        - fileName
        - file_path
        - durationSec
        - duration_sec
        - createdAt
        - updatedAt
        - qaScopeOnly
        - metadataOnly
        - isAppOwned
        - ownership
        - bridgeMode
        - bridgeSource
      properties:
        _id:
          type: string
        courseId:
          description: Phase-1 下可能回傳 ObjectId 字串，或最小化的 populated course reference。
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/CourseRef'
        title:
          type: string
        sourceType:
          anyOf:
            - $ref: '#/components/schemas/VideoSourceType'
            - type: 'null'
        sourceUrl:
          anyOf:
            - type: string
            - type: 'null'
        uploadedBy:
          description: Phase-1 下可能回傳 ObjectId 字串、最小 populated user，或在 `metadataOnly` bridge video 時為 null。
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        processing:
          anyOf:
            - $ref: '#/components/schemas/VideoProcessing'
            - type: 'null'
        video_id:
          anyOf:
            - type: string
            - type: 'null'
        videoId:
          anyOf:
            - type: string
            - type: 'null'
        externalVideoId:
          anyOf:
            - type: string
            - type: 'null'
        file_name:
          anyOf:
            - type: string
            - type: 'null'
        fileName:
          anyOf:
            - type: string
            - type: 'null'
        file_path:
          anyOf:
            - type: string
            - type: 'null'
        durationSec:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
        duration_sec:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
        video_source:
          anyOf:
            - type: string
            - type: 'null'
        video_url:
          anyOf:
            - type: string
            - type: 'null'
        videoUrl:
          anyOf:
            - type: string
            - type: 'null'
        youtubeVideoId:
          anyOf:
            - type: string
            - type: 'null'
        youtubeUpload:
          anyOf:
            - $ref: '#/components/schemas/YouTubeUploadLifecycle'
            - type: 'null'
        createdAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        qaScopeOnly:
          description: "`true` 代表這支影片主要只暴露 QA scope 所需資訊。"
          type: boolean
        metadataOnly:
          description: "`true` 代表這支影片只有 metadata，沒有完整 app-owned video 的 processing / 管理能力。"
          type: boolean
        isAppOwned:
          description: "`true` 代表這支影片是 backend app 直接管理的 app-owned record。"
          type: boolean
        ownership:
          description: 明確標示這支影片目前在 mixed `videos` collection 中的後端 ownership 邊界。
          type: string
          enum:
            - app_owned
            - pipeline_metadata
        bridgeMode:
          description: 這支影片目前所屬的 `bridge` 呈現模式。
          $ref: '#/components/schemas/BridgeMode'
        bridgeSource:
          description: 若為 bridge video，指出目前 metadata 來源。
          anyOf:
            - type: string
              enum:
                - pipeline_metadata
            - type: 'null'
    VideoProcessingPayload:
      description: 影片 processing 相關端點回傳的資料主體。
      type: object
      required:
        - id
        - title
        - processing
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        processing:
          $ref: '#/components/schemas/VideoProcessing'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    CourseVideosMeta:
      description: 課程影片列表額外附帶的 `meta` 區塊。
      type: object
      required:
        - isBridgeCourse
        - qaScopeOnly
        - bridgeMode
        - videoCount
        - appVideoCount
        - bridgeVideoCount
        - appOwnedVideoCount
        - metadataOnlyVideoCount
        - bridgeContract
        - bridgeContractPath
      properties:
        isBridgeCourse:
          description: 方便呼叫端快速判斷這份列表是否來自 bridge-first 課程。
          type: boolean
        qaScopeOnly:
          description: 課程影片列表是否屬於 QA-only scope。
          type: boolean
        bridgeMode:
          $ref: '#/components/schemas/BridgeMode'
        videoCount:
          type: integer
          minimum: 0
        appVideoCount:
          description: 影片列表中 app-owned video 的正式統計欄位。
          type: integer
          minimum: 0
        bridgeVideoCount:
          description: 影片列表中 bridge / pipeline metadata video 的正式統計欄位。
          type: integer
          minimum: 0
        appOwnedVideoCount:
          description: "`appVideoCount` 的 readability alias，統計來源完全相同。"
          type: integer
          minimum: 0
        metadataOnlyVideoCount:
          description: "`bridgeVideoCount` 的 readability alias，統計來源完全相同。"
          type: integer
          minimum: 0
        bridgeContract:
          description: 目前列表採用的 bridge contract 名稱。
          type: string
        bridgeContractPath:
          description: 目前列表採用的 bridge contract 路徑說明。
          type: string
    QaRuntimeSnapshot:
      description: QA runtime 的靜態快照，用來描述目前 provider 與 readiness 狀態。
      type: object
      required:
        - queryEmbeddingProvider
        - vectorSearchMode
        - answerProvider
        - atlasVectorIndexConfigured
        - atlasFilterMode
        - leafAdjacentContextEnabled
        - geminiConfigured
        - openaiConfigured
        - hierarchicalRetrievalEnabled
        - hierarchicalRetrievalFallbackToLeaf
        - hierarchicalRetrievalRolloutMode
        - hierarchicalRetrievalRolloutModeValid
        - hierarchicalRetrievalAllowlistsValid
        - hierarchicalRolloutContractStatus
        - hierarchicalParentStorageMode
        - queryEmbeddingDimensions
        - queryEmbeddingContract
        - dataContractCompatibility
        - leafQueryEmbeddingCompatible
        - parentQueryEmbeddingCompatible
        - readiness
        - readyForAsk
        - costControl
        - warnings
        - hardFailures
      properties:
        queryEmbeddingProvider:
          type: string
          enum:
            - mock
            - openai
            - gemini
        vectorSearchMode:
          type: string
          enum:
            - memory
            - atlas
        answerProvider:
          type: string
          enum:
            - template
            - openai
            - gemini
        atlasVectorIndexConfigured:
          type: boolean
        atlasFilterMode:
          type: string
          enum:
            - bridge_course_or_video
        leafAdjacentContextEnabled:
          description: 是否明確啟用 Candidate30 與 bounded same-video adjacent Leaf 的 Context15 選擇；預設關閉。
          type: boolean
        geminiConfigured:
          type: boolean
        openaiConfigured:
          type: boolean
        hierarchicalRetrievalEnabled:
          description: 是否已開啟 Parent-first hierarchical retrieval gate。
          type: boolean
        hierarchicalRetrievalFallbackToLeaf:
          description: Parent retrieval 不可用時是否允許安全退回既有 Leaf-only retrieval。
          type: boolean
        hierarchicalRetrievalRolloutMode:
          description: Fail-closed rollout mode. The global Gate remains the highest-priority kill switch.
          type: string
          enum: ['off', shadow, serve]
        hierarchicalRetrievalRolloutModeValid:
          description: Whether the configured rollout mode was recognized.
          type: boolean
        hierarchicalRetrievalAllowlistsValid:
          description: Whether all configured rollout identifier lists parsed safely.
          type: boolean
        hierarchicalRolloutContractStatus:
          description: Stable Parent-to-Query contract-family status used by fail-closed rollout eligibility.
          type: string
          enum: [compatible, incompatible, not_declared]
        hierarchicalParentStorageMode:
          description: Parent 查詢使用的 storage adapter 類型。
          type: string
          enum:
            - atlas_parent_vector
        queryEmbeddingDimensions:
          description: 目前 query embedding provider 預期輸出的向量維度；無法判定時為 null。
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        queryEmbeddingContract:
          $ref: '#/components/schemas/EmbeddingContract'
        queryContract:
          description: "queryEmbeddingContract 的相容性 alias；新整合應使用明確命名欄位。"
          $ref: '#/components/schemas/EmbeddingContract'
        dataContractCompatibility:
          $ref: '#/components/schemas/EmbeddingDataContractCompatibility'
        leafQueryEmbeddingCompatible:
          description: Active Leaf metadata 是否完整符合目前 query contract。
          type: boolean
        parentQueryEmbeddingCompatible:
          description: Active Parent metadata 是否完整符合目前 query contract；不只比較 dimension。
          type: boolean
        readiness:
          $ref: '#/components/schemas/ReadinessStatus'
        readyForAsk:
          type: boolean
        costControl:
          $ref: '#/components/schemas/QaCostControlSnapshot'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    EmbeddingContract:
      description: Backend query 與 active Leaf/Parent data 必須共同遵守的文字搜尋 embedding 契約。
      type: object
      required:
        - provider
        - model
        - dimension
        - instructionVersion
        - generationVersion
        - normalizationVersion
        - contractVersion
        - schemaVersion
        - taskType
      properties:
        provider:
          type: string
        model:
          type: string
        dimension:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        instructionVersion:
          anyOf:
            - type: string
            - type: 'null'
        generationVersion:
          anyOf:
            - type: string
            - type: 'null'
        normalizationVersion:
          anyOf:
            - type: string
            - type: 'null'
        contractVersion:
          anyOf:
            - type: string
            - type: 'null'
        schemaVersion:
          anyOf:
            - type: string
            - type: 'null'
        taskType:
          description: Stable gemini-embedding-2 query contracts must use null.
          anyOf:
            - type: string
            - type: 'null'
    EmbeddingDataContractCompatibility:
      description: Active Leaf/Parent metadata comparison against the current query contract.
      type: object
      required:
        - leaf
        - parent
      properties:
        leaf:
          $ref: '#/components/schemas/EmbeddingContractCompatibility'
        parent:
          $ref: '#/components/schemas/EmbeddingContractCompatibility'
    EmbeddingContractCompatibility:
      type: object
      required:
        - expected
        - active
        - source
        - status
        - mismatches
        - error
      properties:
        expected:
          $ref: '#/components/schemas/EmbeddingContract'
        active:
          anyOf:
            - $ref: '#/components/schemas/EmbeddingContract'
            - type: 'null'
        source:
          type: string
        status:
          type: string
          enum:
            - not_declared
            - compatible
            - incompatible
        mismatches:
          type: array
          items:
            type: string
        error:
          anyOf:
            - type: string
            - type: 'null'
    LineRuntimeSnapshot:
      description: LINE runtime 的靜態快照，用來描述簽章驗證、reply 能力與 delivery mode。
      type: object
      required:
        - signatureValidationConfigured
        - liveReplyConfigured
        - liveFlowReady
        - readiness
        - deliveryMode
        - missingConfig
        - hardFailures
        - degradedReasons
      properties:
        signatureValidationConfigured:
          type: boolean
        liveReplyConfigured:
          type: boolean
        liveFlowReady:
          type: boolean
        readiness:
          $ref: '#/components/schemas/ReadinessStatus'
        deliveryMode:
          $ref: '#/components/schemas/LineDeliveryMode'
        missingConfig:
          type: array
          items:
            type: string
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        degradedReasons:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    QaCostControlSnapshot:
      description: QA cost guardrail 設定快照。`0` 代表該 scope 不限制。
      type: object
      required:
        - enabled
        - resetCadence
        - estimatedTokensPerAsk
        - monthlyTokenBudget
        - userMonthlyTokenQuota
      properties:
        enabled:
          type: boolean
        resetCadence:
          type: string
          enum:
            - calendar_month_utc
        estimatedTokensPerAsk:
          type: integer
          minimum: 1
        monthlyTokenBudget:
          type: integer
          minimum: 0
        userMonthlyTokenQuota:
          type: integer
          minimum: 0
    MultimodalRuntimeSnapshot:
      description: "`video_segments_video` / multimodal QA 的 runtime readiness 快照。目前僅用來顯示尚未接入 QA 的阻塞條件。"
      type: object
      required:
        - segmentCollection
        - vectorIndexName
        - expectedVectorIndexName
        - vectorIndexConfigured
        - expectedVectorIndexDefinition
        - setupCommand
        - readiness
        - readyForQa
        - blockers
        - hardFailures
      properties:
        segmentCollection:
          type: string
        vectorIndexName:
          anyOf:
            - type: string
            - type: 'null'
        expectedVectorIndexName:
          type: string
        vectorIndexConfigured:
          type: boolean
        expectedVectorIndexDefinition:
          type: object
          additionalProperties: true
        setupCommand:
          type: string
        readiness:
          type: string
          enum:
            - not_enabled
        readyForQa:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    ShortsSyncRuntimeSnapshot:
      description: ShortAsset 的 YouTube metadata sync 診斷快照；不代表自動剪輯或發布 worker 已完成。
      type: object
      required:
        - enabled
        - lastAttemptAt
        - lastSuccessAt
        - lastError
        - degraded
      properties:
        enabled:
          type: boolean
        lastAttemptAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastError:
          anyOf:
            - type: string
            - type: 'null'
        degraded:
          type: boolean
    YouTubeUploadRuntimeSnapshot:
      description: >-
        YouTube 自動上傳、有限恢復、本地來源清理與「刪除時轉 private」的診斷快照。狀態只保留 process 內最後一次結果，不持久化。
        server 啟動時會做一次非阻塞 OAuth token 交換，因此開機後即有 `credentialCheck` 可看（只換 access token，不消耗 YouTube 配額）。
      type: object
      required:
        - uploadEnabled
        - recoveryEnabled
        - cleanupEnabled
        - maxAttempts
        - privatizeOnDeleteEnabled
        - credentialsConfigured
        - readiness
        - credentialCheck
        - lastPrivatize
        - lastRecovery
        - lastCleanup
      properties:
        uploadEnabled:
          type: boolean
          description: "`YOUTUBE_UPLOAD_ENABLED`"
        recoveryEnabled:
          type: boolean
          description: "`YOUTUBE_UPLOAD_RECOVERY_ENABLED`；預設 false。"
        cleanupEnabled:
          type: boolean
          description: "`YOUTUBE_UPLOAD_CLEANUP_ENABLED`；預設 false。"
        maxAttempts:
          type: integer
          minimum: 1
          description: 單支影片允許的上傳總嘗試次數。
        privatizeOnDeleteEnabled:
          type: boolean
          description: "`YOUTUBE_PRIVATIZE_ON_DELETE`"
        credentialsConfigured:
          type: boolean
          description: OAuth client id/secret/refresh token 齊備，或設了 access token override。
        usingAccessTokenOverride:
          type: boolean
        uploadReady:
          type: boolean
        privatizeOnDeleteReady:
          type: boolean
        privatizeScopeSatisfied:
          description: >-
            授權 scope 是否足以呼叫 `videos.update`（轉 private）。尚未做過 token 交換時為 null；
            只帶 `youtube.upload` 時為 false，代表刪除影片後不會轉成 private。
          anyOf:
            - type: boolean
            - type: 'null'
        readiness:
          type: string
          enum:
            - ready
            - degraded
            - hard_fail
            - not_enabled
        credentialCheck:
          type: object
          required:
            - status
            - lastAttemptAt
            - lastSuccessAt
            - lastError
            - grantedScopes
          properties:
            status:
              type: string
              enum:
                - ok
                - failed
                - unknown
            lastAttemptAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastSuccessAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastError:
              anyOf:
                - type: string
                - type: 'null'
            grantedScopes:
              type: array
              items:
                type: string
        lastPrivatize:
          description: 最後一次「刪除影片時轉 private」的結果。失敗只寫 log 不中斷刪除，此處是唯一集中觀察點。
          type: object
          required:
            - youtubeVideoId
            - lastAttemptAt
            - lastSuccessAt
            - lastError
          properties:
            youtubeVideoId:
              anyOf:
                - type: string
                - type: 'null'
            lastAttemptAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastSuccessAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastError:
              anyOf:
                - type: string
                - type: 'null'
        lastRecovery:
          type: object
          required:
            - lastAttemptAt
            - lastSuccessAt
            - lastError
            - recoveredCount
            - quarantinedCount
          properties:
            lastAttemptAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastSuccessAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastError:
              anyOf:
                - type: string
                - type: 'null'
            recoveredCount:
              type: integer
              minimum: 0
            quarantinedCount:
              type: integer
              minimum: 0
        lastCleanup:
          type: object
          required:
            - videoId
            - lastAttemptAt
            - lastSuccessAt
            - lastError
          properties:
            videoId:
              anyOf:
                - type: string
                - type: 'null'
            lastAttemptAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastSuccessAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastError:
              anyOf:
                - type: string
                - type: 'null'
        missingConfig:
          type: array
          items:
            type: string
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    ShortAssetLifecycleStatus:
      type: string
      description: ShortAsset 的素材生命週期，與 reviewStatus 分離。
      enum:
        - draft
        - ready
        - published
        - archived
    ShortAssetReviewStatus:
      type: string
      description: ShortAsset 目前 generation 的審核狀態。
      enum:
        - pending
        - approved
        - rejected
    ShortAssetReviewDecision:
      type: string
      description: Review request 可提交的審核決定；pending 不是可提交的決定。
      enum:
        - approved
        - rejected
    ShortAssetReviewReason:
      description: |
        結構化退件理由。Backend 會 trim note；所有 note 最多 500 字元，`other` 必須提供非空白 note。
      oneOf:
        - type: object
          required:
            - code
          properties:
            code:
              description: 除 `other` 以外的退件理由代碼。
              type: string
              enum:
                - contentIncorrect
                - audioIssue
                - visualQuality
                - subtitleIssue
                - incomplete
            note:
              type: string
              maxLength: 500
        - type: object
          required:
            - code
            - note
          properties:
            code:
              type: string
              const: other
            note:
              type: string
              minLength: 1
              maxLength: 500
              pattern: '.*\S.*'
    ShortAssetReviewCourseSummary:
      type: object
      required:
        - courseId
        - title
      properties:
