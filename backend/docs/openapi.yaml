          type: boolean
        queryEmbeddingProvider:
          anyOf:
            - type: string
            - type: 'null'
        vectorSearchMode:
          anyOf:
            - type: string
            - type: 'null'
        answerProvider:
          anyOf:
            - type: string
            - type: 'null'
        hardFailureCodes:
          type: array
          items:
            type: string
    LineWebhookResult:
      description: 單一 LINE event 經 backend 處理後的結果摘要。
      type: object
      required:
        - type
        - handled
        - replySent
        - replySkipped
        - replyReason
      properties:
