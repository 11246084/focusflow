<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft JhengHei, Segoe UI, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5E8F9C"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FBF8F2"/>
  <g id="header" data-pptx-bounds="56 40 1028 124">
    <rect x="64" y="48" width="48" height="6" fill="#E8A93C"/>
    <text x="64" y="84" font-size="20" font-weight="bold" fill="#5E8F9C">怎麼確認「真的有效」</text>
    <text x="64" y="142" font-size="46" font-weight="bold" fill="#1B4D5C">測試通過，不等於可以上線</text>
  </g>
  <g id="chrome" data-pptx-role="chrome" data-pptx-bounds="1090 30 140 56">
    <text x="1162" y="66" font-size="18" text-anchor="end" fill="#5A6066">09 / 10</text>
    <image href="../images/mark-color.png" x="1172" y="38" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="four-states" data-pptx-bounds="56 176 572 432">
    <text x="64" y="204" font-size="22" font-weight="bold" fill="#1B4D5C">同一個功能，要走過四種狀態</text>
    <rect x="148" y="222" width="472" height="86" rx="4" fill="#1B4D5C"/>
    <text x="164" y="256" font-size="22" font-weight="bold" fill="#E8A93C">④ 正式驗收<tspan x="164" dy="32" font-weight="normal" fill="#FFFFFF">10-25 cookie 登入：正式站逐項驗收</tspan></text>
    <rect x="120" y="318" width="500" height="86" rx="4" fill="#F5EFE3" stroke="#D9D1C1"/>
    <text x="136" y="352" font-size="22" font-weight="bold" fill="#1B4D5C">③ 外部服務可用<tspan x="136" dy="32" font-weight="normal" fill="#15171A">09-09 正式問答驗證：首次失敗→同日修正</tspan></text>
    <rect x="92" y="414" width="528" height="86" rx="4" fill="#F5EFE3" stroke="#D9D1C1"/>
    <text x="108" y="448" font-size="22" font-weight="bold" fill="#1B4D5C">② 自動化測試通過<tspan x="108" dy="32" font-weight="normal" fill="#15171A">08-09 Backend 371 項通過</tspan></text>
    <rect x="64" y="510" width="556" height="86" rx="4" fill="#F5EFE3" stroke="#D9D1C1"/>
    <text x="80" y="544" font-size="22" font-weight="bold" fill="#1B4D5C">① 程式完成<tspan x="80" dy="32" font-weight="normal" fill="#15171A">08-09 PR #6 合併</tspan></text>
  </g>
  <g id="deploy-evolution" data-pptx-bounds="656 176 568 196">
    <text x="664" y="204" font-size="22" font-weight="bold" fill="#1B4D5C">部署流程一步步補上檢查</text>
    <rect x="664" y="222" width="172" height="104" rx="4" fill="#F5EFE3" stroke="#D9D1C1"/>
    <text x="678" y="254" font-size="22" font-weight="bold" fill="#1B4D5C">05-28<tspan x="678" dy="30" font-weight="normal" fill="#15171A">純部署</tspan></text>
    <rect x="854" y="222" width="172" height="104" rx="4" fill="#F5EFE3" stroke="#D9D1C1"/>
    <text x="868" y="254" font-size="22" font-weight="bold" fill="#1B4D5C">09-09<tspan x="868" dy="30" font-weight="normal" fill="#15171A">＋部署後</tspan><tspan x="868" dy="28" font-weight="normal" fill="#15171A">健康檢查</tspan></text>
    <rect x="1044" y="222" width="172" height="104" rx="4" fill="#F5EFE3" stroke="#D9D1C1"/>
    <text x="1058" y="254" font-size="22" font-weight="bold" fill="#1B4D5C">10-24<tspan x="1058" dy="30" font-weight="normal" fill="#15171A">＋部署前</tspan><tspan x="1058" dy="28" font-weight="normal" fill="#15171A">同來源檢查</tspan></text>
    <g stroke="#5E8F9C" stroke-width="2">
      <line x1="838" y1="274" x2="850" y2="274" marker-end="url(#arrowSmall)"/>
      <line x1="1028" y1="274" x2="1040" y2="274" marker-end="url(#arrowSmall)"/>
    </g>
    <text x="664" y="360" font-size="22" fill="#15171A">GitHub Actions：<tspan font-weight="bold" fill="#1B4D5C">155 次執行、148 次成功</tspan></text>
  </g>
  <g id="backend-test-growth" data-pptx-bounds="656 380 568 238">
    <text x="664" y="408" font-size="22" font-weight="bold" fill="#1B4D5C">Backend 全套測試數</text>
    <g id="backend-test-growth-chartArea">
      <line x1="700" y1="560" x2="1180" y2="560" stroke="#D9D1C1" stroke-width="2"/>
      <!-- chart-plot-area: object=backend-test-growth | 700,430,1180,560 -->
      <polyline points="700,555.67 1051.68,504.32 1180,435" fill="none" stroke="#5E8F9C" stroke-width="3"/>
