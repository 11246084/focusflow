          items:
            $ref: '#/components/schemas/DiagnosticItem'
    ShortsSyncRuntimeSnapshot:
      description: ShortAsset 的 YouTube metadata sync 診斷快照；不代表自動剪輯或發布 worker 已完成。
      type: object
      required:
        - enabled
        - lastAttemptAt
        - lastSuccessAt
        - lastError
        - degraded
      properties:
        enabled:
          type: boolean
        lastAttemptAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lastError:
          anyOf:
            - type: string
            - type: 'null'
        degraded:
          type: boolean
    YouTubeUploadRuntimeSnapshot:
      description: >-
        YouTube 自動上傳與「刪除時轉 private」的憑證診斷快照。狀態只保留 process 內最後一次結果，不持久化。
        server 啟動時會做一次非阻塞 OAuth token 交換，因此開機後即有 `credentialCheck` 可看（只換 access token，不消耗 YouTube 配額）。
      type: object
      required:
        - uploadEnabled
        - privatizeOnDeleteEnabled
        - credentialsConfigured
        - readiness
        - credentialCheck
        - lastPrivatize
      properties:
        uploadEnabled:
          type: boolean
          description: "`YOUTUBE_UPLOAD_ENABLED`"
        privatizeOnDeleteEnabled:
          type: boolean
          description: "`YOUTUBE_PRIVATIZE_ON_DELETE`"
        credentialsConfigured:
          type: boolean
          description: OAuth client id/secret/refresh token 齊備，或設了 access token override。
        usingAccessTokenOverride:
          type: boolean
        uploadReady:
          type: boolean
        privatizeOnDeleteReady:
          type: boolean
        privatizeScopeSatisfied:
          description: >-
            授權 scope 是否足以呼叫 `videos.update`（轉 private）。尚未做過 token 交換時為 null；
            只帶 `youtube.upload` 時為 false，代表刪除影片後不會轉成 private。
          anyOf:
            - type: boolean
            - type: 'null'
        readiness:
          type: string
          enum:
            - ready
            - degraded
            - hard_fail
            - not_enabled
        credentialCheck:
          type: object
          required:
            - status
            - lastAttemptAt
            - lastSuccessAt
            - lastError
            - grantedScopes
          properties:
            status:
              type: string
              enum:
                - ok
                - failed
                - unknown
            lastAttemptAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastSuccessAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastError:
              anyOf:
                - type: string
                - type: 'null'
            grantedScopes:
              type: array
              items:
                type: string
        lastPrivatize:
          description: 最後一次「刪除影片時轉 private」的結果。失敗只寫 log 不中斷刪除，此處是唯一集中觀察點。
          type: object
          required:
            - youtubeVideoId
            - lastAttemptAt
            - lastSuccessAt
            - lastError
          properties:
            youtubeVideoId:
              anyOf:
                - type: string
                - type: 'null'
            lastAttemptAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastSuccessAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            lastError:
              anyOf:
                - type: string
                - type: 'null'
        missingConfig:
          type: array
          items:
            type: string
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    ShortsCourseSummary:
