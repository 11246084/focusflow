        讀取單一影片的 processing metadata。

        這是偏向 operational / observability 的端點，不是一般 student-facing 路徑。只有課程 owner teacher 或 admin 可以查看 app-owned video 的 processing state；`metadataOnly` 的 bridge video 會刻意回 `409 VIDEO_METADATA_ONLY`。
