      summary: 以 YouTube URL 建立課程影片
      description: |
        教師 / admin 可先手動將影片上傳到 YouTube（建議設為不公開 unlisted），再貼 URL 到 FocusFlow。
        Backend 會解析 `youtubeVideoId`、建立 Video document，並自動啟動 STT pipeline 的 `--youtube-url` 流程。
      operationId: createYouTubeVideo
