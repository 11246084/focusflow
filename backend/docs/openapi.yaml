        submitter:
          description: |
            回報者。列表端點會 populate 使用者資料；PATCH 回應不會 populate，此時 `name`、`email` 為 `—`，
            `role` 為回報當下的角色。
          type: object
          required:
            - id
            - name
            - email
            - role
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
            email:
              type: string
            role:
              $ref: '#/components/schemas/UserRole'
        attachments:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/FeedbackAttachmentMeta'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FeedbackCreateRequest:
      description: 建立回報的欄位。
      type: object
      required:
        - category
        - severity
        - description
      properties:
        category:
          $ref: '#/components/schemas/FeedbackCategory'
        severity:
          $ref: '#/components/schemas/FeedbackSeverity'
        description:
          description: 問題描述；trim 後不可為空，最多 2000 字元。
          type: string
          minLength: 1
          maxLength: 2000
        pageContext:
          description: 回報時所在的頁面；超過 200 字元會被截斷。
          type: string
        courseVideoName:
          description: 相關的課程或影片名稱；超過 200 字元會被截斷。
          type: string
    FeedbackCreateMultipartRequest:
      description: 附截圖時使用的 multipart 欄位。
      allOf:
        - $ref: '#/components/schemas/FeedbackCreateRequest'
        - type: object
          properties:
            attachments:
              description: 最多 3 張 JPEG、PNG 或 WebP 截圖，單檔最多 10 MiB。
              type: array
              maxItems: 3
              items:
                type: string
                format: binary
    AdminFeedbackUpdateRequest:
      description: "`status` 與 `adminNote` 至少提供一個。"
      type: object
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/FeedbackStatus'
        adminNote:
          description: 管理員備註；空字串或 `null` 會清除備註。
          type: [string, 'null']
    FeedbackItemResponse:
      description: 建立回報的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/Feedback'
    AdminFeedbackListResponse:
      description: Admin 回報列表的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
            - meta
          properties:
            data:
              type: object
              required:
                - feedback
              properties:
                feedback:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminFeedbackItem'
            meta:
              type: object
              required:
                - total
                - page
                - limit
              properties:
                total:
                  type: integer
                  minimum: 0
                page:
                  type: integer
                  minimum: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
    AdminFeedbackItemResponse:
      description: Admin 更新回報的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/AdminFeedbackItem'
    ShortScriptStatus:
      description: |
        短影片腳本生命週期。`approved` 只會在對應成品上架後由系統設定，不能透過審核端點設定；`dismissed` 為終態。
      type: string
      enum:
        - evidence_ready
        - generated
        - changes_requested
        - approved
        - dismissed
    ShortScriptFeedbackType:
      description: "`retrieval` 代表證據撈錯、下次生成前重新檢索；`narrative` 代表只重寫敘事。"
      type: string
      enum:
        - retrieval
        - narrative
    ShortScriptEvidence:
      description: 凍結的證據片段快照；來源影片之後被刪除或重新處理都不影響已凍結內容。
      type: object
      required:
        - code
        - chunkId
        - videoId
        - videoTitle
        - startSec
        - endSec
        - rawText
        - expandedFrom
      properties:
        code:
          description: 證據代號（A、B、C…），腳本以此引用。
          type: string
        chunkId:
          type: string
        videoId:
          type: [string, 'null']
        videoTitle:
          type: [string, 'null']
        startSec:
          type: [number, 'null']
        endSec:
          type: [number, 'null']
        rawText:
          description: 未經修飾的 STT 原文。
          type: string
        expandedFrom:
          description: 由鄰接擴展補進時，記錄是從哪個命中片段擴展；直接命中為 `null`。
          type: [string, 'null']
    ShortScriptSourceQuestion:
      description: 被合併進此主題的原始提問。
      type: object
      required:
        - question
        - askCount
        - uniqueAskerCount
      properties:
        question:
          type: string
        askCount:
          type: integer
          minimum: 0
        uniqueAskerCount:
          type: integer
          minimum: 0
    ShortScriptSelectionReason:
      description: 系統選中這個主題的依據，供教師追溯排名。舊資料可能缺少較晚加入的欄位。
      type: object
      properties:
        selectedTopicKey:
          type: string
        totalAskCount:
          type: integer
          minimum: 0
        uniqueAskerCount:
          type: integer
          minimum: 0
        variantCount:
          type: integer
          minimum: 0
        lastAskedAt:
          type: [string, 'null']
          format: date-time
        evidenceCount:
          type: integer
          minimum: 0
        directMatchCount:
          type: integer
          minimum: 0
        rank:
          description: 在完整候選清單中的名次（從 1 開始）。
          type: integer
          minimum: 1
        selectedBy:
          description: "`teacher` 表示教師指定 `topicKey`；`auto` 表示系統依排序自動選。"
          type: string
          enum:
            - teacher
            - auto
        rejectedForEvidence:
          description: 因證據不足被淘汰的前序候選。
          type: array
          items:
            type: object
            required:
              - rank
              - topicKey
              - question
              - evidenceCount
              - reason
            properties:
              rank:
                type: integer
                minimum: 1
              topicKey:
                type: string
              question:
                type: string
              evidenceCount:
                type: integer
                minimum: 0
              reason:
                type: string
                enum:
                  - insufficient_evidence
        runnersUp:
          description: 未被選中的前三名候選。
          type: array
          maxItems: 3
          items:
            type: object
            required:
              - rank
              - topicKey
              - question
              - totalAskCount
              - uniqueAskerCount
            properties:
              rank:
                type: integer
                minimum: 1
              topicKey:
                type: string
              question:
                type: string
              totalAskCount:
                type: integer
                minimum: 0
              uniqueAskerCount:
                type: integer
                minimum: 0
        excludedTopicKeyCount:
          description: 因課程已有腳本而被排除的主題數。
          type: integer
          minimum: 0
        selectedAt:
          type: string
          format: date-time
    ShortScriptShot:
      description: 8 拍腳本中的一鏡。`arcRole`、`timeRange`、`cut` 依位置由 backend 寫入，不採用模型輸出。
      type: object
      required:
        - shotNo
        - arcRole
        - timeRange
        - cut
        - brollStage
        - brollNote
        - narration
        - subtitle
        - hookQuestion
        - sfx
        - basedOn
      properties:
        shotNo:
          type: integer
          minimum: 1
        arcRole:
          type: [string, 'null']
          enum:
            - hook
            - context
            - reveal
            - reversal
            - evidence
            - climax
            - conclusion
            - ending
            - null
        timeRange:
          type: [string, 'null']
          examples:
            - '0:00–0:03'
        cut:
          type: string
        brollStage:
          type: string
          enum:
            - S1
            - S2
            - S3
        brollNote:
          type: string
        narration:
          type: string
        subtitle:
          type: string
        hookQuestion:
          type: string
        sfx:
          type: string
        basedOn:
          description: 引用的證據代號；純模板鏡頭為字串 `template`。
          oneOf:
            - type: string
              const: template
            - type: array
              items:
                type: string
    ShortScriptPayload:
      description: 正規化後的腳本內容。
      type: object
      required:
        - globalSettings
        - writingPlan
        - stageMeanings
        - visualMetaphorOptions
        - shots
        - reversalBasedOn
      properties:
        globalSettings:
          description: 模型輸出的全域設定，原樣保存。
          type: [object, 'null']
        writingPlan:
          description: 模板 §3 的四個固定寫作問題的回答。
          type: object
          required:
            - curiosity
            - delayedAnswer
            - reversal
            - takeaway
          properties:
            curiosity:
              type: string
            delayedAnswer:
              type: string
            reversal:
              type: string
            takeaway:
              type: string
        stageMeanings:
          type: object
          required:
            - s1
            - s2
            - s3
          properties:
            s1:
              type: string
            s2:
              type: string
            s3:
              type: string
        visualMetaphorOptions:
          type: array
          items:
            type: object
            required:
              - label
              - s1
              - s2
              - s3
              - rationale
            properties:
              label:
                type: string
              s1:
                type: string
              s2:
                type: string
              s3:
                type: string
              rationale:
                type: string
        shots:
          type: array
          items:
            $ref: '#/components/schemas/ShortScriptShot'
        reversalBasedOn:
          description: 反轉鏡頭引用的證據代號。
          type: array
          items:
            type: string
    ShortScriptVersion:
      description: |
        腳本的一個生成版本，以及教師（或成品審核）對這一版的回饋。
        回應直接讀 MongoDB 文件，schema 較晚加入的欄位在舊資料上可能不存在，因此只有 `versionNo`、`payload` 保證出現。
      type: object
      required:
        - versionNo
        - payload
      properties:
        versionNo:
          type: integer
          minimum: 1
        payload:
          anyOf:
            - $ref: '#/components/schemas/ShortScriptPayload'
            - type: 'null'
        generatedAt:
          type: [string, 'null']
          format: date-time
        feedback:
          type: [string, 'null']
        feedbackType:
          anyOf:
            - $ref: '#/components/schemas/ShortScriptFeedbackType'
            - type: 'null'
        reviewedBy:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        reviewedAt:
          type: [string, 'null']
          format: date-time
        evidenceFrozenAt:
          description: 這一版使用的證據凍結時間。
          type: [string, 'null']
          format: date-time
        rejectedAsAsset:
          description: 這一版的回饋來自成品影片被退回，而不是腳本審核。
          type: boolean
    ShortScript:
      description: |
        短影片腳本（MongoDB 文件原樣輸出，未經 mapper）。讀取時不會補上 schema default，
        因此 `required` 只列建立時一定寫入的欄位；其餘欄位在舊資料上可能不存在。
      type: object
      required:
        - _id
        - courseId
        - topic
        - topicKey
        - evidence
        - versions
        - status
        - createdAt
        - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        courseId:
          $ref: '#/components/schemas/ObjectId'
        topic:
          description: 主題的代表問句。
          type: string
        topicKey:
          description: 代表問句的正規化文字；同一課程內唯一。
          type: string
        sourceQuestions:
          type: array
          items:
            $ref: '#/components/schemas/ShortScriptSourceQuestion'
        selectionReason:
          anyOf:
            - $ref: '#/components/schemas/ShortScriptSelectionReason'
            - type: 'null'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ShortScriptEvidence'
        evidenceFrozenAt:
          type: [string, 'null']
          format: date-time
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ShortScriptVersion'
        status:
          $ref: '#/components/schemas/ShortScriptStatus'
        dismissReason:
          type: [string, 'null']
        createdBy:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          description: Mongoose 版本鍵。
          type: integer
          minimum: 0
    ShortScriptTopicVariant:
      description: 合併進候選主題的一種問法。
      type: object
      required:
        - question
        - normalizedQuestion
        - askCount
        - uniqueAskerCount
        - lastAskedAt
      properties:
        question:
          type: string
        normalizedQuestion:
          type: string
        askCount:
          type: integer
          minimum: 0
        uniqueAskerCount:
          type: integer
          minimum: 0
        lastAskedAt:
          type: [string, 'null']
          format: date-time
    ShortScriptTopicCandidate:
      description: 自動選題候選（已完成同義題合併）。
      type: object
      required:
        - topicKey
        - question
        - normalizedQuestion
        - totalAskCount
        - uniqueAskerCount
        - variants
        - lastAskedAt
      properties:
        topicKey:
          type: string
        question:
          type: string
        normalizedQuestion:
          type: string
        totalAskCount:
          type: integer
          minimum: 0
        uniqueAskerCount:
          description: 跨所有問法去重後的提問人數。
          type: integer
          minimum: 0
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ShortScriptTopicVariant'
        lastAskedAt:
          type: [string, 'null']
          format: date-time
    ShortScriptCreateRequest:
      type: object
      properties:
        topicKey:
          description: 教師指定的候選 `topicKey`；省略或空白時由系統依排序自動選題。
          type: string
    ShortScriptReviewRequest:
      description: "`request_changes` 必須同時提供 `feedback` 與 `feedbackType`。"
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - request_changes
            - dismiss
        feedback:
          description: 修改意見；`dismiss` 時存成否決理由。
          type: string
        feedbackType:
          $ref: '#/components/schemas/ShortScriptFeedbackType'
    ShortScriptAssetUploadRequest:
      description: 依腳本上傳成品影片的 multipart 欄位；multipart 欄位皆以字串傳送。
      type: object
      required:
        - video
        - aiDisclosureConfirmed
        - consentConfirmed
      properties:
        video:
          description: 影片檔（MIME type 必須為 `video/*`），最大 500 MB。
          type: string
          format: binary
        title:
          description: 成品標題；省略時使用腳本主題。
          type: string
        description:
          type: string
        versionNo:
          description: 依據的腳本版本；省略時使用最新一版。
          type: integer
          minimum: 1
        aiDisclosureConfirmed:
          description: 確認已加上 AI 生成揭露標示。必須為 `true`（不分大小寫），其他值都視為未確認。
          type: string
          examples:
            - 'true'
        consentConfirmed:
          description: 確認已取得教師數位分身書面同意。必須為 `true`（不分大小寫），其他值都視為未確認。
          type: string
          examples:
            - 'true'
    TeacherShortAsset:
      description: 教師視角的 ShortAsset，包含審核、揭露確認與 YouTube 上傳狀態。
      type: object
      required:
        - id
        - courseId
        - title
        - description
        - status
        - reviewStatus
        - generationVersion
        - reviewedGenerationVersion
        - sourceScriptId
        - sourceVersionNo
        - youtubeVideoId
        - youtubeUrl
        - privacyStatus
        - publishedAt
        - disclosure
        - upload
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        courseId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ShortAssetLifecycleStatus'
        reviewStatus:
          $ref: '#/components/schemas/ShortAssetReviewStatus'
        generationVersion:
          type: integer
          minimum: 1
        reviewedGenerationVersion:
          type: [integer, 'null']
        sourceScriptId:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        sourceVersionNo:
          type: [integer, 'null']
        youtubeVideoId:
          type: [string, 'null']
        youtubeUrl:
          type: [string, 'null']
          format: uri
        privacyStatus:
          type: [string, 'null']
          enum:
            - public
            - unlisted
            - private
            - unknown
            - null
        publishedAt:
          type: [string, 'null']
          format: date-time
        disclosure:
          type: object
          required:
            - aiDisclosureConfirmed
            - consentConfirmed
            - confirmedAt
          properties:
            aiDisclosureConfirmed:
              type: boolean
            consentConfirmed:
              type: boolean
            confirmedAt:
              type: [string, 'null']
              format: date-time
        upload:
          description: YouTube 上傳狀態；`status` 為 `null` 代表尚未嘗試。
          type: object
          required:
            - status
            - error
            - attemptCount
            - retrySafe
          properties:
            status:
              type: [string, 'null']
              enum:
                - uploading
                - uploaded
                - failed
                - null
            error:
              type: [string, 'null']
            attemptCount:
              type: integer
              minimum: 0
            retrySafe:
              description: 上次失敗確定沒有送出影片 bytes，可以安全重試。
              type: boolean
        createdAt:
          type: [string, 'null']
          format: date-time
    ShortScriptResponse:
      description: 單一短影片腳本的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ShortScript'
    ShortScriptListResponse:
      description: 課程腳本列表的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
            - meta
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ShortScript'
            meta:
              type: object
              required:
                - total
              properties:
                total:
                  type: integer
                  minimum: 0
    ShortScriptCandidateListResponse:
      description: 自動選題候選預覽的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
            - meta
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ShortScriptTopicCandidate'
            meta:
              type: object
              required:
                - totalClusters
                - similarityThreshold
                - usableQuestionCount
              properties:
                totalClusters:
                  description: 合併後的主題群數（過濾與截斷前）。
                  type: integer
                  minimum: 0
                similarityThreshold:
                  description: 同義題合併使用的 cosine 相似度門檻；未啟用語意合併時為 `null`。
                  type: [number, 'null']
                usableQuestionCount:
                  description: 納入選題計算的提問總次數。
                  type: integer
                  minimum: 0
    TeacherShortAssetResponse:
      description: 單一成品的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/TeacherShortAsset'
    TeacherShortAssetListResponse:
      description: 課程成品列表的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
            - meta
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TeacherShortAsset'
            meta:
              type: object
              required:
                - total
              properties:
                total:
                  type: integer
                  minimum: 0
    AdminUser:
      description: Admin 後台的使用者列表項目。`courses`、`queries` 只有列表端點會回傳。
      type: object
      required:
        - id
        - name
        - email
        - role
        - isActive
        - isLineBound
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        isLineBound:
          description: 是否已綁定 LINE 帳號；不暴露實際 LINE user id。
          type: boolean
        courses:
          description: 有效修課數（依 Enrollment.studentId 統計）。
          type: integer
          minimum: 0
        queries:
          description: 網頁提問次數（`usage_logs` 的 `ask` 事件）。
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
