  /api/v1/auth/login:
    post:
      tags:
        - Auth
      security: []
      summary: 使用 email 與 password 登入
      description: 成功後回傳 JWT bearer token 與目前登入者的 public user 資訊。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              teacherLogin:
                value:
                  email: teacher@focusflow.local
                  password: Teacher123!
                  role: teacher
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
              examples:
                success:
                  summary: 登入成功範例
                  description: 回傳 token 與目前登入者的 public user 資訊，供 frontend 後續帶入 BearerAuth。
                  value:
                    success: true
                    message: Login successful.
                    data:
                      token: <jwt-token>
                      user:
                        id: 507f1f77bcf86cd799439011
                        name: Demo Teacher
                        email: teacher@focusflow.local
                        role: teacher
                        isActive: true
                        hasAvatar: false
                        avatarUpdatedAt: null
                        isLineBound: false
                        lineBindAt: null
                        activeCourseId: null
                        lineConversationState: idle
                        createdAt: '2026-04-06T09:00:00.000Z'
                        updatedAt: '2026-04-17T02:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '429':
          description: |
            同一 Email 在 15 分鐘內連續輸錯 5 次，帳號暫時鎖定 15 分鐘（`TOO_MANY_LOGIN_ATTEMPTS`，第 5 次輸錯即回此錯誤）。
            `error.details` 在 production 也會回傳 `retryAfterSec`、`lockMinutes`；尚未鎖定的 401 `INVALID_CREDENTIALS`
            也會帶 `details.remainingAttempts`、`maxAttempts`、`lockMinutes`，供前端提醒剩餘次數（不存在的 Email 同樣計數，不洩漏帳號是否存在）。
            次數與時間可由 `LOGIN_MAX_FAILED_ATTEMPTS`、`LOGIN_FAILURE_WINDOW_MINUTES`、`LOGIN_LOCK_MINUTES` 調整。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                locked:
                  value:
                    success: false
                    message: Too many failed login attempts. Please try again later.
                    error:
                      code: TOO_MANY_LOGIN_ATTEMPTS
        '403':
          description: 帳號停用，或帳號角色與登入入口不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                inactive:
                  value:
                    success: false
                    message: User is inactive.
                    error:
                      code: USER_INACTIVE
                roleMismatch:
                  value:
                    success: false
                    message: Account type does not match the selected role.
                    error:
                      code: ROLE_MISMATCH
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      security: []
      summary: 自助註冊（限 student / teacher）
      description: |
        新使用者自行建立帳號。`role` 僅接受 `student` 或 `teacher`；`admin` 必須由現有管理員建立，不開放自助註冊。

        成功時直接回 JWT 與 public user，前端可立即跳到 dashboard。
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            examples:
              studentRegister:
                value:
                  name: 王小明
                  email: student-new@focusflow.local
                  password: Student123!
                  role: student
      responses:
        '201':
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
              examples:
                success:
                  summary: 註冊成功範例
                  value:
                    success: true
                    message: Registration successful.
                    data:
                      token: <jwt-token>
                      user:
                        id: 507f1f77bcf86cd799439099
                        name: 王小明
                        email: student-new@focusflow.local
                        role: student
                        isActive: true
                        hasAvatar: false
                        avatarUpdatedAt: null
                        isLineBound: false
                        lineBindAt: null
                        activeCourseId: null
                        lineConversationState: idle
                        createdAt: '2026-05-07T09:00:00.000Z'
                        updatedAt: '2026-05-07T09:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email 已被使用（DUPLICATE_RESOURCE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  value:
                    success: false
                    message: Email is already registered.
                    error:
                      code: DUPLICATE_RESOURCE
  /api/v1/auth/password-reset/request:
    post:
      tags:
        - Auth
      security: []
      summary: 忘記密碼：寄送 6 位數驗證碼
      description: |
        不需登入。Email 已註冊且帳號啟用時寄出驗證碼（10 分鐘有效），同一帳號 60 秒內重複申請不重寄。
        為避免帳號探測，Email 不存在時也回相同的 200 訊息。未設定 SMTP 時回 503。
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 若 Email 已註冊，驗證碼已寄出
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: 驗證信寄送失敗（PASSWORD_RESET_EMAIL_FAILED），驗證碼已作廢
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 未設定寄信帳號（PASSWORD_RESET_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
        - Auth
      security: []
      summary: 忘記密碼：以驗證碼設定新密碼
      description: 驗證碼錯誤累計 5 次即作廢；成功後驗證碼立即失效，新密碼以 bcrypt 雜湊儲存。
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: 密碼已重設
        '400':
          description: 新密碼驗證錯誤（VALIDATION_ERROR）或驗證碼無效／過期（PASSWORD_RESET_CODE_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: 讀取目前登入使用者
      description: 需要有效的 bearer token。
      operationId: getCurrentUser
      responses:
        '200':
          description: 成功取得目前登入使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: 缺少 token、token 無效或過期，或 token 對應的使用者已不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: 未提供 Bearer token
                  description: 呼叫端未帶入 Bearer token，因此 backend 直接回 `UNAUTHORIZED`。
                  value:
                    success: false
                    message: Authentication required.
                    error:
                      code: UNAUTHORIZED
                invalidToken:
                  summary: Bearer token 無效或已過期
                  description: token 驗證失敗時，backend 會回 `INVALID_TOKEN`。
                  value:
                    success: false
                    message: Invalid or expired token.
                    error:
                      code: INVALID_TOKEN
        '404':
          $ref: '#/components/responses/UserNotFoundError'
    patch:
      tags:
        - Auth
      summary: 修改自己的姓名或 Email
      description: 需登入。只改姓名不需密碼；Email 為登入帳號，變更時必須提供正確的 currentPassword。Email 已被使用時回 409 DUPLICATE_RESOURCE。
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                currentPassword:
                  type: string
                  description: 變更 Email 時必填
      responses:
        '200':
          description: 已更新，回傳 data.user（公開欄位）
        '400':
          description: 驗證錯誤（VALIDATION_ERROR）或目前密碼錯誤（CURRENT_PASSWORD_INCORRECT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Email 已被其他帳號使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me/password:
    patch:
      tags:
        - Auth
      summary: 修改自己的密碼
      description: 需登入並提供目前密碼；新密碼至少 8 碼且不可與目前密碼相同，只以 bcrypt 雜湊儲存。
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: 密碼已更新
        '400':
          description: 驗證錯誤（VALIDATION_ERROR）或目前密碼錯誤（CURRENT_PASSWORD_INCORRECT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/me/avatar:
    get:
      tags:
        - Auth
      summary: 讀取目前登入使用者的頭貼
      operationId: getCurrentUserAvatar
      responses:
        '200':
          description: 頭貼 binary；實際 Content-Type 為 image/jpeg、image/png 或 image/webp
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, max-age=0, must-revalidate
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 目前使用者沒有可讀取的頭貼（AVATAR_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Auth
      summary: 上傳或替換目前登入使用者的頭貼
      operationId: updateCurrentUserAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPEG、PNG 或 WebP，最大 1 MiB（前端上傳前會縮成 256×256）；伺服器會驗證 MIME 與檔案 signature，圖片本體存於 MongoDB `avatars` collection。
      responses:
        '200':
          description: 頭貼更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUpdateResponse'
        '400':
          description: 缺檔、格式不符、multipart 錯誤或內容 signature 不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '413':
          description: 檔案超過 1 MiB（AVATAR_TOO_LARGE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/notifications:
    get:
      tags:
        - Notifications
      summary: 列出目前登入使用者的站內通知
      operationId: listNotifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 後端回傳的 opaque cursor，不應由 client 自行解析。
          schema:
            type: string
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 通知列表、總未讀數與下一頁 cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/notifications/{notificationId}/read:
    patch:
      tags:
        - Notifications
      summary: 將目前登入使用者的一筆通知標為已讀
      operationId: markNotificationRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: 已讀狀態更新成功；重複呼叫保持首次 readAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 通知不存在，或不屬於目前登入使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/notifications/read-all:
    post:
      tags:
        - Notifications
      summary: 將目前登入使用者的所有未讀通知標為已讀
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: 全部已讀更新結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/admin/notifications:
    post:
      tags:
        - Admin
        - Notifications
      summary: 管理員發送系統／維護公告
      description: 僅發送給 `role=student` 且 `isActive=true` 的使用者。
      operationId: broadcastSystemNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNotificationRequest'
      responses:
        '201':
          description: 公告已建立並發送給目前所有 active students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/courses:
    get:
      tags:
        - Courses
      summary: 列出目前可存取的課程
      description: |
        依照目前登入者的角色與存取規則，回傳可見的課程列表。

        student 僅回傳 `active Enrollment ∩ Course.status=published`；公開狀態本身不是學生存取授權。teacher / admin 依各自管理範圍回傳。

        這個回應在 Phase-1 是 `bridge-aware`，可能會帶出 `qaScopeOnly`、`bridgeMode` 等欄位，讓 frontend 或 demo 使用者可以區分一般課程與 QA-only 的 bridge 呈現。
      operationId: listCourses
      responses:
        '200':
          description: 成功取得課程列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Courses
      summary: 建立課程
      description: 僅限 teacher / admin 使用的課程建立端點。
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: 課程建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/courses/{courseId}:
    get:
      tags:
        - Courses
      summary: 依 courseId 讀取單一課程
      description: |
        回傳目前使用者可存取的單一課程。

        這個回應在 Phase-1 仍是 `bridge-aware`，可能帶出 `qaScopeOnly`、`bridgeMode` 與 bridge contract 提示欄位。
      operationId: getCourseById
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功取得課程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    patch:
      tags:
        - Courses
      summary: 部分更新課程
      description: 僅限 teacher（owner）/ admin 使用。可更新標題、描述、狀態等課程欄位。
      operationId: updateCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '200':
          description: 課程更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    delete:
      tags:
        - Courses
      summary: 刪除課程（cascade）
      description: |
        僅限 admin 或該課程的 owner teacher 使用。

        刪除會 cascade 清理對應的 Video / Segment / transcripts、`course.videoIds`、`Enrollment` 與 `User.activeCourseId`；
        但**保留** UsageLog / Question 歷史紀錄（改由 display 層分流顯示「內容已下架」）。
      operationId: deleteCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 課程刪除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        description: cascade 刪除結果摘要（清理的關聯資源數量等）。
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/courses/{courseId}/enrollments:
    get:
      tags:
        - Courses
      summary: 列出課程目前有效的修課學生
      description: 僅限該課程 owner teacher 或 admin；只回 active（含 legacy 未設 status）Enrollment，不提供全站學生清單。
      operationId: listCourseEnrollments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 有效修課名單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    post:
      tags:
        - Courses
      summary: 以完整 Email 指派學生修課
      description: 僅限該課程 owner teacher 或 admin。重複指派為冪等操作；已撤銷的紀錄會重新啟用。不提供學生自助選課、邀請碼或一般註冊自動加入。
      operationId: assignCourseEnrollment
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentAssignRequest'
      responses:
        '200':
          description: 修課資格已建立或重新啟用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          description: 課程或 active student 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/courses/{courseId}/enrollments/import:
    post:
      tags:
        - Courses
      summary: 匯入修課名單（建立缺少的學生帳號並加入課程）
      description: >-
        僅限該課程 owner teacher 或 admin，單次最多 200 筆。Email 不存在時建立 student 帳號，
        初始密碼為學號（至少 8 碼）；Email 已存在的 active student 只會加入課程，不修改密碼、姓名或角色。
        非 student 帳號、停用帳號與不合法資料列會列在 skipped，不中斷其他列。
      operationId: importCourseEnrollments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - students
              properties:
                students:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [name, email, studentId]
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      studentId:
                        type: string
                        description: 學號，新帳號的初始密碼
      responses:
        '200':
          description: 匯入完成（可能部分列被略過）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                      enrolled:
                        type: integer
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                            email:
                              type: string
                            reason:
                              type: string
                              enum: [INVALID_NAME, INVALID_EMAIL, STUDENT_ID_TOO_SHORT, DUPLICATE_IN_FILE, NOT_STUDENT, INACTIVE_ACCOUNT, DUPLICATE_ACCOUNT]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/courses/{courseId}/enrollments/{studentId}:
    delete:
      tags:
        - Courses
      summary: 撤銷學生修課資格
      description: 僅限該課程 owner teacher 或 admin。採 soft revoke；立即清除相符的 `User.activeCourseId` 與 LINE 對話上下文，但保留 Question / UsageLog 歷史。
      operationId: revokeCourseEnrollment
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: studentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: 修課資格已撤銷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentItemResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          description: 課程、學生或 active Enrollment 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/courses/{courseId}/videos:
    get:
      tags:
        - Videos
      summary: 列出課程下的影片
      description: |
        回傳單一課程下的影片列表，並保留 Phase-1 的 `bridge-aware` 呈現方式。

        在 Phase-1，同一門課可能同時出現：
        - 帶有 processing metadata 的 app-owned video
        - 只用來做 QA 範圍呈現的 `metadataOnly` bridge video

        建議同時檢查 response 的 `meta` 區塊，以及每支影片上的 `metadataOnly`、`qaScopeOnly`、`isAppOwned` 等旗標。
      operationId: listCourseVideos
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功取得影片列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    post:
      tags:
        - Videos
      summary: 上傳課程影片
      description: |
        僅限 teacher / admin 使用，並且用於建立 app-owned course video 的上傳端點。
        此端點先建立使用本機播放來源、`processing=queued` 的 `Video`，再啟動 STT / embedding。
        若 `YOUTUBE_UPLOAD_ENABLED=true` 且 OAuth 設定完整，只有 processing 成功完成後，backend 才會背景使用 FocusFlow 系統 YouTube 帳號走 Data API resumable upload。
        成功後把 `youtubeVideoId` 與 YouTube `videoUrl/sourceUrl` 寫回同一筆 `Video`；YouTube 失敗不會改變已完成的 processing 狀態。
      operationId: createVideo
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - video
              properties:
                title:
                  type: string
                  description: 可選的顯示標題；若未提供，backend 會改用上傳檔名作為預設值。
                video:
                  type: string
                  format: binary
                  description: 影片檔案。backend 目前接受 MIME type 以 `video/` 開頭的檔案。
      responses:
        '201':
          description: 影片上傳成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoItemResponse'
        '400':
          description: 上傳 payload 不合法、courseId 無效，或上傳驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: courseId 格式錯誤
                  description: 路徑中的 `courseId` 不是合法的 MongoDB ObjectId。
                  value:
                    success: false
                    message: Invalid resource id.
                    error:
                      code: INVALID_ID
                missingFile:
                  summary: 缺少影片檔案
                  description: request 有送出 multipart/form-data，但缺少必要的 `video` 檔案欄位。
                  value:
                    success: false
                    message: Video file is required.
                    error:
                      code: VIDEO_FILE_REQUIRED
                invalidFileType:
                  summary: 檔案型別不被接受
                  description: 上傳檔案的 MIME type 不符合目前 backend 接受的 `video/` 規則。
                  value:
                    success: false
                    message: Only video uploads are allowed.
                    error:
                      code: INVALID_FILE_TYPE
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 呼叫端沒有權限建立或管理這門課的影片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  summary: 角色本身不允許上傳
                  description: 呼叫者不是 teacher / admin，因此先被角色層擋下。
                  value:
                    success: false
                    message: You do not have permission to perform this action.
                    error:
                      code: FORBIDDEN
                manageDenied:
                  summary: 不是課程管理者
                  description: 雖然角色允許，但呼叫者不是這門課的 owner teacher，也不是 admin。
                  value:
                    success: false
                    message: You do not have permission to manage this course.
                    error:
                      code: COURSE_MANAGE_DENIED
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/courses/{courseId}/video-batches:
    post:
      tags:
        - Videos
      summary: 建立多影片批次
      description: |
        限 owner teacher 或 admin。一次接受 1 至 10 支影片，建立可恢復追蹤的 batchId；
        `VIDEO_BATCH_PIPELINE_ENABLED=false` 時為 `processingMode=single_adapter`，每支影片沿用既有單片 STT flow；
        開啟後改用 versioned batch request、manifest reconciliation、execution lease 與 checkpoint resume。
        兩種模式都隔離單項失敗，不會回退已成功項目。
      operationId: createVideoBatch
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - videos
              properties:
                videos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                titles:
                  type: string
                  description: JSON 字串陣列；提供時必須與 videos 數量一致。
                  example: '["第一講", "第二講"]'
      responses:
        '201':
          description: 批次已建立；個別項目可能已標為 failed。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoBatchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    get:
      tags:
        - Videos
      summary: 列出課程最近的影片批次
      operationId: listCourseVideoBatches
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 最多回傳最近 20 個批次。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoBatchListResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/video-batches/{batchId}:
    get:
      tags:
        - Videos
      summary: 取得影片批次即時進度
      operationId: getVideoBatch
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 成功取得批次與各項目狀態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoBatchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          description: 批次不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/video-batches/{batchId}/retry:
    post:
      tags:
        - Videos
      summary: 重新處理批次中的單支失敗影片
      description: |
        限 owner teacher 或 admin，且目標影片必須屬於該批次並處於 failed。
        `single_adapter` 會以仍存在且位於 `UPLOAD_DIR` 的本機來源重新啟動單片 worker；
        `pipeline_batch` 會在既有 manifest 中只授予指定 videoId 一次額外嘗試並沿用 checkpoint。
        同一 pipeline batch 尚有 worker 執行時會回 409，不會併發修改同一 manifest。
      operationId: retryVideoBatchItem
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - videoId
              properties:
                videoId:
                  $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: 單支影片已重新排入既有 processing flow。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoBatchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          description: 批次、批次項目或影片不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 影片不是 failed、批次仍在執行，或重試所需本機來源已不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                batchRunning:
                  value:
                    success: false
                    message: The video batch is still running. Retry after the current batch process finishes.
                    error:
                      code: VIDEO_BATCH_RETRY_IN_PROGRESS
                sourceUnavailable:
                  value:
                    success: false
                    message: The local source file is unavailable for processing retry.
                    error:
                      code: VIDEO_PROCESSING_RETRY_SOURCE_UNAVAILABLE
  /api/v1/courses/{courseId}/videos/youtube:
    post:
      tags:
        - Videos
      summary: 以 YouTube URL 建立課程影片
      description: |
        教師 / admin 可先手動將影片上傳到 YouTube（建議設為不公開 unlisted），再貼 URL 到 FocusFlow。
        Backend 會解析 `youtubeVideoId`、建立 Video document，並自動啟動 STT pipeline 的 `--youtube-url` 流程。
      operationId: createYouTubeVideo
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - youtubeUrl
              properties:
                youtubeUrl:
                  type: string
                  format: uri
                  description: 支援 youtube.com/watch、youtu.be、shorts、embed 等常見格式。
                  example: https://youtu.be/525ItlVdo6E
                title:
                  type: string
                  description: 課程影片標題；未填時 backend 會使用 YouTube ID 產生預設標題。
                week:
                  type: [integer, 'null']
                  minimum: 0
                lesson:
                  type: [integer, 'null']
                  minimum: 0
      responses:
        '201':
          description: YouTube 影片已建立並排入 STT pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoItemResponse'
        '400':
          description: YouTube URL 缺失或格式無法解析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidYouTubeUrl:
                  value:
                    success: false
                    message: Invalid YouTube URL.
                    error:
                      code: VALIDATION_ERROR
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/courses/{courseId}/videos/{videoId}/watched:
    post:
      tags:
        - Videos
      summary: 標記影片為已觀看完成
      description: |
        學生用端點。驗證學生身分與「影片屬於該課程」後，`$addToSet` 寫入 `Enrollment.watchedVideoIds`，
        並重算 `progress = watched / total × 100`。第一次觀看時會額外寫一筆 `UsageLog event=WATCH`（重複觀看不重複寫）。
      operationId: markVideoWatched
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 已標記觀看完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        description: 更新後的 enrollment 進度摘要（watchedVideoIds 數量、progress 百分比等）。
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
  /api/v1/courses/{courseId}/videos/{videoId}/opened:
    post:
      tags:
        - Videos
      summary: 記錄學生點開影片
      description: |
        學生用端點，驗證規則同 `/watched`（active enrolled student、影片屬於該課程）。每次點開都寫一筆
        `UsageLog event=video_open` 供管理員統計；不改 `Enrollment.watchedVideoIds` 與 `progress`。
      operationId: markVideoOpened
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 已記錄點開
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
  /api/v1/courses/{courseId}/videos/{videoId}/attach:
    post:
      tags:
        - Videos
      summary: 將既有影片掛載到另一個課程
      description: |
        僅限 teacher / admin。影片主課程仍記在 `video.courseId`，掛載透過 `course.videoIds` 引用。
        呼叫者需同時可管理目標課程與影片主課程。掛載到主課程本身或重複掛載回 `409 DUPLICATE_VIDEO`。
      operationId: attachVideoToCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/VideoId'
      responses:
        '201':
          description: 掛載成功，回傳影片 bridge-aware 呈現資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBase'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '409':
          description: 影片已屬於此課程或已被掛載
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/courses/{courseId}/videos/{videoId}/detach:
    post:
      tags:
        - Videos
      summary: 解除影片在此課程的掛載
      description: |
        僅限 teacher / admin。只能解除「掛載」引用；影片的主課程（`video.courseId`）不可解除，
        會回 `400 VALIDATION_ERROR`（主課程要移除影片請用 `DELETE /api/v1/videos/{videoId}`）。
        mutation 前會先嚴格清除受影響課程的 FAQ；清除失敗時回 `503 FAQ_INVALIDATION_FAILED`，影片關聯維持不變，可安全重試。
      operationId: detachVideoFromCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 解除掛載成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBase'
        '400':
          description: ID 格式錯誤，或嘗試從主課程解除掛載
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '503':
          $ref: '#/components/responses/FaqInvalidationFailedError'
  /api/v1/courses/{courseId}/faqs:
    get:
      tags:
        - QA
      summary: 取得課程常見問題（FAQ 快取）
      description: |
        回傳該課程的 FAQ 快取條目，依 `hitCount` 由高到低排序（預設 20 筆，`limit` 最大 100）。
        條目由 QA 成功回答自動累積：重複提問會直接命中快取（跳過 embedding／向量搜尋／LLM），
        `hitCount` 表示被重複命中的次數。不回傳 `questionEmbedding`。
      operationId: listCourseFaqs
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 課程常見問題清單
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            question:
                              type: string
                            answer:
                              type: string
                            matches:
                              type: array
                              items:
                                type: object
                            hitCount:
                              type: integer
                            lastHitAt:
                              type: [string, 'null']
                              format: date-time
                            updatedAt:
                              type: [string, 'null']
                              format: date-time
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    delete:
      tags:
        - QA
      summary: 清空課程 FAQ 快取
      description: |
        僅限 teacher（課程擁有者）/ admin。清空後，下一次提問會重新走完整 QA 流程並重建快取。
        影片刪除或重新處理完成時，backend 也會自動清該課程的 FAQ 快取。
      operationId: clearCourseFaqs
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 已清空，回傳刪除筆數
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deletedCount:
                            type: integer
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/videos/{videoId}:
    get:
      tags:
        - Videos
      summary: 依 videoId 讀取單一影片
      description: |
        回傳單一影片的 `bridge-aware` 呈現資料。

        在 Phase-1，同一個端點可能回傳：
        - 帶有 processing state 的 app-owned video
        - 僅用於 QA scope 的 `metadataOnly` bridge video
      operationId: getVideoById
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 成功取得影片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoItemResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
    delete:
      tags:
        - Videos
      summary: 刪除影片（cascade）
      description: |
        僅限 teacher（owner）/ admin 使用。

        刪除會 cascade 清理對應的 Segment / transcripts，並從 `course.videoIds` `$pull`；
        保留 UsageLog / Question 歷史紀錄。刪除前會先嚴格清除所有受影響課程的 FAQ；
        清除失敗時回 `503 FAQ_INVALIDATION_FAILED`，且不開始影片、片段、逐字稿或課程關聯 mutation。
      operationId: deleteVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 影片刪除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        description: cascade 刪除結果摘要。
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '503':
          $ref: '#/components/responses/FaqInvalidationFailedError'
  /api/v1/videos/{videoId}/processing:
    get:
      tags:
        - Videos
      summary: 讀取影片 processing 狀態
      description: |
        讀取單一影片的 processing metadata。

        這是偏向 operational / observability 的端點，不是一般 student-facing 路徑。只有課程 owner teacher 或 admin 可以查看 app-owned video 的 processing state；`metadataOnly` 的 bridge video 會刻意回 `409 VIDEO_METADATA_ONLY`。
      operationId: getVideoProcessing
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 成功取得 processing 狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoProcessingResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '409':
          $ref: '#/components/responses/VideoMetadataOnlyError'
  /api/v1/videos/{videoId}/processing/retry:
    post:
      tags:
        - Videos
      summary: 重新排入失敗影片的 processing
      description: |
        這是一個針對失敗 app-owned video 的 `guarded action` 類型 operational 端點。

        這不是 demo-only 的捷徑，而是提供 course owner teacher 與 admin 在 processing 失敗後重新排入工作的入口。只有目前狀態已經是 `failed` 時才能重試，否則 backend 會回 `409 VIDEO_PROCESSING_TRANSITION_INVALID`。
      operationId: retryVideoProcessing
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 已成功重新排入 processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoProcessingResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '409':
          $ref: '#/components/responses/VideoProcessingTransitionInvalidError'
  /api/v1/videos/{videoId}/youtube-upload/retry:
    post:
      tags:
        - Videos
      summary: 安全地重新排入失敗的 YouTube 上傳
      description: |
        只有 course owner teacher 或 admin 可呼叫。Backend 僅接受明確標記為 `retrySafe=true`、
        尚未達 `YOUTUBE_UPLOAD_MAX_ATTEMPTS` 且目前為 `failed` 的上傳。若傳輸可能已把 bytes
        送到 YouTube，或啟動後發現 stale `uploading`，會回 409 並要求先到 YouTube Studio
        人工確認，避免重複發布。成功排程不代表上傳已完成，呼叫端應再讀取 Video 狀態。
      operationId: retryYouTubeUpload
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '202':
          description: 已通過安全檢查並排入背景重試
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeUploadRetryResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '409':
          description: 已完成、狀態不允許、重試不安全或已達重試上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                retryUnsafe:
                  value:
                    success: false
                    message: This upload may already exist on YouTube; review YouTube Studio before retrying.
                    error:
                      code: YOUTUBE_UPLOAD_RETRY_UNSAFE
                retryLimitReached:
                  value:
                    success: false
                    message: YouTube upload retry limit reached.
                    error:
                      code: YOUTUBE_UPLOAD_RETRY_LIMIT_REACHED
        '503':
          description: YouTube OAuth 設定不完整
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations:
    get:
      tags: [QA]
      summary: 依課程列出目前使用者的最近 conversations
      operationId: listConversations
      parameters:
        - name: courseId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200': { description: Conversations retrieved in updatedAt descending order }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [QA]
      summary: 建立課程範圍的 QA conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId: { $ref: '#/components/schemas/ObjectId' }
                title: { type: string, maxLength: 120 }
      responses:
        '201': { description: Conversation created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ObjectId' }
    get:
      tags: [QA]
      summary: 取得 conversation messages
      operationId: listConversationMessages
      responses:
        '200': { description: Conversation messages retrieved }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Conversation not found }
    post:
      tags: [QA]
      summary: 傳送追問並取得 evidence-grounded answer
      operationId: sendConversationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '201': { description: Message answered }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Conversation not found }
  /api/v1/conversations/{conversationId}/messages/{messageId}/retry:
    post:
      tags: [QA]
      summary: 使用同一則 user message 重新產生失敗回答
      operationId: retryConversationMessage
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectId' }
        - name: messageId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200': { description: Message retry completed }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Conversation or user message not found }
        '409': { description: Message is not retryable }
  /api/v1/qa/ask:
    post:
      tags:
        - QA
      summary: 對課程提出問題
      description: |
        這是 Phase-2 收斂後的 QA 端點，會明確回傳 runtime diagnostics、answerStatus 與 citations。

        即使回應成功，runtime 狀態仍可能是 `degraded`；這表示系統可以回答，但目前執行條件不是理想狀態。呼叫端應至少檢查：
        - `runtime.status`
        - `runtime.matchStatus`
        - `runtime.resultCategory`
        - `runtime.fallbacks`
        - `runtime.course.qaScopeOnly`
        - `answerStatus.status`
        - `citations[]`

        若 `runtime.matchStatus=no_searchable_segments`，代表這門課目前沒有可搜尋的片段資料，而不是單純找不到相關答案。
        `answerStatus` 是 Phase-2 client 的主要分流欄位；`matches` 保留為 legacy / debug retrieval candidates，不等於正式引用。
        `citations[]` 是唯一 user-facing source，會整理 source video、timestamp、jump URL、match score 與 transcript snippet，供前端與 LINE 顯示來源。
        若答案生成器最終回覆無答案，即使 runtime 仍記錄 retrieval 曾 matched，`answerStatus` 仍為 `no_answer`，且 `citations[]` 與 `clip` 必須為空。

        這個端點不代表 Atlas retrieval 已 production-ready。Phase-1 目前可能仍使用 memory-mode retrieval、mock embeddings、bridge-only scope，或 answer-generation fallback。
      operationId: askQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QaAskRequest'
            examples:
              ask:
                value:
                  courseId: 507f191e810c19729de860eb
                  question: What does the course say about JWT authentication?
      responses:
        '200':
          description: 問答處理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QaAskResponse'
        '400':
          description: 請求驗證失敗、ObjectId 格式不合法，或問題超過字數上限（`QUESTION_TOO_LONG`，預設 50 字）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                questionTooLong:
                  summary: 問題超過字數上限
                  value:
                    success: false
                    message: Question must be at most 50 characters.
                    error:
                      code: QUESTION_TOO_LONG
                validation:
                  summary: 缺少必要欄位
                  description: "`courseId` 或 `question` 未提供，或 `question` 經過 trim 後為空字串。"
                  value:
                    success: false
                    message: courseId and question are required.
                    error:
                      code: VALIDATION_ERROR
                invalidId:
                  summary: courseId 格式錯誤
                  description: request body 內的 `courseId` 不是合法的 MongoDB ObjectId。
                  value:
                    success: false
                    message: Invalid resource id.
                    error:
                      code: INVALID_ID
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
        '429':
          description: |
            QA 月 token budget 或 user quota 已超額，或學生當天提問次數已用完
            （`QA_DAILY_LIMIT_EXCEEDED`，預設每天 5 次，網頁與 LINE 合併計算，台灣時間 00:00 重置）。
          content:
            application/json:
