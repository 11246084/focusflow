  /api/v1/videos/{videoId}/processing/retry:
    post:
      tags:
        - Videos
      summary: 重新排入失敗影片的 processing
      description: |
        這是一個針對失敗 app-owned video 的 `guarded action` 類型 operational 端點。

        這不是 demo-only 的捷徑，而是提供 course owner teacher 與 admin 在 processing 失敗後重新排入工作的入口。只有目前狀態已經是 `failed` 時才能重試，否則 backend 會回 `409 VIDEO_PROCESSING_TRANSITION_INVALID`。
      operationId: retryVideoProcessing
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 已成功重新排入 processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoProcessingResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '409':
          $ref: '#/components/responses/VideoProcessingTransitionInvalidError'
  /api/v1/qa/ask:
    post:
      tags:
        - QA
      summary: 對課程提出問題
      description: |
        這是 Phase-2 收斂後的 QA 端點，會明確回傳 runtime diagnostics、answerStatus 與 citations。

        即使回應成功，runtime 狀態仍可能是 `degraded`；這表示系統可以回答，但目前執行條件不是理想狀態。呼叫端應至少檢查：
        - `runtime.status`
        - `runtime.matchStatus`
        - `runtime.resultCategory`
        - `runtime.fallbacks`
        - `runtime.course.qaScopeOnly`
        - `answerStatus.status`
        - `citations[]`

        若 `runtime.matchStatus=no_searchable_segments`，代表這門課目前沒有可搜尋的片段資料，而不是單純找不到相關答案。
        `answerStatus` 是 Phase-2 client 的主要分流欄位；`matches` 保留為 legacy / debug 相容欄位。
        `citations[]` 會整理 source video、timestamp、jump URL、match score 與 transcript snippet，供前端與 LINE 顯示來源。

        這個端點不代表 Atlas retrieval 已 production-ready。Phase-1 目前可能仍使用 memory-mode retrieval、mock embeddings、bridge-only scope，或 answer-generation fallback。
      operationId: askQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QaAskRequest'
            examples:
              ask:
                value:
                  courseId: 507f191e810c19729de860eb
                  question: What does the course say about JWT authentication?
      responses:
        '200':
          description: 問答處理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QaAskResponse'
        '400':
          description: 請求驗證失敗，或 ObjectId 格式不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: 缺少必要欄位
                  description: "`courseId` 或 `question` 未提供，或 `question` 經過 trim 後為空字串。"
                  value:
                    success: false
                    message: courseId and question are required.
                    error:
                      code: VALIDATION_ERROR
                invalidId:
                  summary: courseId 格式錯誤
                  description: request body 內的 `courseId` 不是合法的 MongoDB ObjectId。
                  value:
                    success: false
                    message: Invalid resource id.
                    error:
                      code: INVALID_ID
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
        '429':
          description: QA 月 token budget 或 user quota 已超額
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                quotaExceeded:
                  summary: 單一使用者月 quota 超額
                  value:
                    success: false
                    message: Monthly QA token quota exceeded for this user.
                    error:
                      code: QA_QUOTA_EXCEEDED
                      details:
                        scope: user
                        month: 2026-07
                        resetCadence: calendar_month_utc
                        usedEvents: 1
                        projectedEvents: 2
                        usedTokens: 1000
                        projectedTokens: 2000
                        limitTokens: 1000
        '500':
          $ref: '#/components/responses/QaRuntimeMisconfiguredError'
        '503':
          $ref: '#/components/responses/QaAtlasNotReadyError'
