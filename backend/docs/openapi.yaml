          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/feedback:
    post:
      tags:
        - Feedback
      summary: 回報系統問題
      description: |
        任何已登入角色都可以回報問題。附截圖時使用 `multipart/form-data`；不附檔時也可以直接送 `application/json`。

        - 附件欄位名稱為 `attachments`，最多 3 張，只接受 JPEG、PNG、WebP，單檔最多 10 MiB。
        - Backend 會比對宣告的 MIME type 與檔案 signature，不符即拒收。所有附件驗證通過後才建立回報，不會留下孤兒附件。
        - `description` 會 trim，最多 2000 字元；`pageContext`、`courseVideoName` 會 trim 並截到前 200 字元。
      operationId: createFeedback
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeedbackCreateMultipartRequest'
            encoding:
              attachments:
                contentType: image/jpeg, image/png, image/webp
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreateRequest'
            examples:
              qaIssue:
                value:
                  category: ai_qa
                  severity: partial
                  description: 問同一題兩次得到不同答案。
                  pageContext: /student/courses/507f1f77bcf86cd799439012/qa
      responses:
        '201':
          description: 回報已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackItemResponse'
              examples:
                created:
                  value:
                    success: true
                    message: Feedback submitted.
                    data:
                      id: 66f1a2b3c4d5e6f7a8b9c0d1
                      category: ai_qa
                      severity: partial
                      description: 問同一題兩次得到不同答案。
                      pageContext: /student/courses/507f1f77bcf86cd799439012/qa
                      courseVideoName: null
                      status: open
                      attachments:
                        - attachmentId: 66f1a2b3c4d5e6f7a8b9c0d2
                          mimeType: image/png
                          size: 183422
                          originalName: screenshot.png
                      createdAt: '2026-09-24T08:30:00.000Z'
        '400':
          description: |
            欄位驗證失敗，或附件不合規：
            - `VALIDATION_ERROR`：`category`／`severity` 不合法、`description` 空白或超過 2000 字元
            - `INVALID_FEEDBACK_ATTACHMENT_TYPE`：不是 JPEG／PNG／WebP，或宣告的 MIME type 與檔案內容不符
            - `FEEDBACK_ATTACHMENT_LIMIT_EXCEEDED`：超過 3 張附件
            - `UPLOAD_ERROR`：其他 multipart 解析錯誤（例如使用了非 `attachments` 的檔案欄位）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCategory:
                  value:
                    success: false
                    message: Invalid feedback category.
                    error:
                      code: VALIDATION_ERROR
                invalidAttachmentType:
                  value:
                    success: false
                    message: Attachment content does not match an allowed image type.
                    error:
                      code: INVALID_FEEDBACK_ATTACHMENT_TYPE
                tooManyAttachments:
                  value:
                    success: false
                    message: At most 3 attachments are allowed per report.
                    error:
                      code: FEEDBACK_ATTACHMENT_LIMIT_EXCEEDED
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '413':
          description: 單一附件超過 10 MiB（`FEEDBACK_ATTACHMENT_TOO_LARGE`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooLarge:
                  value:
                    success: false
                    message: Each attachment must be at most 10 MiB.
                    error:
                      code: FEEDBACK_ATTACHMENT_TOO_LARGE
  /api/v1/feedback/{feedbackId}/attachments/{attachmentId}:
    get:
      tags:
        - Feedback
      summary: 讀取回報附件圖片
      description: |
        只有回報者本人或 admin 可以讀取。附件可能含學生畫面截圖，因此回應帶 `Cache-Control: private` 且不可快取成公開資源。
        Backend 先確認回報存在（`FEEDBACK_NOT_FOUND`），再檢查權限，最後才找附件（`FEEDBACK_ATTACHMENT_NOT_FOUND`）。
      operationId: getFeedbackAttachment
      parameters:
        - $ref: '#/components/parameters/FeedbackId'
        - $ref: '#/components/parameters/FeedbackAttachmentId'
      responses:
        '200':
          description: 附件 binary；實際 Content-Type 為建立時驗證過的 image/jpeg、image/png 或 image/webp
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, max-age=0, must-revalidate
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 呼叫者不是回報者本人，也不是 admin（`FORBIDDEN`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notOwner:
                  value:
                    success: false
                    message: You do not have permission to view this attachment.
                    error:
                      code: FORBIDDEN
        '404':
          description: 回報不存在（`FEEDBACK_NOT_FOUND`），或附件不存在、不屬於該回報（`FEEDBACK_ATTACHMENT_NOT_FOUND`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                feedbackNotFound:
                  value:
                    success: false
                    message: Feedback not found.
                    error:
                      code: FEEDBACK_NOT_FOUND
                attachmentNotFound:
                  value:
                    success: false
                    message: Feedback attachment not found.
                    error:
                      code: FEEDBACK_ATTACHMENT_NOT_FOUND
  /api/v1/courses/{courseId}/short-scripts/candidates:
