      <circle cx="1051.68" cy="504.32" r="6" fill="#1B4D5C"/>
      <circle cx="1180" cy="435" r="8" fill="#E8A93C"/>
      <g font-size="22" font-weight="bold" fill="#1B4D5C">
        <text x="712" y="540">40</text>
        <text x="1051.68" y="488" text-anchor="middle">514</text>
        <text x="1164" y="440" text-anchor="end">1,154</text>
      </g>
      <g font-size="18" fill="#5A6066">
        <text x="700" y="586">04-06</text>
        <text x="1051.68" y="586" text-anchor="middle">09-01</text>
        <text x="1180" y="586" text-anchor="end">10-25</text>
      </g>
    </g>
    <text x="664" y="612" font-size="18" fill="#5A6066">各為當日全套測試數，不可相加</text>
  </g>
  <g id="footnote" data-pptx-bounds="56 640 1164 46">
    <text x="64" y="670" font-size="18" fill="#5A6066">附件 3 寫部署後健康檢查未完成，是 09-01 的時點；09-09 已補上｜CI 關卡與自動回滾仍未建置</text>
