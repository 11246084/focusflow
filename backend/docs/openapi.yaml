openapi: 3.1.0
info:
  title: FocusFlow Backend API 文件
  version: 0.1.0-phase1
  description: |
    這份文件整理 FocusFlow backend 目前 Phase-1 MVP 的 API 契約與回應口徑。

    本文件的範圍：
    - 讓 frontend、組員與老師可以快速理解目前 live backend 的 API 契約
    - 如實描述 phase-1 的 `bridge-aware` 與 runtime 可觀測回應
    - 不把 Atlas retrieval、query embedding 對齊、或 live LINE delivery 說成 production-ready

    本輪不處理的項目：
    - 不做 route-level JSDoc generation
    - 不做 production-hardening refactor
    - 暫不納入 internal processing webhook 的 Swagger 文件
servers:
  - url: /
    description: Same-origin backend root。Swagger UI 的 Try it out 會直接使用目前開啟的 host 與 port。
tags:
  - name: Health
    description: Phase-1 的 observability 與 bootstrap 檢查入口，適合用於 demo 前的安全驗證路徑。
  - name: Auth
    description: 提供 frontend 與測試客戶端使用的 JWT login 與 current-user 查詢。
  - name: Courses
    description: 已登入後可使用的課程 API。Phase-1 的課程回應是 `bridge-aware`，可能會揭露 QA scope 相關 metadata。
  - name: Videos
    description: 涵蓋影片列表、詳細資料、processing 狀態、上傳與 `guarded action` 類型的操作端點。
  - name: QA
    description: 問答 API，會明確回傳 runtime diagnostics 與 phase-1 fallback 訊號。
  - name: LINE Webhook
    description: |
      LINE Platform 的 `integration-facing` webhook callback 入口。

      這不是一般 frontend 直接呼叫的 API。
      本文件只描述目前 backend 可觀測的 Phase-1 流程，不代表 live production integration 已完整驗證。
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      security: []
      summary: 讀取 backend runtime 狀態
      description: |
        這是 Phase-1 的 observability 端點，主要用於 bootstrap 檢查與 demo 前的 runtime 檢視。

        它會回傳目前 QA 與 LINE 的 runtime snapshot。請把它視為 `readiness` / diagnostics 入口，而不是所有下游整合都已 fully production-ready 的證明。
      operationId: getHealth
      responses:
        '200':
          description: 服務健康狀態快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: 健康檢查成功範例
                  description: 顯示目前 Phase-1 下 QA 與 LINE runtime 的可觀測快照；其中 LINE 仍可能是 `degraded` 或 `backend_only`。
                  value:
                    success: true
                    message: Service is healthy.
                    data:
                      service: focusflow-backend
                      environment: development
                      timestamp: '2026-04-17T02:00:00.000Z'
                      runtime:
                        qa:
                          queryEmbeddingProvider: mock
                          vectorSearchMode: memory
                          answerProvider: gemini
                          atlasVectorIndexConfigured: false
                          atlasFilterMode: bridge_course_or_video
                          geminiConfigured: true
                          openaiConfigured: false
                          readiness: ready
                          readyForAsk: true
                          warnings:
                            - code: PHASE1_MEMORY_SEARCH
                              message: Phase-1 QA retrieval is running in memory mode instead of Atlas vector search.
                            - code: PHASE1_MOCK_QUERY_EMBEDDING
                              message: Phase-1 QA query embeddings are still mock embeddings.
                          hardFailures: []
                        line:
                          signatureValidationConfigured: true
                          liveReplyConfigured: false
                          liveFlowReady: false
                          readiness: degraded
                          deliveryMode: backend_only
                          missingConfig:
                            - LINE_CHANNEL_ACCESS_TOKEN
                          hardFailures: []
                          degradedReasons:
                            - code: LINE_CHANNEL_ACCESS_TOKEN_MISSING
                              message: LINE_CHANNEL_ACCESS_TOKEN is missing, so LINE replies stay in backend-only mode.
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      security: []
      summary: 使用 email 與 password 登入
      description: 成功後回傳 JWT bearer token 與目前登入者的 public user 資訊。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              teacherLogin:
                value:
                  email: teacher@focusflow.local
                  password: Teacher123!
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
              examples:
                success:
                  summary: 登入成功範例
                  description: 回傳 token 與目前登入者的 public user 資訊，供 frontend 後續帶入 BearerAuth。
                  value:
                    success: true
                    message: Login successful.
                    data:
                      token: <jwt-token>
                      user:
                        id: 507f1f77bcf86cd799439011
                        name: Demo Teacher
                        email: teacher@focusflow.local
                        role: teacher
                        isActive: true
                        lineUserId: null
                        lineBindAt: null
                        activeCourseId: null
                        lineConversationState: idle
                        createdAt: '2026-04-06T09:00:00.000Z'
                        updatedAt: '2026-04-17T02:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '403':
          $ref: '#/components/responses/UserInactiveError'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: 讀取目前登入使用者
      description: 需要有效的 bearer token。
      operationId: getCurrentUser
      responses:
        '200':
          description: 成功取得目前登入使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: 缺少 token、token 無效或過期，或 token 對應的使用者已不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: 未提供 Bearer token
                  description: 呼叫端未帶入 Bearer token，因此 backend 直接回 `UNAUTHORIZED`。
                  value:
                    success: false
                    message: Authentication required.
                    error:
                      code: UNAUTHORIZED
                invalidToken:
                  summary: Bearer token 無效或已過期
                  description: token 驗證失敗時，backend 會回 `INVALID_TOKEN`。
                  value:
                    success: false
                    message: Invalid or expired token.
                    error:
                      code: INVALID_TOKEN
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /api/v1/courses:
    get:
      tags:
        - Courses
      summary: 列出目前可存取的課程
      description: |
        依照目前登入者的角色與存取規則，回傳可見的課程列表。

        這個回應在 Phase-1 是 `bridge-aware`，可能會帶出 `qaScopeOnly`、`bridgeMode` 等欄位，讓 frontend 或 demo 使用者可以區分一般課程與 QA-only 的 bridge 呈現。
      operationId: listCourses
      responses:
        '200':
          description: 成功取得課程列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Courses
      summary: 建立課程
      description: 僅限 teacher / admin 使用的課程建立端點。
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: 課程建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/courses/{courseId}:
    get:
      tags:
        - Courses
      summary: 依 courseId 讀取單一課程
      description: |
        回傳目前使用者可存取的單一課程。

        這個回應在 Phase-1 仍是 `bridge-aware`，可能帶出 `qaScopeOnly`、`bridgeMode` 與 bridge contract 提示欄位。
      operationId: getCourseById
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功取得課程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/courses/{courseId}/videos:
    get:
      tags:
        - Videos
      summary: 列出課程下的影片
      description: |
        回傳單一課程下的影片列表，並保留 Phase-1 的 `bridge-aware` 呈現方式。

        在 Phase-1，同一門課可能同時出現：
        - 帶有 processing metadata 的 app-owned video
        - 只用來做 QA 範圍呈現的 `metadataOnly` bridge video

        建議同時檢查 response 的 `meta` 區塊，以及每支影片上的 `metadataOnly`、`qaScopeOnly`、`isAppOwned` 等旗標。
      operationId: listCourseVideos
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功取得影片列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    post:
      tags:
        - Videos
      summary: 上傳課程影片
      description: 僅限 teacher / admin 使用，並且用於建立 app-owned course video 的上傳端點。
      operationId: createVideo
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - video
              properties:
                title:
                  type: string
                  description: 可選的顯示標題；若未提供，backend 會改用上傳檔名作為預設值。
                video:
                  type: string
                  format: binary
                  description: 影片檔案。backend 目前接受 MIME type 以 `video/` 開頭的檔案。
      responses:
        '201':
          description: 影片上傳成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoItemResponse'
        '400':
          description: 上傳 payload 不合法、courseId 無效，或上傳驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: courseId 格式錯誤
                  description: 路徑中的 `courseId` 不是合法的 MongoDB ObjectId。
                  value:
                    success: false
                    message: Invalid resource id.
                    error:
                      code: INVALID_ID
                missingFile:
                  summary: 缺少影片檔案
                  description: request 有送出 multipart/form-data，但缺少必要的 `video` 檔案欄位。
                  value:
                    success: false
                    message: Video file is required.
                    error:
                      code: VIDEO_FILE_REQUIRED
                invalidFileType:
                  summary: 檔案型別不被接受
                  description: 上傳檔案的 MIME type 不符合目前 backend 接受的 `video/` 規則。
                  value:
                    success: false
                    message: Only video uploads are allowed.
                    error:
                      code: INVALID_FILE_TYPE
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 呼叫端沒有權限建立或管理這門課的影片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  summary: 角色本身不允許上傳
                  description: 呼叫者不是 teacher / admin，因此先被角色層擋下。
                  value:
                    success: false
                    message: You do not have permission to perform this action.
                    error:
                      code: FORBIDDEN
                manageDenied:
                  summary: 不是課程管理者
                  description: 雖然角色允許，但呼叫者不是這門課的 owner teacher，也不是 admin。
                  value:
                    success: false
                    message: You do not have permission to manage this course.
                    error:
                      code: COURSE_MANAGE_DENIED
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/videos/{videoId}:
    get:
      tags:
        - Videos
      summary: 依 videoId 讀取單一影片
      description: |
        回傳單一影片的 `bridge-aware` 呈現資料。

        在 Phase-1，同一個端點可能回傳：
        - 帶有 processing state 的 app-owned video
        - 僅用於 QA scope 的 `metadataOnly` bridge video
      operationId: getVideoById
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 成功取得影片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoItemResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
  /api/v1/videos/{videoId}/processing:
    get:
      tags:
        - Videos
      summary: 讀取影片 processing 狀態
      description: |
        讀取單一影片的 processing metadata。

        這是偏向 operational / observability 的端點，不是一般 student-facing 路徑。只有課程 owner teacher 或 admin 可以查看 app-owned video 的 processing state；`metadataOnly` 的 bridge video 會刻意回 `409 VIDEO_METADATA_ONLY`。
      operationId: getVideoProcessing
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 成功取得 processing 狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoProcessingResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '409':
          $ref: '#/components/responses/VideoMetadataOnlyError'
  /api/v1/videos/{videoId}/processing/retry:
    post:
      tags:
        - Videos
      summary: 重新排入失敗影片的 processing
      description: |
        這是一個針對失敗 app-owned video 的 `guarded action` 類型 operational 端點。

        這不是 demo-only 的捷徑，而是提供 course owner teacher 與 admin 在 processing 失敗後重新排入工作的入口。只有目前狀態已經是 `failed` 時才能重試，否則 backend 會回 `409 VIDEO_PROCESSING_TRANSITION_INVALID`。
      operationId: retryVideoProcessing
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: 已成功重新排入 processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoProcessingResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/VideoNotFoundError'
        '409':
          $ref: '#/components/responses/VideoProcessingTransitionInvalidError'
  /api/v1/qa/ask:
    post:
      tags:
        - QA
      summary: 對課程提出問題
      description: |
        這是 Phase-1 的 QA 端點，會明確回傳 runtime diagnostics。

        即使回應成功，runtime 狀態仍可能是 `degraded`；這表示系統可以回答，但目前執行條件不是理想狀態。呼叫端應至少檢查：
        - `runtime.status`
        - `runtime.matchStatus`
        - `runtime.fallbacks`
        - `runtime.course.qaScopeOnly`

        若 `runtime.matchStatus=no_searchable_segments`，代表這門課目前沒有可搜尋的片段資料，而不是單純找不到相關答案。

        這個端點不代表 Atlas retrieval 已 production-ready。Phase-1 目前可能仍使用 memory-mode retrieval、mock embeddings、bridge-only scope，或 answer-generation fallback。
      operationId: askQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QaAskRequest'
            examples:
              ask:
                value:
                  courseId: 507f191e810c19729de860eb
                  question: What does the course say about JWT authentication?
      responses:
        '200':
          description: 問答處理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QaAskResponse'
        '400':
          description: 請求驗證失敗，或 ObjectId 格式不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: 缺少必要欄位
                  description: "`courseId` 或 `question` 未提供，或 `question` 經過 trim 後為空字串。"
                  value:
                    success: false
                    message: courseId and question are required.
                    error:
                      code: VALIDATION_ERROR
                invalidId:
                  summary: courseId 格式錯誤
                  description: request body 內的 `courseId` 不是合法的 MongoDB ObjectId。
                  value:
                    success: false
                    message: Invalid resource id.
                    error:
                      code: INVALID_ID
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
        '500':
          $ref: '#/components/responses/QaRuntimeMisconfiguredError'
        '503':
          $ref: '#/components/responses/QaAtlasNotReadyError'
  /api/v1/line/webhook:
    post:
      tags:
        - LINE Webhook
      security:
        - LineSignature: []
      summary: 接收 LINE Platform webhook callback
      description: |
        這是提供 LINE Platform 使用的 `integration-facing` callback 端點。

        目前的 Phase-1 口徑如下：
        - 不作為 frontend 直接呼叫的 API
        - backend 會用 `x-line-signature` 對「原始 raw request body」做簽章驗證
        - 回 `200` 只代表 backend 已接收並處理這批 callback，不代表 live LINE delivery 已 fully verified
        - 若缺少 `LINE_CHANNEL_ACCESS_TOKEN`，系統仍可能在 `backend_only` 模式下處理事件，但跳過實際回訊
        - Swagger UI 的 Try it out 不會自動幫你計算簽章；若手動送出，除非 signature 與 request body bytes 完全一致，否則會驗證失敗
      operationId: handleLineWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookRequest'
            examples:
              textQuestion:
                value:
                  events:
                    - type: message
                      replyToken: reply-ask-001
                      source:
                        userId: line-student-001
                      message:
                        type: text
                        text: What does the course say about JWT authentication?
      responses:
        '200':
          description: backend 已接受並處理這批 webhook 事件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineWebhookResponse'
              examples:
                backendOnly:
                  summary: "`backend_only` 模式下的 webhook 處理範例"
                  description: 顯示 LINE webhook 已被 backend 接收，但因缺少 `LINE_CHANNEL_ACCESS_TOKEN`，reply 被標記為 skipped，仍保留 `degraded` runtime 訊號。
                  value:
                    success: true
                    message: LINE webhook processed.
                    data:
                      received: 1
                      processed: 1
                      lineRuntime:
                        signatureValidationConfigured: true
                        liveReplyConfigured: false
                        liveFlowReady: false
                        readiness: degraded
                        deliveryMode: backend_only
                        missingConfig:
                          - LINE_CHANNEL_ACCESS_TOKEN
                        hardFailures: []
                        degradedReasons:
                          - code: LINE_CHANNEL_ACCESS_TOKEN_MISSING
                            message: LINE_CHANNEL_ACCESS_TOKEN is missing, so LINE replies stay in backend-only mode.
                      results:
                        - type: question
                          handled: true
                          matchCount: 1
                          replySent: false
                          replySkipped: true
                          replyReason: line_channel_access_token_missing
                          qaRuntime:
                            status: degraded
                            degraded: true
                            matchStatus: matched
                            answerProviderUsed: template
                            searchableSegmentCount: 2
                            fallbackCount: 1
                            fallbackCodes:
                              - SEGMENT_EMBEDDING_MISSING
        '400':
          description: 無法取得 raw request body，或 JSON payload 解析失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  summary: JSON 內容格式錯誤
                  description: request body 存在，但 backend 無法成功解析成 JSON。
                  value:
                    success: false
                    message: Invalid JSON body.
                    error:
                      code: VALIDATION_ERROR
                rawBodyMissing:
                  summary: 缺少 raw body
                  description: 進行簽章驗證時，backend 找不到可供驗證的 raw request body。
                  value:
                    success: false
                    message: LINE raw request body is not available.
                    error:
                      code: LINE_RAW_BODY_MISSING
        '401':
          description: 缺少 LINE signature，或 signature 驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSignature:
                  summary: 缺少 `x-line-signature`
                  description: request 沒有帶入 LINE 平台要求的 signature header。
                  value:
                    success: false
                    message: Missing LINE signature.
                    error:
                      code: LINE_SIGNATURE_MISSING
                invalidSignature:
                  summary: LINE signature 驗證失敗
                  description: "`x-line-signature` 存在，但與 raw request body 計算出的結果不一致。"
                  value:
                    success: false
                    message: Invalid LINE signature.
                    error:
                      code: LINE_SIGNATURE_INVALID
        '500':
          $ref: '#/components/responses/LineNotConfiguredError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    LineSignature:
      type: apiKey
      in: header
      name: x-line-signature
      description: |
        使用 `LINE_CHANNEL_SECRET`，對「完整且未改動的 raw webhook body」計算出的 HMAC-SHA256 signature。

        這是一個 `integration-facing` 的簽章驗證流程；Swagger UI 不會自動替你計算 signature。
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: 目標課程的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
    VideoId:
      name: videoId
      in: path
      required: true
      description: 目標影片的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
  responses:
    ValidationError:
      description: request payload 驗證失敗。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: 一般欄位驗證失敗
              description: 代表 request 結構存在欄位缺漏、型別錯誤，或其他基本驗證失敗情況。
              value:
                success: false
                message: Validation failed.
                error:
                  code: VALIDATION_ERROR
                  details:
                    - title is required
    InvalidCredentialsError:
      description: email 或 password 不正確。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              summary: 帳號或密碼錯誤
              description: 使用者提供的 email 或 password 無法通過驗證。
              value:
                success: false
                message: Invalid email or password.
                error:
                  code: INVALID_CREDENTIALS
    UserInactiveError:
      description: 使用者存在，但目前為 inactive。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userInactive:
              summary: 帳號存在但已停用
              description: 使用者資料存在，但目前 `isActive=false`，因此不允許登入。
              value:
                success: false
                message: User is inactive.
                error:
                  code: USER_INACTIVE
    UnauthorizedError:
      description: 缺少 bearer token，或 token 對應的使用者目前不可用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: 尚未通過身份驗證
              description: 請求未帶入必要的 Bearer token，或目前請求情境需要先完成認證。
              value:
                success: false
                message: Authentication required.
                error:
                  code: UNAUTHORIZED
    ForbiddenError:
      description: 已登入，但角色不符合此端點要求。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: 角色權限不足
              description: 呼叫者已登入，但角色不符合這個端點的授權條件。
              value:
                success: false
                message: You do not have permission to perform this action.
                error:
                  code: FORBIDDEN
    InvalidIdError:
      description: path 或 body 內的 ObjectId 格式不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidId:
              summary: ObjectId 格式錯誤
              description: path 或 body 中的資源識別值不是合法的 MongoDB ObjectId。
              value:
                success: false
                message: Invalid resource id.
                error:
                  code: INVALID_ID
    UserNotFoundError:
      description: token 驗證成功，但對應的使用者已不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userNotFound:
              summary: 找不到 token 對應的使用者
              description: token 本身可被驗證，但資料庫中已找不到對應 user。
              value:
                success: false
                message: User not found.
                error:
                  code: USER_NOT_FOUND
    CourseAccessDeniedError:
      description: 呼叫端沒有存取這門課的權限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseAccessDenied:
              summary: 沒有課程存取權
              description: 呼叫者雖已登入，但不符合這門課目前的課程存取規則。
              value:
                success: false
                message: You do not have access to this course.
                error:
                  code: COURSE_ACCESS_DENIED
    CourseManageDeniedError:
      description: 呼叫端沒有管理這門課或影片的權限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseManageDenied:
              summary: 沒有課程管理權
              description: 呼叫者不是課程 owner teacher，也不是 admin，因此不能執行管理型操作。
              value:
                success: false
                message: You do not have permission to manage this course.
                error:
                  code: COURSE_MANAGE_DENIED
    CourseNotFoundError:
      description: 找不到指定課程。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseNotFound:
              summary: 課程不存在
              description: 請求中的課程識別值格式正確，但資料庫中找不到對應課程。
              value:
                success: false
                message: Course not found.
                error:
                  code: COURSE_NOT_FOUND
    VideoNotFoundError:
      description: 找不到指定影片。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            videoNotFound:
              summary: 影片不存在
              description: 請求中的影片識別值格式正確，但資料庫中找不到對應影片。
              value:
                success: false
                message: Video not found.
                error:
                  code: VIDEO_NOT_FOUND
    VideoMetadataOnlyError:
      description: "`metadataOnly` 的 bridge video 不提供 processing state。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            videoMetadataOnly:
              summary: bridge video 僅有 metadata
              description: 這支影片目前是 `metadataOnly` 狀態，只用於 QA scope，不暴露 processing 狀態。
              value:
                success: false
                message: This video is metadata-only for QA scope and does not expose processing status.
                error:
                  code: VIDEO_METADATA_ONLY
    VideoProcessingTransitionInvalidError:
      description: 目前 processing state 無法轉移到要求的目標狀態。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidTransition:
              summary: processing 狀態轉移不合法
              description: 目前影片的 processing state 與要求的目標狀態不相容，因此不能執行轉移。
              value:
                success: false
                message: Cannot transition video processing from completed to queued.
                error:
                  code: VIDEO_PROCESSING_TRANSITION_INVALID
    QaRuntimeMisconfiguredError:
      description: QA runtime 設定對這次操作而言不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            qaRuntimeMisconfigured:
              summary: QA runtime 設定錯誤
              description: provider、金鑰或 mode 的設定不符合目前執行條件，因此 backend 直接以 `hard_fail` 結束。
              value:
                success: false
                message: GEMINI_API_KEY is required when QA_ANSWER_PROVIDER=gemini.
                error:
                  code: QA_RUNTIME_MISCONFIGURED
                  details:
                    readiness: hard_fail
    QaAtlasNotReadyError:
      description: "`atlas` vector-search mode 已配置，但仍未達到 Phase-1 可執行條件。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            qaAtlasNotReady:
              summary: Atlas mode 尚未 ready
              description: backend 偵測到 `atlas` mode 已被啟用，但目前不符合 Phase-1 可用條件，因此拒絕執行。
              value:
                success: false
                message: Atlas vector search is configured but not ready. Switch QA_VECTOR_SEARCH_MODE=memory for phase-1 MVP demos.
                error:
                  code: QA_ATLAS_NOT_READY
    LineNotConfiguredError:
      description: backend 缺少 `LINE_CHANNEL_SECRET`，因此無法完成 LINE signature 驗證。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            lineNotConfigured:
              summary: LINE signature 驗證條件不足
              description: backend 尚未配置 `LINE_CHANNEL_SECRET`，因此無法驗證 LINE webhook 的簽章。
              value:
                success: false
                message: LINE_CHANNEL_SECRET is not configured.
                error:
                  code: LINE_NOT_CONFIGURED
  schemas:
    ObjectId:
      description: MongoDB ObjectId 的字串格式。
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f191e810c19729de860eb
    UserRole:
      description: 系統目前支援的使用者角色列舉。
      type: string
      enum:
        - admin
        - teacher
        - student
    CourseStatus:
      description: 課程狀態列舉。
      type: string
      enum:
        - draft
        - published
        - archived
    BridgeMode:
      description: |
        Phase-1 課程或影片的 `bridge` 呈現模式。

        `bridge` 代表目前資料仍處於 app-owned records 與 pipeline metadata 共存的過渡狀態。
        `qa_scope_only` 代表這份資料主要只用來提供 QA 範圍，不保證具備完整 app-owned video 行為。
      type: string
      enum:
        - standard
        - qa_scope_only
        - mixed_scope
    VideoSourceType:
      description: 影片來源型別列舉。
      type: string
      enum:
        - upload
        - external_url
    VideoProcessingStatus:
      description: 影片 processing 狀態列舉。
      type: string
      enum:
        - queued
        - processing
        - completed
        - failed
    ReadinessStatus:
      description: runtime readiness 狀態列舉。
      type: string
      enum:
        - ready
        - degraded
        - hard_fail
    LineDeliveryMode:
      description: LINE webhook / reply flow 的交付模式列舉。
      type: string
      enum:
        - live
        - backend_only
        - disabled
    SuccessBase:
      description: 所有成功回應共用的 envelope 基底。
      type: object
      required:
        - success
        - message
      properties:
        success:
          const: true
        message:
          type: string
    ErrorResponse:
      description: 所有錯誤回應共用的 envelope 格式。
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          const: false
        message:
          type: string
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
            details:
              description: 可選的 endpoint-specific error details；實際結構會依 error 類型而不同。
    DiagnosticItem:
      description: 用於 warnings、hardFailures 或 degradedReasons 的診斷項目。
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    PublicUser:
      description: 對 API 使用者公開的 user 資訊，不包含敏感欄位。
      type: object
      required:
        - id
        - name
        - email
        - role
        - isActive
        - lineUserId
        - lineBindAt
        - activeCourseId
        - lineConversationState
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        lineUserId:
          anyOf:
            - type: string
            - type: 'null'
        lineBindAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        activeCourseId:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        lineConversationState:
          type: string
          enum:
            - idle
            - awaiting_course_selection
        createdAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    TeacherSummary:
      description: 課程或影片回應中使用的 teacher 簡化資料。
      type: object
      required:
        - _id
        - name
        - email
        - role
        - isActive
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
    CourseBridgeFields:
      description: |
        課程在 Phase-1 下的 `bridge` 補充欄位。

        這些欄位用來說明目前課程是一般課程、混合課程，或僅作為 QA scope 的 bridge 課程。
      type: object
      required:
        - qaScopeOnly
        - bridgeMode
        - videoCount
        - appVideoCount
        - bridgeVideoCount
        - courseVideoRefCount
        - bridgeExternalVideoIds
        - courseVideoIds
        - bridgeContract
        - bridgeContractPath
      properties:
        qaScopeOnly:
          description: "`true` 代表這門課目前偏向 QA scope 使用，而不是完整 app-owned course 體驗。"
          type: boolean
        bridgeMode:
          $ref: '#/components/schemas/BridgeMode'
        videoCount:
          type: integer
          minimum: 0
        appVideoCount:
          type: integer
          minimum: 0
        bridgeVideoCount:
          type: integer
          minimum: 0
        courseVideoRefCount:
          type: integer
          minimum: 0
        bridgeExternalVideoIds:
          type: array
          items:
            type: string
        courseVideoIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        bridgeContract:
          description: backend 目前採用的 bridge contract 名稱。
          type: string
          example: course_video_refs_v1
        bridgeContractPath:
          description: bridge contract 的資料串接路徑說明。
          type: string
          example: course.videoIds -> videos.video_id -> video_segments_text.video_id|videoId
    Course:
      description: 課程主體回應，含基本課程資料與 Phase-1 bridge 欄位。
      allOf:
        - type: object
          required:
            - _id
            - title
            - description
            - teacherId
            - videoIds
            - status
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            title:
              type: string
            description:
              type: string
            teacherId:
              $ref: '#/components/schemas/TeacherSummary'
            videoIds:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
            status:
              $ref: '#/components/schemas/CourseStatus'
            createdAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            updatedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
        - $ref: '#/components/schemas/CourseBridgeFields'
    CourseRef:
      description: 影片或其他巢狀回應中使用的最小課程參考資料。
      type: object
      required:
        - _id
        - title
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        status:
          $ref: '#/components/schemas/CourseStatus'
        teacherId:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/TeacherSummary'
    UserRef:
      description: 巢狀回應中使用的最小使用者參考資料。
      type: object
      required:
        - _id
        - name
        - email
        - role
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    VideoProcessing:
      description: 影片 processing 狀態本體。
      type: object
      required:
        - status
        - errorMessage
        - errorCode
        - queuedAt
        - startedAt
        - completedAt
        - failedAt
        - attemptCount
      properties:
        status:
          $ref: '#/components/schemas/VideoProcessingStatus'
        errorMessage:
          anyOf:
            - type: string
            - type: 'null'
        errorCode:
          anyOf:
            - type: string
            - type: 'null'
        queuedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        startedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        failedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        attemptCount:
          type: integer
          minimum: 0
    Video:
      description: |
        影片回應主體。

        Phase-1 下同一個 `Video` schema 可能同時承載：
        - 完整的 app-owned video
        - 僅提供 QA scope 的 `metadataOnly` bridge video
      type: object
      required:
        - _id
        - courseId
        - title
        - sourceType
        - sourceUrl
        - uploadedBy
        - processing
        - video_id
        - videoId
        - externalVideoId
        - file_name
        - fileName
        - file_path
        - durationSec
        - duration_sec
        - createdAt
        - updatedAt
        - qaScopeOnly
        - metadataOnly
        - isAppOwned
        - bridgeMode
        - bridgeSource
      properties:
        _id:
          type: string
        courseId:
          description: Phase-1 下可能回傳 ObjectId 字串，或最小化的 populated course reference。
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/CourseRef'
        title:
          type: string
        sourceType:
          anyOf:
            - $ref: '#/components/schemas/VideoSourceType'
            - type: 'null'
        sourceUrl:
          anyOf:
            - type: string
            - type: 'null'
        uploadedBy:
          description: Phase-1 下可能回傳 ObjectId 字串、最小 populated user，或在 `metadataOnly` bridge video 時為 null。
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        processing:
          anyOf:
            - $ref: '#/components/schemas/VideoProcessing'
            - type: 'null'
        video_id:
          anyOf:
            - type: string
            - type: 'null'
        videoId:
          anyOf:
            - type: string
            - type: 'null'
        externalVideoId:
          anyOf:
            - type: string
            - type: 'null'
        file_name:
          anyOf:
            - type: string
            - type: 'null'
        fileName:
          anyOf:
            - type: string
            - type: 'null'
        file_path:
          anyOf:
            - type: string
            - type: 'null'
        storagePath:
          anyOf:
            - type: string
            - type: 'null'
        durationSec:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
        duration_sec:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
        video_source:
          anyOf:
            - type: string
            - type: 'null'
        video_url:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        qaScopeOnly:
          description: "`true` 代表這支影片主要只暴露 QA scope 所需資訊。"
          type: boolean
        metadataOnly:
          description: "`true` 代表這支影片只有 metadata，沒有完整 app-owned video 的 processing / 管理能力。"
          type: boolean
        isAppOwned:
          description: "`true` 代表這支影片是 backend app 直接管理的 app-owned record。"
          type: boolean
        bridgeMode:
          description: 這支影片目前所屬的 `bridge` 呈現模式。
          $ref: '#/components/schemas/BridgeMode'
        bridgeSource:
          description: 若為 bridge video，指出目前 metadata 來源。
          anyOf:
            - type: string
              enum:
                - pipeline_metadata
            - type: 'null'
    VideoProcessingPayload:
      description: 影片 processing 相關端點回傳的資料主體。
      type: object
      required:
        - id
        - title
        - processing
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        processing:
          $ref: '#/components/schemas/VideoProcessing'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    CourseVideosMeta:
      description: 課程影片列表額外附帶的 `meta` 區塊。
      type: object
      required:
        - qaScopeOnly
        - bridgeMode
        - videoCount
        - appVideoCount
        - bridgeVideoCount
        - bridgeContract
      properties:
        qaScopeOnly:
          description: 課程影片列表是否屬於 QA-only scope。
          type: boolean
        bridgeMode:
          $ref: '#/components/schemas/BridgeMode'
        videoCount:
          type: integer
          minimum: 0
        appVideoCount:
          type: integer
          minimum: 0
        bridgeVideoCount:
          type: integer
          minimum: 0
        bridgeContract:
          description: 目前列表採用的 bridge contract 名稱。
          type: string
    QaRuntimeSnapshot:
      description: QA runtime 的靜態快照，用來描述目前 provider 與 readiness 狀態。
      type: object
      required:
        - queryEmbeddingProvider
        - vectorSearchMode
        - answerProvider
        - atlasVectorIndexConfigured
        - atlasFilterMode
        - geminiConfigured
        - openaiConfigured
        - readiness
        - readyForAsk
        - warnings
        - hardFailures
      properties:
        queryEmbeddingProvider:
          type: string
          enum:
            - mock
            - openai
        vectorSearchMode:
          type: string
          enum:
            - memory
            - atlas
        answerProvider:
          type: string
          enum:
            - template
            - openai
            - gemini
        atlasVectorIndexConfigured:
          type: boolean
        atlasFilterMode:
          type: string
          enum:
            - bridge_course_or_video
        geminiConfigured:
          type: boolean
        openaiConfigured:
          type: boolean
        readiness:
          type: string
          enum:
            - ready
            - hard_fail
        readyForAsk:
          type: boolean
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    LineRuntimeSnapshot:
      description: LINE runtime 的靜態快照，用來描述簽章驗證、reply 能力與 delivery mode。
      type: object
      required:
        - signatureValidationConfigured
        - liveReplyConfigured
        - liveFlowReady
        - readiness
        - deliveryMode
        - missingConfig
        - hardFailures
        - degradedReasons
      properties:
        signatureValidationConfigured:
          type: boolean
        liveReplyConfigured:
          type: boolean
        liveFlowReady:
          type: boolean
        readiness:
          $ref: '#/components/schemas/ReadinessStatus'
        deliveryMode:
          $ref: '#/components/schemas/LineDeliveryMode'
        missingConfig:
          type: array
          items:
            type: string
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        degradedReasons:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    HealthData:
      description: "`/health` 回應中的主要資料區塊。"
      type: object
      required:
        - service
        - environment
        - timestamp
        - runtime
      properties:
        service:
          type: string
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
        runtime:
          type: object
          required:
            - qa
            - line
          properties:
            qa:
              $ref: '#/components/schemas/QaRuntimeSnapshot'
            line:
              $ref: '#/components/schemas/LineRuntimeSnapshot'
    AuthLoginRequest:
      description: "`/api/v1/auth/login` 的 request body。"
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthLoginData:
      description: 登入成功後回傳的資料主體。
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/PublicUser'
    AuthMeData:
      description: 目前登入使用者查詢的資料主體。
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
    CourseCreateRequest:
      description: 建立課程時使用的 request body。
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/CourseStatus'
        teacherId:
          $ref: '#/components/schemas/ObjectId'
    QaAskRequest:
      description: "`/api/v1/qa/ask` 的 request body。"
      type: object
      required:
        - courseId
        - question
      properties:
        courseId:
          $ref: '#/components/schemas/ObjectId'
        question:
          type: string
    QaMatch:
      description: QA 搜尋後回傳的單一片段命中結果。
      type: object
      required:
        - segmentId
        - videoId
        - startSec
        - endSec
        - transcript
        - score
      properties:
        segmentId:
          type: string
        videoId:
          type: string
        startSec:
          type: number
          minimum: 0
        endSec:
          type: number
          minimum: 0
        transcript:
          type: string
        score:
          type: number
          minimum: 0
    QaClip:
      description: QA 命中的 clip 快取資訊；若目前沒有 clip，回應中可能為 null。
      type: object
      required:
        - segmentId
        - clipUrl
        - jumpUrl
        - keyPoints
        - hitCount
      properties:
        segmentId:
          type: string
        clipUrl:
          type: string
        jumpUrl:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        hitCount:
          type: integer
          minimum: 0
    QaFallback:
      description: QA 在 retrieval 或 answer generation 階段發生 fallback 時的說明項目。
      type: object
      required:
        - stage
        - code
        - message
      properties:
        stage:
          type: string
        code:
          type: string
        message:
          type: string
        from:
          anyOf:
            - type: string
            - type: 'null'
        to:
          anyOf:
            - type: string
            - type: 'null'
    QaRuntimeCourseSummary:
      description: QA runtime 內附帶的課程範圍摘要。
      type: object
      required:
        - qaScopeOnly
        - bridgeMode
        - videoCount
        - appVideoCount
        - bridgeVideoCount
        - bridgeContract
        - bridgeContractPath
      properties:
        qaScopeOnly:
          description: "`true` 代表這門課目前只有 QA scope 的可用性，不保證具備完整影片管理體驗。"
          type: boolean
        bridgeMode:
          $ref: '#/components/schemas/BridgeMode'
        videoCount:
          type: integer
          minimum: 0
        appVideoCount:
          type: integer
          minimum: 0
        bridgeVideoCount:
          type: integer
          minimum: 0
        bridgeContract:
          description: QA scope 使用的 bridge contract 名稱。
          type: string
        bridgeContractPath:
          description: QA scope 使用的 bridge contract 路徑說明。
          type: string
    QaRuntime:
      description: |
        QA 執行結果對應的 runtime 診斷資訊。

        `degraded` 代表系統仍可回答，但目前條件不是理想狀態，例如 fallback、bridge-only scope 或 retrieval 條件不足。
        `no_searchable_segments` 代表目前課程缺少可搜尋片段，而不是單純沒有相關答案。
      allOf:
        - $ref: '#/components/schemas/QaRuntimeSnapshot'
        - type: object
          required:
            - status
            - degraded
            - degradedReasons
            - searchBackendUsed
            - scoringMode
            - searchableSegmentCount
            - matchStatus
            - course
            - answerProviderUsed
            - fallbacks
          properties:
            status:
              description: QA runtime 的總體狀態；`degraded` 代表仍可用，但不在理想條件。
              type: string
              enum:
                - ready
                - degraded
            degraded:
              description: 是否處於 `degraded` 狀態。
              type: boolean
            degradedReasons:
              description: 導致 `degraded` 的原因代碼列表。
              type: array
              items:
                type: string
            searchBackendUsed:
              description: 實際使用的搜尋 backend。
              type: string
            scoringMode:
              description: 本次 QA 命中排序所使用的 scoring 模式。
              type: string
            searchableSegmentCount:
              description: 目前課程範圍內可搜尋的 segment 數量。
              type: integer
              minimum: 0
            matchStatus:
              description: QA 命中狀態；`no_searchable_segments` 代表沒有可搜尋片段，`no_relevant_match` 則代表有資料但未命中相關片段。
              type: string
              enum:
                - matched
                - no_relevant_match
                - no_searchable_segments
            course:
              $ref: '#/components/schemas/QaRuntimeCourseSummary'
            answerProviderUsed:
              description: 本次實際用來產生答案的 provider；若未產生答案則可能為 null。
              anyOf:
                - type: string
                - type: 'null'
            fallbacks:
              description: 本次請求中發生的 fallback 列表。
              type: array
              items:
                $ref: '#/components/schemas/QaFallback'
    LineEventSource:
      description: LINE event 內的來源資訊。
      type: object
      properties:
        userId:
          type: string
    LineTextMessage:
      description: LINE text message 事件中的訊息內容。
      type: object
      required:
        - type
        - text
      properties:
        type:
          const: text
        text:
          type: string
    LineMessageEvent:
      description: LINE 的 message 事件。
      type: object
      required:
        - type
        - replyToken
        - source
        - message
      properties:
        type:
          const: message
        replyToken:
          type: string
        source:
          $ref: '#/components/schemas/LineEventSource'
        message:
          $ref: '#/components/schemas/LineTextMessage'
    LineFollowEvent:
      description: LINE 的 follow 事件。
      type: object
      required:
        - type
        - replyToken
        - source
      properties:
        type:
          const: follow
        replyToken:
          type: string
        source:
          $ref: '#/components/schemas/LineEventSource'
    LinePostbackEvent:
      description: LINE 的 postback 事件。
      type: object
      required:
        - type
        - replyToken
        - source
        - postback
      properties:
        type:
          const: postback
        replyToken:
          type: string
        source:
          $ref: '#/components/schemas/LineEventSource'
        postback:
          type: object
          required:
            - data
          properties:
            data:
              type: string
    LineUnknownEvent:
      description: 未被 backend 明確支援、但仍允許保留原始型態的 LINE 事件。
      type: object
      required:
        - type
      properties:
        type:
          type: string
      additionalProperties: true
    LineWebhookEvent:
      description: LINE webhook 事件的 union 型別，接受目前 backend 已處理與未知型別的事件。
      anyOf:
        - $ref: '#/components/schemas/LineFollowEvent'
        - $ref: '#/components/schemas/LineMessageEvent'
        - $ref: '#/components/schemas/LinePostbackEvent'
        - $ref: '#/components/schemas/LineUnknownEvent'
    LineWebhookRequest:
      description: LINE Platform 送往 webhook 的 request body。
      type: object
      required:
        - events
      properties:
        destination:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/LineWebhookEvent'
    LineQuestionQaRuntime:
      description: LINE 問答事件成功處理後，回傳給觀測用途的 QA runtime 摘要。
      type: object
      required:
        - status
        - degraded
        - matchStatus
        - answerProviderUsed
        - searchableSegmentCount
        - fallbackCount
        - fallbackCodes
      properties:
        status:
          type: string
        degraded:
          type: boolean
        matchStatus:
          type: string
        answerProviderUsed:
          anyOf:
            - type: string
            - type: 'null'
        searchableSegmentCount:
          type: integer
          minimum: 0
        fallbackCount:
          type: integer
          minimum: 0
        fallbackCodes:
          type: array
          items:
            type: string
    LineFailureQaRuntime:
      description: LINE 問答事件在 QA hard-fail 時，回傳的簡化 runtime 摘要。
      type: object
      required:
        - readiness
        - readyForAsk
        - queryEmbeddingProvider
        - vectorSearchMode
        - answerProvider
        - hardFailureCodes
      properties:
        readiness:
          type: string
        readyForAsk:
          type: boolean
        queryEmbeddingProvider:
          anyOf:
            - type: string
            - type: 'null'
        vectorSearchMode:
          anyOf:
            - type: string
            - type: 'null'
        answerProvider:
          anyOf:
            - type: string
            - type: 'null'
        hardFailureCodes:
          type: array
          items:
            type: string
    LineWebhookResult:
      description: 單一 LINE event 經 backend 處理後的結果摘要。
      type: object
      required:
        - type
        - handled
        - replySent
        - replySkipped
        - replyReason
      properties:
        type:
          type: string
        handled:
          type: boolean
        reason:
          anyOf:
            - type: string
            - type: 'null'
        replySent:
          type: boolean
        replySkipped:
          type: boolean
        replyReason:
          anyOf:
            - type: string
            - type: 'null'
        errorCode:
          anyOf:
            - type: string
            - type: 'null'
        matchCount:
          type: integer
          minimum: 0
        qaRuntime:
          anyOf:
            - $ref: '#/components/schemas/LineQuestionQaRuntime'
            - $ref: '#/components/schemas/LineFailureQaRuntime'
            - type: 'null'
    HealthResponse:
      description: "`/health` 的成功回應 envelope。"
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    AuthLoginResponse:
      description: "`/api/v1/auth/login` 的成功回應 envelope。"
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/AuthLoginData'
    AuthMeResponse:
      description: "`/api/v1/auth/me` 的成功回應 envelope。"
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/AuthMeData'
    CourseListResponse:
      description: 課程列表端點的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - courses
              properties:
                courses:
                  type: array
                  items:
                    $ref: '#/components/schemas/Course'
    CourseItemResponse:
      description: 單一課程端點的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - course
              properties:
                course:
                  $ref: '#/components/schemas/Course'
    VideoListResponse:
      description: 課程影片列表端點的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
            - meta
          properties:
            data:
              type: object
              required:
                - videos
              properties:
                videos:
                  type: array
                  items:
                    $ref: '#/components/schemas/Video'
            meta:
              $ref: '#/components/schemas/CourseVideosMeta'
    VideoItemResponse:
      description: 單一影片端點的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - video
              properties:
                video:
                  $ref: '#/components/schemas/Video'
    VideoProcessingResponse:
      description: 影片 processing 相關端點的成功回應 envelope。
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/VideoProcessingPayload'
    QaAskResponse:
      description: "`/api/v1/qa/ask` 的成功回應 envelope。"
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - answer
                - matches
                - clip
                - runtime
              properties:
                answer:
                  type: string
                matches:
                  type: array
                  items:
                    $ref: '#/components/schemas/QaMatch'
                clip:
                  anyOf:
                    - $ref: '#/components/schemas/QaClip'
                    - type: 'null'
                runtime:
                  $ref: '#/components/schemas/QaRuntime'
    LineWebhookResponse:
      description: "`/api/v1/line/webhook` 的成功回應 envelope。"
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - received
                - processed
                - lineRuntime
                - results
              properties:
                received:
                  type: integer
                  minimum: 0
                processed:
                  type: integer
                  minimum: 0
                lineRuntime:
                  $ref: '#/components/schemas/LineRuntimeSnapshot'
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/LineWebhookResult'
