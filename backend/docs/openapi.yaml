openapi: 3.1.0
info:
  title: FocusFlow Backend API 文件
  version: 0.1.0-phase1
  description: |
    這份文件整理 FocusFlow backend 目前 Phase-1 MVP 的 API 契約與回應口徑。

    本文件的範圍：
    - 讓 frontend、組員與老師可以快速理解目前 live backend 的 API 契約
    - 如實描述 phase-1 的 `bridge-aware` 與 runtime 可觀測回應
    - 不把 Atlas retrieval、query embedding 對齊、或 live LINE delivery 說成 production-ready

    覆蓋範圍（2026-07-24 更新）：
    - 已涵蓋 auth（含 role 驗證與 avatar）/ notifications / courses（含 PATCH/DELETE）/ videos（含 DELETE）/ watched / qa / stats / admin / LINE / student Shorts feed 的主要端點
    - 本 spec 已涵蓋主要端點，但仍非 100% 完整契約；internal processing webhook 等少數端點以 route files 為準
    - Shorts 僅代表修課 feed 與 metadata sync 已實作，不代表自動選片、剪輯、字幕或發布 worker 已完成

    本輪不處理的項目：
    - 不做 route-level JSDoc generation
    - 不做 production-hardening refactor
    - 暫不納入 internal processing webhook 的 Swagger 文件
servers:
  - url: /
    description: Same-origin backend root。Swagger UI 的 Try it out 會直接使用目前開啟的 host 與 port。
tags:
  - name: Health
    description: Phase-1 的 observability 與 bootstrap 檢查入口，適合用於 demo 前的安全驗證路徑。
  - name: Auth
    description: 提供 JWT login、current-user 查詢與 authenticated avatar 上傳／讀取。
  - name: Notifications
    description: 目前登入使用者的站內通知列表、已讀狀態與 admin 系統公告。
  - name: Courses
    description: 已登入後可使用的課程 API。Phase-1 的課程回應是 `bridge-aware`，可能會揭露 QA scope 相關 metadata。
  - name: Videos
    description: 涵蓋影片列表、詳細資料、processing 狀態、上傳與 `guarded action` 類型的操作端點。
  - name: Shorts
    description: 學生修課限定的已發布 ShortAsset feed；需要 Bearer JWT 與 student 角色。
  - name: QA
    description: 問答 API，會明確回傳 runtime diagnostics 與 phase-1 fallback 訊號。
  - name: Stats
    description: Teacher / Student dashboard 的彙總統計端點，回應為彙整後的 dashboard 數據。
  - name: Admin
    description: 僅限 admin 角色使用的後台管理端點（使用者、影片、事件統計）；全部需 Bearer token + admin 權限。
  - name: LINE Webhook
    description: |
      LINE Platform 的 `integration-facing` webhook callback 入口。

      這不是一般 frontend 直接呼叫的 API。
      本文件只描述目前 backend 可觀測的 Phase-1 流程，不代表 live production integration 已完整驗證。
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      security: []
      summary: 讀取 backend runtime 狀態
      description: |
        這是 Phase-1 的 observability 端點，主要用於 bootstrap 檢查與 demo 前的 runtime 檢視。

        它會回傳目前 QA 與 LINE 的 runtime snapshot。請把它視為 `readiness` / diagnostics 入口，而不是所有下游整合都已 fully production-ready 的證明。
      operationId: getHealth
      responses:
        '200':
          description: 服務健康狀態快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: 健康檢查成功範例
                  description: 顯示目前 Phase-1 下 QA 與 LINE runtime 的可觀測快照；其中 LINE 仍可能是 `degraded` 或 `backend_only`。
                  value:
                    success: true
                    message: Service is healthy.
                    data:
                      service: focusflow-backend
                      environment: development
                      timestamp: '2026-04-17T02:00:00.000Z'
                      runtime:
                        qa:
                          queryEmbeddingProvider: gemini
                          vectorSearchMode: atlas
                          answerProvider: gemini
                          atlasVectorIndexConfigured: true
                          atlasFilterMode: bridge_course_or_video
                          geminiConfigured: true
                          openaiConfigured: false
                          readiness: ready
                          readyForAsk: true
                          costControl:
                            enabled: false
                            resetCadence: calendar_month_utc
                            estimatedTokensPerAsk: 1000
                            monthlyTokenBudget: 0
                            userMonthlyTokenQuota: 0
                          warnings: []
                          hardFailures: []
                        multimodal:
                          segmentCollection: video_segments_video
                          vectorIndexName: video_embedding_index
                          expectedVectorIndexName: video_embedding_index
                          vectorIndexConfigured: true
                          expectedVectorIndexDefinition:
                            fields:
                              - type: vector
                                path: embedding
                                numDimensions: 3072
                                similarity: cosine
                              - type: filter
                                path: video_id
                          setupCommand: npm run db:ensure-video-vector-index
                          readiness: not_enabled
                          readyForQa: false
                          blockers:
                            - code: MULTIMODAL_QA_NOT_INTEGRATED
                              message: video_segments_video is not wired into QA retrieval yet.
                            - code: VIDEO_SEGMENTS_VIDEO_SCOPE_MAPPING_UNVERIFIED
                              message: video_segments_video.video_id must map to videos before course-scoped QA can use it.
                          hardFailures: []
                        shortsSync:
                          enabled: true
                          lastAttemptAt: '2026-07-18T02:00:00.000Z'
                          lastSuccessAt: '2026-07-18T02:00:01.000Z'
                          lastError: null
                          degraded: false
                        youtubeUpload:
                          uploadEnabled: true
                          privatizeOnDeleteEnabled: true
                          credentialsConfigured: true
                          usingAccessTokenOverride: false
                          uploadReady: true
                          privatizeOnDeleteReady: true
                          privatizeScopeSatisfied: true
                          readiness: ready
                          credentialCheck:
                            status: ok
                            lastAttemptAt: '2026-08-02T09:19:38.511Z'
                            lastSuccessAt: '2026-08-02T09:19:38.705Z'
                            lastError: null
                            grantedScopes:
                              - https://www.googleapis.com/auth/youtube.force-ssl
                          lastPrivatize:
                            youtubeVideoId: null
                            lastAttemptAt: null
                            lastSuccessAt: null
                            lastError: null
                          missingConfig: []
                          hardFailures: []
                          warnings: []
                        line:
                          signatureValidationConfigured: true
                          liveReplyConfigured: false
                          liveFlowReady: false
                          readiness: degraded
                          deliveryMode: backend_only
                          missingConfig:
                            - LINE_CHANNEL_ACCESS_TOKEN
                          hardFailures: []
                          degradedReasons:
                            - code: LINE_CHANNEL_ACCESS_TOKEN_MISSING
                              message: LINE_CHANNEL_ACCESS_TOKEN is missing, so LINE replies stay in backend-only mode.
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      security: []
      summary: 使用 email 與 password 登入
      description: 成功後回傳 JWT bearer token 與目前登入者的 public user 資訊。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              teacherLogin:
                value:
                  email: teacher@focusflow.local
                  password: Teacher123!
                  role: teacher
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
              examples:
                success:
                  summary: 登入成功範例
                  description: 回傳 token 與目前登入者的 public user 資訊，供 frontend 後續帶入 BearerAuth。
                  value:
                    success: true
                    message: Login successful.
                    data:
                      token: <jwt-token>
                      user:
                        id: 507f1f77bcf86cd799439011
                        name: Demo Teacher
                        email: teacher@focusflow.local
                        role: teacher
                        isActive: true
                        hasAvatar: false
                        avatarUpdatedAt: null
                        isLineBound: false
                        lineBindAt: null
                        activeCourseId: null
                        lineConversationState: idle
                        createdAt: '2026-04-06T09:00:00.000Z'
                        updatedAt: '2026-04-17T02:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '403':
          description: 帳號停用，或帳號角色與登入入口不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                inactive:
                  value:
                    success: false
                    message: User is inactive.
                    error:
                      code: USER_INACTIVE
                roleMismatch:
                  value:
                    success: false
                    message: Account type does not match the selected role.
                    error:
                      code: ROLE_MISMATCH
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      security: []
      summary: 自助註冊（限 student / teacher）
      description: |
        新使用者自行建立帳號。`role` 僅接受 `student` 或 `teacher`；`admin` 必須由現有管理員建立，不開放自助註冊。

        成功時直接回 JWT 與 public user，前端可立即跳到 dashboard。
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            examples:
              studentRegister:
                value:
                  name: 王小明
                  email: student-new@focusflow.local
                  password: Student123!
                  role: student
      responses:
        '201':
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
              examples:
                success:
                  summary: 註冊成功範例
                  value:
                    success: true
                    message: Registration successful.
                    data:
                      token: <jwt-token>
                      user:
                        id: 507f1f77bcf86cd799439099
                        name: 王小明
                        email: student-new@focusflow.local
                        role: student
                        isActive: true
                        hasAvatar: false
                        avatarUpdatedAt: null
                        isLineBound: false
                        lineBindAt: null
                        activeCourseId: null
                        lineConversationState: idle
                        createdAt: '2026-05-07T09:00:00.000Z'
                        updatedAt: '2026-05-07T09:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email 已被使用（DUPLICATE_RESOURCE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  value:
                    success: false
                    message: Email is already registered.
                    error:
                      code: DUPLICATE_RESOURCE
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: 讀取目前登入使用者
      description: 需要有效的 bearer token。
      operationId: getCurrentUser
      responses:
        '200':
          description: 成功取得目前登入使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: 缺少 token、token 無效或過期，或 token 對應的使用者已不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: 未提供 Bearer token
                  description: 呼叫端未帶入 Bearer token，因此 backend 直接回 `UNAUTHORIZED`。
                  value:
                    success: false
                    message: Authentication required.
                    error:
                      code: UNAUTHORIZED
                invalidToken:
                  summary: Bearer token 無效或已過期
                  description: token 驗證失敗時，backend 會回 `INVALID_TOKEN`。
                  value:
                    success: false
                    message: Invalid or expired token.
                    error:
                      code: INVALID_TOKEN
        '404':
          $ref: '#/components/responses/UserNotFoundError'
  /api/v1/auth/me/avatar:
    get:
      tags:
        - Auth
      summary: 讀取目前登入使用者的頭貼
      operationId: getCurrentUserAvatar
      responses:
        '200':
          description: 頭貼 binary；實際 Content-Type 為 image/jpeg、image/png 或 image/webp
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, max-age=0, must-revalidate
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 目前使用者沒有可讀取的頭貼（AVATAR_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Auth
      summary: 上傳或替換目前登入使用者的頭貼
      operationId: updateCurrentUserAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPEG、PNG 或 WebP，最大 5 MiB；伺服器會驗證 MIME 與檔案 signature。
      responses:
        '200':
          description: 頭貼更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUpdateResponse'
        '400':
          description: 缺檔、格式不符、multipart 錯誤或內容 signature 不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: 同一帳號的頭貼在上傳期間已被其他請求更新（AVATAR_UPDATE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 檔案超過 5 MiB（AVATAR_TOO_LARGE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/notifications:
    get:
      tags:
        - Notifications
      summary: 列出目前登入使用者的站內通知
      operationId: listNotifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 後端回傳的 opaque cursor，不應由 client 自行解析。
          schema:
            type: string
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 通知列表、總未讀數與下一頁 cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/notifications/{notificationId}/read:
    patch:
      tags:
        - Notifications
      summary: 將目前登入使用者的一筆通知標為已讀
      operationId: markNotificationRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: 已讀狀態更新成功；重複呼叫保持首次 readAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 通知不存在，或不屬於目前登入使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/notifications/read-all:
    post:
      tags:
        - Notifications
      summary: 將目前登入使用者的所有未讀通知標為已讀
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: 全部已讀更新結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/admin/notifications:
    post:
      tags:
        - Admin
        - Notifications
      summary: 管理員發送系統／維護公告
      description: 僅發送給 `role=student` 且 `isActive=true` 的使用者。
      operationId: broadcastSystemNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNotificationRequest'
      responses:
        '201':
          description: 公告已建立並發送給目前所有 active students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/courses:
    get:
      tags:
        - Courses
      summary: 列出目前可存取的課程
      description: |
        依照目前登入者的角色與存取規則，回傳可見的課程列表。

        這個回應在 Phase-1 是 `bridge-aware`，可能會帶出 `qaScopeOnly`、`bridgeMode` 等欄位，讓 frontend 或 demo 使用者可以區分一般課程與 QA-only 的 bridge 呈現。
      operationId: listCourses
      responses:
        '200':
          description: 成功取得課程列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Courses
      summary: 建立課程
      description: 僅限 teacher / admin 使用的課程建立端點。
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: 課程建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/courses/{courseId}:
    get:
      tags:
        - Courses
      summary: 依 courseId 讀取單一課程
      description: |
        回傳目前使用者可存取的單一課程。

        這個回應在 Phase-1 仍是 `bridge-aware`，可能帶出 `qaScopeOnly`、`bridgeMode` 與 bridge contract 提示欄位。
      operationId: getCourseById
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功取得課程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    patch:
      tags:
        - Courses
      summary: 部分更新課程
      description: 僅限 teacher（owner）/ admin 使用。可更新標題、描述、狀態等課程欄位。
      operationId: updateCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '200':
          description: 課程更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    delete:
      tags:
        - Courses
      summary: 刪除課程（cascade）
      description: |
        僅限 admin 或該課程的 owner teacher 使用。

        刪除會 cascade 清理對應的 Video / Segment / transcripts、`course.videoIds`、`Enrollment` 與 `User.activeCourseId`；
        但**保留** UsageLog / Question 歷史紀錄（改由 display 層分流顯示「內容已下架」）。
      operationId: deleteCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 課程刪除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        description: cascade 刪除結果摘要（清理的關聯資源數量等）。
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseManageDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
  /api/v1/courses/{courseId}/videos:
    get:
      tags:
        - Videos
      summary: 列出課程下的影片
      description: |
        回傳單一課程下的影片列表，並保留 Phase-1 的 `bridge-aware` 呈現方式。

        在 Phase-1，同一門課可能同時出現：
        - 帶有 processing metadata 的 app-owned video
        - 只用來做 QA 範圍呈現的 `metadataOnly` bridge video

        建議同時檢查 response 的 `meta` 區塊，以及每支影片上的 `metadataOnly`、`qaScopeOnly`、`isAppOwned` 等旗標。
      operationId: listCourseVideos
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 成功取得影片列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CourseAccessDeniedError'
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
    post:
      tags:
        - Videos
      summary: 上傳課程影片
      description: |
        僅限 teacher / admin 使用，並且用於建立 app-owned course video 的上傳端點。
        若 `YOUTUBE_AUTO_UPLOAD_ENABLED=true` 且 OAuth 設定完整，backend 會先以 FocusFlow 系統 YouTube 帳號走 Data API resumable upload，
        成功後把 `youtubeVideoId` 與 YouTube `videoUrl/sourceUrl` 寫回同一筆 `Video`，再沿用既有本機檔案 STT processing flow。
      operationId: createVideo
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - video
              properties:
                title:
                  type: string
                  description: 可選的顯示標題；若未提供，backend 會改用上傳檔名作為預設值。
                video:
                  type: string
                  format: binary
                  description: 影片檔案。backend 目前接受 MIME type 以 `video/` 開頭的檔案。
      responses:
        '201':
          description: 影片上傳成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoItemResponse'
        '400':
          description: 上傳 payload 不合法、courseId 無效，或上傳驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: courseId 格式錯誤
                  description: 路徑中的 `courseId` 不是合法的 MongoDB ObjectId。
                  value:
                    success: false
                    message: Invalid resource id.
                    error:
                      code: INVALID_ID
                missingFile:
                  summary: 缺少影片檔案
                  description: request 有送出 multipart/form-data，但缺少必要的 `video` 檔案欄位。
                  value:
                    success: false
                    message: Video file is required.
                    error:
                      code: VIDEO_FILE_REQUIRED
                invalidFileType:
                  summary: 檔案型別不被接受
                  description: 上傳檔案的 MIME type 不符合目前 backend 接受的 `video/` 規則。
                  value:
                    success: false
                    message: Only video uploads are allowed.
                    error:
                      code: INVALID_FILE_TYPE
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 呼叫端沒有權限建立或管理這門課的影片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  summary: 角色本身不允許上傳
                  description: 呼叫者不是 teacher / admin，因此先被角色層擋下。
                  value:
                    success: false
                    message: You do not have permission to perform this action.
                    error:
                      code: FORBIDDEN
                manageDenied:
                  summary: 不是課程管理者
                  description: 雖然角色允許，但呼叫者不是這門課的 owner teacher，也不是 admin。
                  value:
                    success: false
                    message: You do not have permission to manage this course.
                    error:
                      code: COURSE_MANAGE_DENIED
        '404':
          $ref: '#/components/responses/CourseNotFoundError'
        '502':
          description: YouTube OAuth 或影片上傳 API 失敗（僅 auto-upload 啟用時可能發生）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                youtubeUploadFailed:
                  value:
                    success: false
                    message: Failed to upload video to YouTube.
                    error:
                      code: YOUTUBE_UPLOAD_FAILED
        '503':
          description: YouTube auto-upload 已啟用，但 OAuth 憑證不完整
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                youtubeNotConfigured:
                  value:
                    success: false
                    message: YouTube OAuth credentials are not configured.
                    error:
                      code: YOUTUBE_UPLOAD_NOT_CONFIGURED
  /api/v1/courses/{courseId}/videos/youtube:
    post:
      tags:
