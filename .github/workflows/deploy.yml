name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /opt/focusflow
          git pull origin main

      - name: Backend dependencies
        run: |
          cd /opt/focusflow/backend
          npm install --production

      - name: Build frontend
        run: |
          cd /opt/focusflow/frontend/focus-flow
          npm install
          npm run build

      - name: Fix SELinux
        run: sudo restorecon -Rv /opt/focusflow/frontend/focus-flow/dist

      - name: Restart services
        env:
          QA_VECTOR_SEARCH_MODE: atlas
          QA_QUERY_EMBEDDING_PROVIDER: gemini
          GEMINI_EMBEDDING_MODEL_NAME: gemini-embedding-2
          QA_ATLAS_VECTOR_INDEX_NAME: text_embedding_index
          QA_ATLAS_FILTER_MODE: bridge_course_or_video
          QA_ACTIVE_LEAF_EMBEDDING_CONTRACT_JSON: >-
            {"provider":"gemini","model":"gemini-embedding-2","dimension":3072,"instructionVersion":"gemini_embedding_2_asymmetric_retrieval_v2","generationVersion":"text_search_generation_v2","normalizationVersion":"unit_l2_v1","contractVersion":"gemini_embedding_2_text_v2","schemaVersion":"gemini_embedding_2_text_v2","taskType":null}
        run: |
          pm2 restart focusflow-backend --update-env
          pm2 save
          sudo systemctl reload nginx

      - name: Verify backend and proxy readiness
        run: |
          for attempt in {1..30}; do
            if health_json=$(curl --fail --silent --show-error http://127.0.0.1:4000/health); then
              if node -e 'const qa=JSON.parse(process.argv[1])?.data?.runtime?.qa; const ready=qa?.readyForAsk === true && qa?.vectorSearchMode === "atlas" && qa?.queryEmbeddingProvider === "gemini" && qa?.atlasVectorIndexConfigured === true && qa?.dataContractCompatibility?.leaf?.status === "compatible"; process.exit(ready ? 0 : 1)' "$health_json"; then
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend did not reach readyForAsk=true."
              exit 1
            fi
            sleep 2
          done

          proxy_status=$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' \
            --resolve focusflow.ntub.edu.tw:443:127.0.0.1 \
            https://focusflow.ntub.edu.tw/api/v1/courses)
          if [ "$proxy_status" != "401" ]; then
            echo "Nginx API proxy readiness failed with HTTP $proxy_status."
            exit 1
          fi
          echo "Backend QA readiness and Nginx API proxy checks passed."
