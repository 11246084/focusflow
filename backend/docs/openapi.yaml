  /api/v1/shorts/{shortAssetId}/review:
    post:
      tags:
        - Shorts
      summary: 審核目前 generation 的 ShortAsset
      description: |
        Owner teacher 或 admin 可核准或退回 ShortAsset。Wire contract 使用 `status` 表示審核決定；
        `expectedGenerationVersion` 是使用者畫面實際讀到的 generation，backend 以它執行 compare-and-swap。

        `approved` 不接受退件 reasons，也不會直接把 lifecycle `status` 改為 `published`。
        `rejected` 至少需要一個結構化 reason；`other` 必須附非空白 note。

        若回傳 `SHORT_ASSET_REVIEW_STALE`，代表素材已產生新版本；若回傳
        `SHORT_ASSET_REVIEW_CONFLICT`，代表同一 generation 已由其他操作完成審核。
        兩種情況都應重新 GET 最新 server state，不應自動重送舊 request。
      operationId: reviewShortAsset
      parameters:
        - $ref: '#/components/parameters/ShortAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortAssetReviewRequest'
            examples:
              approve:
                summary: 核准目前 generation
                value:
                  status: approved
                  expectedGenerationVersion: 3
              reject:
                summary: 使用結構化理由退回
                value:
                  status: rejected
                  expectedGenerationVersion: 3
                  reasons:
                    - code: subtitleIssue
                      note: 00:18 的專有名詞字幕有誤
                    - code: other
                      note: 請補上片尾重點整理
      responses:
        '200':
          description: 審核已持久化；回應為更新後的 server snapshot，核准不代表已發布。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortAssetReviewItemResponse'
        '400':
          description: shortAssetId 格式錯誤，或 review payload 驗證失敗。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    success: false
                    message: Invalid short asset id.
                    error:
                      code: INVALID_ID
                validation:
                  value:
                    success: false
                    message: The other review reason requires a note.
                    error:
                      code: VALIDATION_ERROR
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ShortAssetReviewForbiddenError'
        '404':
          $ref: '#/components/responses/ShortAssetNotFoundError'
        '409':
          $ref: '#/components/responses/ShortAssetReviewConflictError'
  /api/v1/youtube/shorts:
    get:
      tags:
