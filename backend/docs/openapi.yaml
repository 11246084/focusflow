  /api/v1/line/webhook:
    post:
      tags:
        - LINE Webhook
      security:
        - LineSignature: []
      summary: 接收 LINE Platform webhook callback
      description: |
        這是提供 LINE Platform 使用的 `integration-facing` callback 端點。

        目前的 Phase-1 口徑如下：
        - 不作為 frontend 直接呼叫的 API
        - backend 會用 `x-line-signature` 對「原始 raw request body」做簽章驗證
        - 回 `200` 只代表 backend 已接收並處理這批 callback，不代表 live LINE delivery 已 fully verified
        - 若缺少 `LINE_CHANNEL_ACCESS_TOKEN`，系統仍可能在 `backend_only` 模式下處理事件，但跳過實際回訊
        - Swagger UI 的 Try it out 不會自動幫你計算簽章；若手動送出，除非 signature 與 request body bytes 完全一致，否則會驗證失敗
      operationId: handleLineWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookRequest'
            examples:
              textQuestion:
                value:
                  events:
                    - type: message
                      replyToken: reply-ask-001
                      source:
                        userId: line-student-001
                      message:
                        type: text
                        text: What does the course say about JWT authentication?
      responses:
        '200':
          description: backend 已接受並處理這批 webhook 事件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineWebhookResponse'
              examples:
                backendOnly:
                  summary: "`backend_only` 模式下的 webhook 處理範例"
                  description: 顯示 LINE webhook 已被 backend 接收，但因缺少 `LINE_CHANNEL_ACCESS_TOKEN`，reply 被標記為 skipped，仍保留 `degraded` runtime 訊號。
                  value:
                    success: true
                    message: LINE webhook processed.
                    data:
                      received: 1
                      processed: 1
                      lineRuntime:
                        signatureValidationConfigured: true
                        liveReplyConfigured: false
                        liveFlowReady: false
                        readiness: degraded
                        deliveryMode: backend_only
                        missingConfig:
                          - LINE_CHANNEL_ACCESS_TOKEN
                        hardFailures: []
                        degradedReasons:
                          - code: LINE_CHANNEL_ACCESS_TOKEN_MISSING
                            message: LINE_CHANNEL_ACCESS_TOKEN is missing, so LINE replies stay in backend-only mode.
                      results:
                        - type: question
                          handled: true
                          matchCount: 1
                          replySent: false
                          replySkipped: true
                          replyReason: line_channel_access_token_missing
                          qaRuntime:
                            status: degraded
                            degraded: true
                            resultCategory: matched_degraded
                            matchStatus: matched
                            answerProviderUsed: template
                            searchableSegmentCount: 2
                            fallbackCount: 1
                            fallbackCodes:
                              - SEGMENT_EMBEDDING_MISSING
        '400':
          description: 無法取得 raw request body，或 JSON payload 解析失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  summary: JSON 內容格式錯誤
                  description: request body 存在，但 backend 無法成功解析成 JSON。
                  value:
                    success: false
                    message: Invalid JSON body.
                    error:
                      code: VALIDATION_ERROR
                rawBodyMissing:
                  summary: 缺少 raw body
                  description: 進行簽章驗證時，backend 找不到可供驗證的 raw request body。
                  value:
                    success: false
                    message: LINE raw request body is not available.
                    error:
                      code: LINE_RAW_BODY_MISSING
        '401':
          description: 缺少 LINE signature，或 signature 驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSignature:
                  summary: 缺少 `x-line-signature`
                  description: request 沒有帶入 LINE 平台要求的 signature header。
                  value:
                    success: false
                    message: Missing LINE signature.
                    error:
                      code: LINE_SIGNATURE_MISSING
                invalidSignature:
                  summary: LINE signature 驗證失敗
                  description: "`x-line-signature` 存在，但與 raw request body 計算出的結果不一致。"
                  value:
                    success: false
                    message: Invalid LINE signature.
                    error:
                      code: LINE_SIGNATURE_INVALID
        '500':
          $ref: '#/components/responses/LineNotConfiguredError'
  /api/v1/line/bind-token:
    post:
      tags:
        - LINE Webhook
      summary: 發放 LINE 帳號綁定 token
      description: |
        已登入使用者呼叫此端點後，backend 會建立一組 10 分鐘有效的一次性綁定碼。

        Frontend 可將 `token` 直接顯示給使用者，或轉成 QR Code / 深連結輔助使用者把系統帳號綁到 LINE Bot。
      operationId: issueLineBindToken
      responses:
        '201':
          description: 成功建立 LINE 綁定 token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineBindTokenResponse'
              examples:
                success:
                  value:
                    success: true
                    message: Bind token issued.
                    data:
                      token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      expiresAt: '2026-04-28T10:10:00.000Z'
                    meta:
                      lineRuntime:
                        signatureValidationConfigured: true
                        liveReplyConfigured: false
                        liveFlowReady: false
                        readiness: degraded
                        deliveryMode: backend_only
                        missingConfig:
                          - LINE_CHANNEL_ACCESS_TOKEN
                        hardFailures: []
                        degradedReasons:
                          - code: LINE_CHANNEL_ACCESS_TOKEN_MISSING
                            message: LINE_CHANNEL_ACCESS_TOKEN is missing, so LINE replies stay in backend-only mode.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/youtube/shorts:
    get:
      tags:
        - Shorts
      summary: 取得學生修課範圍內可播放的教學短片
      description: |
        只回傳目前學生 Enrollment 對應、Course.status=published、ShortAsset.status=published，且 youtubeAvailability=playable 的資產。
        使用 publishedAt + _id 的 opaque pageToken 做穩定降冪分頁；相同發布時間以 _id 作 tie-break。
      operationId: listStudentShorts
      parameters:
        - name: pageToken
          in: query
          required: false
          description: 後端產生的 opaque cursor；不可由客戶端自行組裝。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 每頁筆數，預設 20，最多 50。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 成功取得修課 Shorts feed；無修課或無可播放 Short 時 items 為空陣列。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortsFeedResponse'
              examples:
                success:
                  value:
                    success: true
                    message: OK
                    data:
                      items:
                        - videoId: youtube-video-id
                          title: JWT auth overview
                          thumbnail: https://i.ytimg.com/vi/youtube-video-id/hqdefault.jpg
                          publishedAt: '2026-07-18T00:00:00.000Z'
                          assetId: 507f1f77bcf86cd799439011
                          course:
                            courseId: 507f1f77bcf86cd799439012
                            title: Backend Fundamentals
                          youtubeUrl: https://www.youtube.com/watch?v=youtube-video-id
                      nextPageToken: opaque-token
        '400':
          description: pageToken 無法解析，或 limit 不在 1–50 範圍。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPageToken:
                  value:
                    success: false
                    message: Invalid pageToken.
                    error:
                      code: INVALID_PAGE_TOKEN
                invalidLimit:
                  value:
                    success: false
                    message: limit must be an integer between 1 and 50.
                    error:
                      code: VALIDATION_ERROR
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    LineSignature:
      type: apiKey
      in: header
      name: x-line-signature
      description: |
        使用 `LINE_CHANNEL_SECRET`，對「完整且未改動的 raw webhook body」計算出的 HMAC-SHA256 signature。

        這是一個 `integration-facing` 的簽章驗證流程；Swagger UI 不會自動替你計算 signature。
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: 目標課程的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
    VideoId:
      name: videoId
      in: path
      required: true
      description: 目標影片的 MongoDB ObjectId。
      schema:
        $ref: '#/components/schemas/ObjectId'
  responses:
    ValidationError:
      description: request payload 驗證失敗。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: 一般欄位驗證失敗
              description: 代表 request 結構存在欄位缺漏、型別錯誤，或其他基本驗證失敗情況。
              value:
                success: false
                message: Validation failed.
                error:
                  code: VALIDATION_ERROR
                  details:
                    - title is required
    InvalidCredentialsError:
      description: email 或 password 不正確。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              summary: 帳號或密碼錯誤
              description: 使用者提供的 email 或 password 無法通過驗證。
              value:
                success: false
                message: Invalid email or password.
                error:
                  code: INVALID_CREDENTIALS
    UserInactiveError:
      description: 使用者存在，但目前為 inactive。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userInactive:
              summary: 帳號存在但已停用
              description: 使用者資料存在，但目前 `isActive=false`，因此不允許登入。
              value:
                success: false
                message: User is inactive.
                error:
                  code: USER_INACTIVE
    UnauthorizedError:
      description: 缺少 bearer token，或 token 對應的使用者目前不可用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: 尚未通過身份驗證
              description: 請求未帶入必要的 Bearer token，或目前請求情境需要先完成認證。
              value:
                success: false
                message: Authentication required.
                error:
                  code: UNAUTHORIZED
    ForbiddenError:
      description: 已登入，但角色不符合此端點要求。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: 角色權限不足
              description: 呼叫者已登入，但角色不符合這個端點的授權條件。
              value:
                success: false
                message: You do not have permission to perform this action.
                error:
                  code: FORBIDDEN
    InvalidIdError:
      description: path 或 body 內的 ObjectId 格式不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidId:
              summary: ObjectId 格式錯誤
              description: path 或 body 中的資源識別值不是合法的 MongoDB ObjectId。
              value:
                success: false
                message: Invalid resource id.
                error:
                  code: INVALID_ID
    UserNotFoundError:
      description: token 驗證成功，但對應的使用者已不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userNotFound:
              summary: 找不到 token 對應的使用者
              description: token 本身可被驗證，但資料庫中已找不到對應 user。
              value:
                success: false
                message: User not found.
                error:
                  code: USER_NOT_FOUND
    CourseAccessDeniedError:
      description: 呼叫端沒有存取這門課的權限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseAccessDenied:
              summary: 沒有課程存取權
              description: 呼叫者雖已登入，但不符合這門課目前的課程存取規則。
              value:
                success: false
                message: You do not have access to this course.
                error:
                  code: COURSE_ACCESS_DENIED
    CourseManageDeniedError:
      description: 呼叫端沒有管理這門課或影片的權限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseManageDenied:
              summary: 沒有課程管理權
              description: 呼叫者不是課程 owner teacher，也不是 admin，因此不能執行管理型操作。
              value:
                success: false
                message: You do not have permission to manage this course.
                error:
                  code: COURSE_MANAGE_DENIED
    CourseNotFoundError:
      description: 找不到指定課程。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            courseNotFound:
              summary: 課程不存在
              description: 請求中的課程識別值格式正確，但資料庫中找不到對應課程。
              value:
                success: false
                message: Course not found.
                error:
                  code: COURSE_NOT_FOUND
    VideoNotFoundError:
      description: 找不到指定影片。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            videoNotFound:
              summary: 影片不存在
              description: 請求中的影片識別值格式正確，但資料庫中找不到對應影片。
              value:
                success: false
                message: Video not found.
                error:
                  code: VIDEO_NOT_FOUND
    VideoMetadataOnlyError:
      description: "`metadataOnly` 的 bridge video 不提供 processing state。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            videoMetadataOnly:
              summary: bridge video 僅有 metadata
              description: 這支影片目前是 `metadataOnly` 狀態，只用於 QA scope，不暴露 processing 狀態。
              value:
                success: false
                message: This video is metadata-only for QA scope and does not expose processing status.
                error:
                  code: VIDEO_METADATA_ONLY
    VideoProcessingTransitionInvalidError:
      description: 目前 processing state 無法轉移到要求的目標狀態。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidTransition:
              summary: processing 狀態轉移不合法
              description: 目前影片的 processing state 與要求的目標狀態不相容，因此不能執行轉移。
              value:
                success: false
                message: Cannot transition video processing from completed to queued.
                error:
                  code: VIDEO_PROCESSING_TRANSITION_INVALID
    QaRuntimeMisconfiguredError:
      description: QA runtime 設定對這次操作而言不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            qaRuntimeMisconfigured:
              summary: QA runtime 設定錯誤
              description: provider、金鑰或 mode 的設定不符合目前執行條件，因此 backend 直接以 `hard_fail` 結束。
              value:
                success: false
                message: GEMINI_API_KEY is required when QA_ANSWER_PROVIDER=gemini.
                error:
                  code: QA_RUNTIME_MISCONFIGURED
                  details:
                    readiness: hard_fail
    QaAtlasNotReadyError:
      description: "`atlas` vector-search mode 已配置，但仍未達到 Phase-1 可執行條件。"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            qaAtlasNotReady:
              summary: Atlas mode 尚未 ready
              description: backend 偵測到 `atlas` mode 已被啟用，但目前不符合 Phase-1 可用條件，因此拒絕執行。
              value:
                success: false
                message: Atlas vector search is configured but not ready. Check the Atlas index, query embedding provider, and /health before retrying.
                error:
                  code: QA_ATLAS_NOT_READY
    LineNotConfiguredError:
      description: backend 缺少 `LINE_CHANNEL_SECRET`，因此無法完成 LINE signature 驗證。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            lineNotConfigured:
              summary: LINE signature 驗證條件不足
              description: backend 尚未配置 `LINE_CHANNEL_SECRET`，因此無法驗證 LINE webhook 的簽章。
              value:
                success: false
                message: LINE_CHANNEL_SECRET is not configured.
                error:
                  code: LINE_NOT_CONFIGURED
  schemas:
    ObjectId:
      description: MongoDB ObjectId 的字串格式。
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f191e810c19729de860eb
    UserRole:
      description: 系統目前支援的使用者角色列舉。
      type: string
      enum:
        - admin
        - teacher
        - student
    CourseStatus:
      description: 課程狀態列舉。
      type: string
      enum:
        - draft
        - published
        - archived
    BridgeMode:
      description: |
        Phase-1 課程或影片的 `bridge` 呈現模式。

        `bridge` 代表目前資料仍處於 app-owned records 與 pipeline metadata 共存的過渡狀態。
        `qa_scope_only` 代表這份資料主要只用來提供 QA 範圍，不保證具備完整 app-owned video 行為。
      type: string
      enum:
        - standard
        - qa_scope_only
        - mixed_scope
    VideoSourceType:
      description: 影片來源型別列舉。
      type: string
      enum:
        - upload
        - external_url
        - youtube
    VideoProcessingStatus:
      description: 影片 processing 狀態列舉。
      type: string
      enum:
        - queued
        - processing
        - completed
        - failed
    ReadinessStatus:
      description: runtime readiness 狀態列舉。
      type: string
      enum:
        - ready
        - degraded
        - hard_fail
    LineDeliveryMode:
      description: LINE webhook / reply flow 的交付模式列舉。
      type: string
      enum:
        - live
        - backend_only
        - disabled
    SuccessBase:
      description: 所有成功回應共用的 envelope 基底。
      type: object
      required:
        - success
        - message
      properties:
        success:
          const: true
        message:
          type: string
    ErrorResponse:
      description: 所有錯誤回應共用的 envelope 格式。
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          const: false
        message:
          type: string
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
            details:
              description: 可選的 endpoint-specific error details；實際結構會依 error 類型而不同。
    DiagnosticItem:
      description: 用於 warnings、hardFailures 或 degradedReasons 的診斷項目。
      type: object
      required:
        - code
        - message
      properties:
