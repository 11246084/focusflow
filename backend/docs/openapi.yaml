openapi: 3.1.0
info:
  title: FocusFlow Backend API 文件
  version: 0.1.0-phase1
  description: |
    這份文件整理 FocusFlow backend 目前 Phase-1 MVP 的 API 契約與回應口徑。

    本文件的範圍：
    - 讓 frontend、組員與老師可以快速理解目前 live backend 的 API 契約
    - 如實描述 phase-1 的 `bridge-aware` 與 runtime 可觀測回應
    - 不把 Atlas retrieval、query embedding 對齊、或 live LINE delivery 說成 production-ready

    覆蓋範圍（2026-09-25 更新）：
    - 本 spec 是 `/api/v1/*` 與 `/health` 的公開／應用層 API contract，涵蓋 Express 實際註冊的每一個 method + path
    - `backend/tests/docs.routes.test.js` 會從 runtime router 盤點 routes 並與本檔比對；新增或刪除 route 未同步本檔時測試會失敗
    - 刻意不收錄：internal processing webhook（`/api/v1/internal/*`，只供 STT pipeline 以共享 secret 呼叫）與 `GET /api/v1/line/webhook`（LINE Console 驗證 URL 用的探測）
    - Shorts 僅代表修課 feed 與 metadata sync 已實作，不代表自動選片、剪輯、字幕或發布 worker 已完成
    - Short Scripts 整組受 `SHORT_SCRIPT_AUTOMATION_ENABLED` feature flag 控制，預設關閉

    本檔以手寫 YAML 維護，不做 route-level JSDoc generation；結構檢查用 `npm run docs:lint`（Redocly）。
servers:
  - url: /
    description: Same-origin backend root。Swagger UI 的 Try it out 會直接使用目前開啟的 host 與 port。
tags:
  - name: Health
    description: Phase-1 的 observability 與 bootstrap 檢查入口，適合用於 demo 前的安全驗證路徑。
  - name: Auth
    description: 提供 JWT login、current-user 查詢與 authenticated avatar 上傳／讀取。
  - name: Notifications
    description: 目前登入使用者的站內通知列表、已讀狀態與 admin 系統公告。
  - name: Courses
    description: 已登入後可使用的課程 API。Phase-1 的課程回應是 `bridge-aware`，可能會揭露 QA scope 相關 metadata。
  - name: Videos
    description: 涵蓋影片列表、詳細資料、processing 狀態、上傳與 `guarded action` 類型的操作端點。
  - name: Shorts
    description: |
      學生修課限定的已發布 ShortAsset feed，以及 owner teacher／admin 使用的 ShortAsset 審核 API。
      審核狀態與素材 lifecycle 狀態分離；核准不等於直接發布。
  - name: QA
    description: 問答 API，會明確回傳 runtime diagnostics 與 phase-1 fallback 訊號。
  - name: Stats
    description: Teacher / Student dashboard 的彙總統計端點，回應為彙整後的 dashboard 數據。
  - name: Admin
    description: 僅限 admin 角色使用的後台管理端點（使用者、影片、事件統計）；全部需 Bearer token + admin 權限。
  - name: Feedback
    description: |
      已登入使用者（student、teacher、admin）回報系統問題，可附最多 3 張截圖。
      回報列表與處理狀態由 Admin 端點管理。
  - name: Short Scripts
    description: |
      課程 owner teacher 或 admin 使用的短影片腳本流程：自動選題與證據凍結、LLM 生成、腳本審核、依腳本上傳成品影片，以及成品的 YouTube 上傳重試。

      整組路由受 `SHORT_SCRIPT_AUTOMATION_ENABLED` 控制，預設關閉。關閉時回 `404 NOT_FOUND`，不透露功能存在；
      feature flag 檢查排在這組路由自己的身分驗證之前，所以 `/api/v1/short-scripts/*`、`/api/v1/short-assets/*` 未帶 token 也回 404。
      例外：`/api/v1/courses/{courseId}/short-*` 會先經過課程路由的身分驗證，未帶 token 時回 `401`。

      Short Script 回應是 MongoDB 文件原樣輸出，識別欄位為 `_id`，並帶有 Mongoose 的 `__v`；與其他資源使用的 `id` 不同。
  - name: LINE Webhook
    description: |
      LINE Platform 的 `integration-facing` webhook callback 入口。

      這不是一般 frontend 直接呼叫的 API。
      本文件只描述目前 backend 可觀測的 Phase-1 流程，不代表 live production integration 已完整驗證。
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      security: []
      summary: 讀取 backend runtime 狀態
      description: |
        這是 Phase-1 的 observability 端點，主要用於 bootstrap 檢查與 demo 前的 runtime 檢視。

        它會回傳目前 QA 與 LINE 的 runtime snapshot。請把它視為 `readiness` / diagnostics 入口，而不是所有下游整合都已 fully production-ready 的證明。
      operationId: getHealth
      responses:
        '200':
          description: 服務健康狀態快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: 健康檢查成功範例
