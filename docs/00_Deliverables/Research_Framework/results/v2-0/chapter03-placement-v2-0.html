<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>第三章圖文排版預覽</title><style>*{box-sizing:border-box}html,body{margin:0;background:#ddd}.page{width:210mm;min-height:297mm;padding:20mm 25mm;background:white;color:#111;font:12pt/1.7 "DFKai-SB","Microsoft JhengHei",serif;margin:auto}h1{font-size:16pt;margin:0 0 5mm}p{text-align:justify;margin:0 0 5mm}.figure{margin:0}svg{display:block;width:160mm;height:auto}figcaption{font-size:11pt;text-align:center;margin-top:3mm}.source{font-size:10pt;line-height:1.5;margin-top:2mm}.note{font-size:10pt;color:#555;margin-top:8mm}@page{size:A4;margin:0}@media print{html,body{background:white}}</style></head><body><article class="page"><h1>3-1　系統架構</h1><p>本系統的核心處理流程如圖3-1-2所示。教學影片先經語音辨識、文字正規化與規則式分段，建立帶時間資訊的語意索引。學生於授權課程內提問後，系統檢索教材片段並生成回答，提供來源與影片時間跳轉；累積提問另可轉為短影音腳本，由教師於系統外製作成品，經審核後供學生複習。</p><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1116" viewBox="0 0 1100 1116" role="img" aria-labelledby="ff-v2-title ff-v2-desc">
