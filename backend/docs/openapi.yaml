          minimum: 0
        userMonthlyTokenQuota:
          type: integer
          minimum: 0
    MultimodalRuntimeSnapshot:
      description: "`video_segments_video` / multimodal QA 的 runtime readiness 快照。目前僅用來顯示尚未接入 QA 的阻塞條件。"
      type: object
      required:
        - segmentCollection
        - vectorIndexName
        - expectedVectorIndexName
        - vectorIndexConfigured
        - expectedVectorIndexDefinition
        - setupCommand
        - readiness
        - readyForQa
        - blockers
