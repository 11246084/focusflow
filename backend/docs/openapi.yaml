  /api/v1/line/webhook:
    post:
      tags:
        - LINE Webhook
      security:
        - LineSignature: []
      summary: 接收 LINE Platform webhook callback
      description: |
        這是提供 LINE Platform 使用的 `integration-facing` callback 端點。

        目前的 Phase-1 口徑如下：
        - 不作為 frontend 直接呼叫的 API
        - backend 會用 `x-line-signature` 對「原始 raw request body」做簽章驗證
        - 回 `200` 只代表 backend 已接收並處理這批 callback，不代表 live LINE delivery 已 fully verified
        - 若缺少 `LINE_CHANNEL_ACCESS_TOKEN`，系統仍可能在 `backend_only` 模式下處理事件，但跳過實際回訊
        - Swagger UI 的 Try it out 不會自動幫你計算簽章；若手動送出，除非 signature 與 request body bytes 完全一致，否則會驗證失敗
      operationId: handleLineWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookRequest'
            examples:
              textQuestion:
                value:
                  events:
                    - type: message
                      replyToken: reply-ask-001
                      source:
                        userId: line-student-001
                      message:
                        type: text
                        text: What does the course say about JWT authentication?
      responses:
        '200':
          description: backend 已接受並處理這批 webhook 事件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineWebhookResponse'
              examples:
                backendOnly:
                  summary: "`backend_only` 模式下的 webhook 處理範例"
                  description: 顯示 LINE webhook 已被 backend 接收，但因缺少 `LINE_CHANNEL_ACCESS_TOKEN`，reply 被標記為 skipped，仍保留 `degraded` runtime 訊號。
                  value:
                    success: true
                    message: LINE webhook processed.
                    data:
                      received: 1
                      processed: 1
                      lineRuntime:
                        signatureValidationConfigured: true
                        liveReplyConfigured: false
                        liveFlowReady: false
                        readiness: degraded
                        deliveryMode: backend_only
                        missingConfig:
                          - LINE_CHANNEL_ACCESS_TOKEN
                        hardFailures: []
                        degradedReasons:
                          - code: LINE_CHANNEL_ACCESS_TOKEN_MISSING
                            message: LINE_CHANNEL_ACCESS_TOKEN is missing, so LINE replies stay in backend-only mode.
                      results:
                        - type: question
                          handled: true
                          matchCount: 1
                          replySent: false
                          replySkipped: true
                          replyReason: line_channel_access_token_missing
                          qaRuntime:
                            status: degraded
                            degraded: true
                            matchStatus: matched
                            answerProviderUsed: template
                            searchableSegmentCount: 2
                            fallbackCount: 1
                            fallbackCodes:
                              - SEGMENT_EMBEDDING_MISSING
        '400':
          description: 無法取得 raw request body，或 JSON payload 解析失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  summary: JSON 內容格式錯誤
                  description: request body 存在，但 backend 無法成功解析成 JSON。
                  value:
                    success: false
                    message: Invalid JSON body.
                    error:
                      code: VALIDATION_ERROR
                rawBodyMissing:
                  summary: 缺少 raw body
                  description: 進行簽章驗證時，backend 找不到可供驗證的 raw request body。
                  value:
                    success: false
                    message: LINE raw request body is not available.
                    error:
                      code: LINE_RAW_BODY_MISSING
        '401':
          description: 缺少 LINE signature，或 signature 驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSignature:
                  summary: 缺少 `x-line-signature`
                  description: request 沒有帶入 LINE 平台要求的 signature header。
                  value:
                    success: false
                    message: Missing LINE signature.
                    error:
                      code: LINE_SIGNATURE_MISSING
                invalidSignature:
                  summary: LINE signature 驗證失敗
                  description: "`x-line-signature` 存在，但與 raw request body 計算出的結果不一致。"
                  value:
                    success: false
                    message: Invalid LINE signature.
                    error:
                      code: LINE_SIGNATURE_INVALID
        '500':
          $ref: '#/components/responses/LineNotConfiguredError'
  /api/v1/line/bind-token:
    post:
      tags:
        - LINE Webhook
      summary: 發放 LINE 帳號綁定 token
      description: |
        已登入使用者呼叫此端點後，backend 會建立一組 10 分鐘有效的一次性綁定碼。

        Frontend 可將 `token` 直接顯示給使用者，或轉成 QR Code / 深連結輔助使用者把系統帳號綁到 LINE Bot。
      operationId: issueLineBindToken
      responses:
        '201':
          description: 成功建立 LINE 綁定 token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineBindTokenResponse'
              examples:
                success:
                  value:
                    success: true
                    message: Bind token issued.
                    data:
                      token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      expiresAt: '2026-04-28T10:10:00.000Z'
                    meta:
                      lineRuntime:
                        signatureValidationConfigured: true
                        liveReplyConfigured: false
                        liveFlowReady: false
                        readiness: degraded
                        deliveryMode: backend_only
                        missingConfig:
                          - LINE_CHANNEL_ACCESS_TOKEN
                        hardFailures: []
                        degradedReasons:
                          - code: LINE_CHANNEL_ACCESS_TOKEN_MISSING
                            message: LINE_CHANNEL_ACCESS_TOKEN is missing, so LINE replies stay in backend-only mode.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/line/binding:
    delete:
      tags:
        - LINE Webhook
      summary: 解除目前使用者的 LINE 綁定
      description: |
        清除目前登入使用者的 `lineUserId`、LINE 對話狀態、對話歷史與 LINE 目前課程，
        之後可重新取得綁定碼綁到另一個 LINE 帳號。尚未綁定時也回 200，`unbound` 為 false。
      operationId: unbindLineAccount
      responses:
        '200':
          description: 已解除綁定（或原本就未綁定）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      unbound:
                        type: boolean
                        description: 呼叫前是否有綁定 LINE 帳號
              examples:
                success:
                  value:
                    success: true
                    message: LINE account unbound.
                    data:
                      unbound: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
