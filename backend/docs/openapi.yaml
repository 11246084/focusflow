          type: string
        handled:
          type: boolean
        reason:
          anyOf:
            - type: string
            - type: 'null'
        replySent:
          type: boolean
        replySkipped:
          type: boolean
        replyReason:
          anyOf:
            - type: string
            - type: 'null'
        errorCode:
          anyOf:
            - type: string
            - type: 'null'
        matchCount:
          type: integer
          minimum: 0
        qaRuntime:
          anyOf:
            - $ref: '#/components/schemas/LineQuestionQaRuntime'
            - $ref: '#/components/schemas/LineFailureQaRuntime'
            - type: 'null'
