    <image href="../images/mark-color.png" x="1172" y="38" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="module-owners" data-pptx-bounds="56 186 568 236">
    <text x="64" y="212" font-size="22" font-weight="bold" fill="#1B4D5C">模組負責人（Notion 專案面板）</text>
    <g fill="#F5EFE3">
      <rect x="64" y="228" width="552" height="42"/>
      <rect x="64" y="320" width="552" height="42"/>
    </g>
    <g font-size="22" font-weight="bold" fill="#1B4D5C">
      <text x="80" y="257">邱偉豪</text>
      <text x="80" y="303">張庭語</text>
      <text x="80" y="349">張家瑜</text>
      <text x="80" y="395">鍾百陶</text>
    </g>
    <g font-size="22" fill="#15171A">
      <text x="200" y="257">後端開發、伺服器部署與運維</text>
      <text x="200" y="303">AI 模組</text>
      <text x="200" y="349">前端開發</text>
      <text x="200" y="395">LINE 開發、資料庫</text>
    </g>
  </g>
  <g id="collaboration" data-pptx-bounds="56 428 568 200">
    <text x="64" y="456" font-size="22" font-weight="bold" fill="#1B4D5C">案例中的協作<tspan x="64" dy="32" font-weight="normal" fill="#15171A">・案例 A：Pipeline 端遷移由張庭語提交</tspan><tspan x="64" dy="32" font-weight="normal" fill="#15171A">・案例 B：人工複核由兩人分審答案與引用</tspan></text>
    <text x="64" y="566" font-size="22" fill="#15171A">commit 數（11-01，依學號推定作者）：<tspan x="64" dy="32" font-weight="bold" fill="#1B4D5C">邱偉豪 483・鍾百陶 149・張庭語 44・張家瑜 24</tspan></text>
    <text x="64" y="622" font-size="18" fill="#5A6066">commit 數不代表工作量：會議、文件、測試未必有 commit</text>
