<body><div class="ff-bg" aria-hidden="true"></div><div id="app"></div><div class="demo-toast" role="status" hidden></div>
<script>
/* 本檔為本機設計原型，資料與秒數虛構。沒有網路呼叫、實際音訊、MP4 或發布。 */
const transcript = [
 ['s1','12:28.2','上禮拜我們做到影像前處理，先處理顏色。','複習',false],
 ['s2','12:34.1','彩色圖有三個通道，讀取順序要注意。','複習',false],
 ['s3','12:40.0','轉成灰階可以用 cvtColor。','複習',false],
 ['s4','12:45.1','後面的邊緣偵測都在灰階圖上做。','複習',false],
 ['s5','12:51.8','OpenCV 跟 YOLO，其實是兩種不同的東西。','結論或定義',true],
 ['s6','12:58.3','OpenCV 本身是一個工具箱，裡面有處理影像的函式。','結論或定義',true],
 ['s7','13:04.9','裁切、模糊、找邊緣，都能從這個工具箱拿工具來用。','例子',true],
 ['s8','13:10.2','我畫面上這個，是剛剛示範的結果。','需要看原畫面',false],
 ['s9','13:16.0','但它不會自己知道畫面裡是貓還是狗。','理由',true],
 ['s10','13:22.4','YOLO 則是已經訓練好的模型，能認出畫面裡的物體。','結論或定義',true],
 ['s11','13:29.7','丟一張圖進去，它會告訴你哪裡有人、哪裡有車。','例子',true],
 ['s12','13:35.1','YOLO 很快，可以接攝影機即時辨識。','AI 原本略過',true],
 ['s13','13:41.0','作業的繳交期限是下禮拜五。','離題',false],
 ['s14','13:46.8','工具和模型不同。','片頭重點句・2.4 秒',true],
 ['s15','13:52.5','兩者也常一起用：先用 OpenCV 讀影片，再交給 YOLO 辨識。','例子',true],
 ['s16','13:59.9','就是工具跟模型，工具跟模型。','重複',false],
 ['s17','14:05.2','你看這邊這行，是讀出第一張畫面。','需要看原畫面',false],
 ['s18','14:12.0','我們回到剛剛的影像處理。','離題',false],
 ['s19','14:18.0','低的門檻數字比較容易留下邊緣。','離題',false],
 ['s20','14:24.6','高的門檻比較嚴，一定是邊緣才會留下來。','離題',false],
];
const durations=[5.9,5.9,5.1,6.7,6,7.1,6,5.8,5.4,7.5,6.2,5.9,5.8,2.4,10,4.2,6.8,5,6.2,6];
const base=new Set(['s5','s6','s7','s9','s10','s11','s14','s15']);
const query=new URLSearchParams(location.search);
const screen=Math.min(7,Math.max(1,Number(query.get('screen'))||1));
const product=screen>=6;
const renderMode=screen===3&&query.get('mode')==='render';
const phase=product?3:renderMode?2:1;
const chosen=query.has('sel')?new Set(query.get('sel').split(',').filter(x=>/^s\d+$/.test(x))):new Set(base);
if((screen===2||screen===3||product)&&!query.has('sel'))chosen.add('s12');
let currentSelection=new Set(chosen);
const baseline=query.has('base')?new Set(query.get('base').split(',')):new Set(base);
let currentTab=product?(query.get('tab')||'video'):(screen===5?'ai':'script');
const paths={
home:'<path d="m3 10 9-7 9 7v10H4V10Zm6 10v-7h6v7"/>',
course:'<path d="M3 4h7c2 0 2 1 2 2v15c0-2-2-3-4-3H3Zm18 0h-7c-2 0-2 1-2 2v15c0-2 2-3 4-3h5Z"/>',
upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/>',
film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m8 4 3 5m4-5 3 5M3 10h18m-11 3 5 3-5 2Z"/>',
bell:'<path d="M5 17h14l-2-4V8a5 5 0 0 0-10 0v5Zm5 3h4"/>',
file:'<path d="M6 3h8l4 4v14H6Zm8 0v5h4M9 12h6M9 16h5"/>',
spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',
check:'<path d="m5 12 4 4L19 6"/>',
play:'<path d="m9 5 10 7-10 7Z"/>',
pause:'<path d="M8 5v14M16 5v14"/>',
listen:'<path d="M4 12v-2a8 8 0 0 1 16 0v2M4 11H2v7h4v-7Zm16 0h2v7h-4v-7Z"/>',
chevron:'<path d="m9 5 7 7-7 7"/>',
time:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
edit:'<path d="m4 16-1 5 5-1L20 8l-4-4Z"/><path d="m14 6 4 4"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',
};
function icon(name){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+paths[name]+'</svg>';}
function primary(text,action,disabled=false){return '<button class="btn-primary" type="button" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+text+'</button>';}
function secondary(text,action){return '<button class="btn-ghost" type="button" data-action="'+action+'">'+text+'</button>';}
function url(n,options={}){const p=new URLSearchParams({screen:String(n)});if(query.has('sel'))p.set('sel',query.get('sel'));if(query.has('paused'))p.set('paused',query.get('paused'));Object.entries(options).forEach(([k,v])=>p.set(k,v));return '?'+p;}
function go(n,options={}){location.search=url(n,options);}
function duration(set=currentSelection){return transcript.reduce((sum,row,i)=>sum+(set.has(row[0])?durations[i]:0),0).toFixed(1);}
function dirty(){return [...new Set([...currentSelection,...baseline])].some(id=>currentSelection.has(id)!==baseline.has(id));}
function workflow(){
 const first=screen===2?'修改講稿':screen===3&&!renderMode?'更新講稿':'確認講稿';
 const names=[first,'製作短片','確認成品'];
 return '<div class="journey"><ol class="steps" aria-label="短片製作進度">'+names.map((name,i)=>{
 const complete=i<phase-1,active=i===phase-1;
 return (i?'<li class="step-link '+(complete||active&&phase>1?'complete':'')+'" aria-hidden="true"></li>':'')+'<li class="step '+(complete?'complete':active?'current':'future')+'"'+(active?' aria-current="step"':'')+'><span class="step-symbol" aria-hidden="true">'+(complete?icon('check'):i+1)+'</span><span class="step-name">'+name+'</span><span class="sr-only">'+(complete?'已完成':active?'目前階段':'尚未開始')+'</span></li>';
 }).join('')+'</ol></div>';
}
function nav(tab=currentTab){
 const tabs=product?[['video','看短片','film'],['script','完整講稿','file'],['ai','AI 建議','spark']]:[['script','完整講稿','file'],['ai','AI 建議','spark']];
 return '<nav class="review-nav" aria-label="審閱內容">'+tabs.map(([key,label,symbol])=>'<a href="'+url(product?6:key==='ai'?5:1,product?{tab:key}:{})+'" class="'+(tab===key?'active':'')+'"'+(tab===key?' aria-current="page"':'')+'>'+icon(symbol)+label+(key==='ai'?'<span class="count" aria-label="2 項建議">2</span>':'')+'</a>').join('')+'</nav>';
}
function prose(){
 const text=id=>transcript.find(row=>row[0]===id)[2];
 const groups=[['s5'],['s6','s7'],['s9'],['s10','s11','s12'],['s15']];
 const rendered=new Set(['s14',...groups.flat()]);
 let paras=groups.map(ids=>ids.filter(id=>currentSelection.has(id)).map(text).join('')).filter(Boolean);
 const other=transcript.filter(row=>currentSelection.has(row[0])&&!rendered.has(row[0])).map(row=>row[2]);
 if(other.length)paras=[...transcript.filter(row=>currentSelection.has(row[0])&&row[0]!=='s14').map(row=>row[2])];
 return '<div class="prose">'+(currentSelection.has('s14')?'<p class="opening">'+text('s14')+'</p>':'')+paras.map(p=>'<p>'+p+'</p>').join('')+'</div>';
}
function paper(){return '<article class="document">'+nav('script')+'<div class="paper">'+prose()+'</div></article>';}
function decision(disabled=false){
 return '<aside class="review-actions"><h2>確認講稿內容</h2><div class="review-summary"><span class="audio-origin">'+icon('listen')+'老師原音</span><div class="duration-summary">'+icon('time')+'<div class="duration-value"><span>預估時長</span><strong>'+duration()+' <small>秒</small></strong></div></div></div><div class="stack">'+primary('通過講稿，製作短片','approve',disabled)+secondary('修改內容','edit')+'</div>'+(disabled?'<p class="action-note warn">請先套用修改，或全部復原。</p>':'')+'</aside>';
}
function advice(){
 return '<section class="suggestions"><h2>AI 建議</h2><p class="subline">選取認同的建議，套用後再確認新版。</p><div class="suggestion"><label class="suggestion-title"><input type="checkbox" class="ai-choice" value="caption" checked><h3>字幕意思可能走樣</h3></label><div class="suggestion-body"><dl class="comparison"><dt>目前</dt><dd class="before">YOLO 是最準的辨識模型</dd><dt>建議</dt><dd>YOLO 是已訓練好的模型</dd></dl><p>老師只說模型已經訓練好，沒有比較誰最準。</p><p class="scope">只修改字幕，不改老師聲音與選句。</p></div></div><div class="suggestion"><label class="suggestion-title"><input type="checkbox" class="ai-choice" value="sentence"><h3>補充即時辨識用途</h3></label><div class="suggestion-body"><p>加回原話：「YOLO 很快，可以接攝影機即時辨識。」</p><p class="scope">會增加一句原音與講稿長度；若涉及你已鎖定的選句，會先請你確認。</p></div></div><div class="suggest-actions">'+primary('套用所選建議（1 項）','apply-ai')+'<small>尚未套用</small></div></section>';
}
function wave(){return '<div class="wave" aria-hidden="true">'+Array(40).fill('<i></i>').join('')+'</div><div class="audio-track"><span></span></div><div class="audio-timing"><span>00:02</span><span>00:05.9</span></div>';}
function audio(inProduct=false){return '<section class="audio-box"><div class="mode">'+icon('listen')+'<span>正在聽老師原話</span></div><h2 class="sr-only">原音查核</h2><p class="quote">YOLO 很快，可以接攝影機即時辨識。</p><p class="source-time">原錄音 13:35.1–13:41.0</p>'+wave()+(inProduct?'<p class="audio-return">'+(query.get('paused')==='1'?'聽完回到短片 00:42.5，仍保持暫停。':'聽完會從短片 00:42.5 繼續播放。')+'</p>':'<p class="audio-return">聽完回到目前閱讀的位置。</p>')+'<div class="stack">'+secondary('暫停試聽','pause-audio')+primary(inProduct?'停止試聽，回到短片':'停止試聽，回到講稿','stop-audio')+'</div><p class="action-note">主動暫停或停止後，不會自動接播。</p></section>';}
function sourceRows(){return transcript.map(([id,time,text,reason])=>{
 const selected=currentSelection.has(id),changed=selected!==baseline.has(id);
 return '<div class="source-row '+(!selected?'skipped ':'')+(changed?'changed':'')+'" data-id="'+id+'"><label class="source-check"><input type="checkbox" value="'+id+'" '+(selected?'checked':'')+' aria-label="'+(selected?'保留':'加回')+'：'+text+'"></label><div><div class="sentence">'+text+'</div><div class="meta-line"><span>原錄音 '+time+'</span><span class="reason">'+(id==='s12'?'AI 原本略過':reason)+'</span>'+(changed?'<span class="added">'+(selected?'你加回的':'你移除的')+'・尚未套用</span>':'')+'</div></div><button class="listen-btn '+(id==='s12'?'active':'')+'" type="button" data-listen="'+id+'" aria-label="聽老師原話：'+text+'">'+icon('play')+'<span>聽老師原話</span></button></div>';
 }).join('');}
function editing(){return '<div class="layout"><div><div class="notice" id="dirty-notice">'+icon('info')+'<span>你加回了 1 句，尚未套用。請先套用修改或全部復原。</span></div><section class="document"><div class="editing-head"><h2>修改講稿內容</h2><p>選取要保留的原話；想確認內容時，可聽原錄音。</p></div><div class="source-list">'+sourceRows()+'</div><div class="sumbar"><div class="sum-info"><strong id="edit-duration">'+duration()+' 秒</strong><small>短片長度 30～65 秒</small></div><div class="sum-actions">'+secondary('全部復原','reset')+primary('套用修改','apply')+'</div></div></section></div><aside>'+audio()+'<div class="source-explainer"><strong>片頭重點句</strong><br>「工具和模型不同。」長 2.4 秒。移除時會提醒開場將改變，不會自行換句。</div><div class="review-actions"><div class="stack">'+primary('通過講稿，製作短片','approve',true)+'</div><p class="action-note">尚有未套用修改。</p></div></aside></div>';}
function busy(){
 const steps=renderMode?['講稿已確認','製作聲音、字幕與畫面','檢查影片成品']:['已保留你選取的原話','更新字幕與畫面安排','檢查內容與前後銜接'];
 return '<div class="busy-layout"><section class="busy-document"><div class="busy-heading"><div class="spinner" aria-hidden="true"></div><h2>'+(renderMode?'正在製作短片':'正在更新講稿內容')+'</h2></div><p class="busy-copy">'+(renderMode?'正在依通過的講稿製作影片。完成後，請再確認實際成品。':'你選好的原話已保留。完成後，會請你確認更新後的完整講稿。')+'</p><ol class="task-list">'+steps.map((t,i)=>'<li class="task-item '+(i===0?'done':i===1?'current':'')+'"><span class="task-dot" aria-hidden="true">'+(i===0?icon('check'):i+1)+'</span>'+t+'</li>').join('')+'</ol><div class="busy-bottom">'+secondary('取消，回到原本版本','cancel-update')+primary('通過講稿，製作短片','approve',true)+'<p class="action-note">'+(renderMode?'目前尚未產出影片，也尚未發布。':'取消或更新失敗會回原版，並保留未套用修改。')+'</p></div></section></div>';
}
function empty(){return '<section class="empty"><div class="empty-mark">'+icon('file')+'</div><h2>這段錄音沒有足夠內容回答問題</h2><p>學生問的是「OpenCV 跟 YOLO 差在哪」。這段錄音主要說明期末專題分組，沒有足夠原話解釋兩者差別。</p><div class="empty-actions">'+primary('回到選題','unavailable')+secondary('選擇其他產片方式','unavailable')+'</div><p class="small">還沒有製作講稿或影片。</p></section>';}
const toolbox='<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M26 25V18h28v7" fill="none" stroke="#FFD3A2" stroke-width="5"/><rect x="9" y="25" width="62" height="43" rx="7" fill="#E8A150"/><path d="M9 41h62" stroke="#FFE3BA" stroke-width="4"/><rect x="34" y="37" width="12" height="12" rx="2" fill="#FFE3BA"/></svg>';
const model='<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="13" y="13" width="54" height="54" rx="10" fill="#C7B4EE"/><path d="M26 27h28v26H26Z" fill="none" stroke="#5E4E99" stroke-width="3"/><path d="m32 36 8 7 9-12" fill="none" stroke="#5E4E99" stroke-width="4"/><path d="M8 8h13M8 8v13M72 8H59M72 8v13M8 72h13M8 72V59M72 72H59M72 72V59" fill="none" stroke="#E8DCFF" stroke-width="3"/></svg>';
function film(listening=false){const paused=listening||query.get('paused')==='1';return '<div class="film-stage"><div class="film-wrap"><div class="film-label"><span>影片成品</span><span>'+(paused?'已暫停':duration()+' 秒')+'</span></div><div class="phone" role="img" aria-label="影片畫面示意：OpenCV 工具箱與 YOLO 辨識模型比較，並非可播放影片"><div class="film-question">OpenCV 跟 YOLO 差在哪？</div><div class="film-title">工具與模型，<br>分工不同。</div><div class="film-cards"><div class="film-object">'+toolbox+'<strong>OpenCV</strong><small>影像處理工具箱</small></div><div class="film-object">'+model+'<strong>YOLO</strong><small>已訓練好的模型</small></div></div><div class="film-together">可以搭配使用</div><div class="film-caption">OpenCV 是工具箱<br>YOLO 是辨識模型</div><div class="film-brand">FOCUSFLOW</div>'+(listening?'<div class="pause-cover">'+icon('pause')+'<strong>短片已暫停</strong><p>保留在 00:42.5</p></div>':'')+'</div><div class="player"><div class="player-bar"><span></span></div><div class="player-controls"><div class="play-time"><button type="button" class="play-btn" data-action="play-demo" aria-label="切換播放示意狀態">'+icon(paused?'play':'pause')+'</button><span>00:42.5 / 00:'+duration()+'</span></div><span>老師原音</span></div></div>'+(!listening?'<a class="lookup" href="'+url(7)+'">'+icon('listen')+'查核這段原話</a>':'')+'</div></div>';}
function productDecision(){return '<aside class="product-action"><div class="mode-badge">'+icon('check')+'講稿已通過</div><h2>確認影片成品</h2><p class="review-caption">聲音、字幕與畫面是否合適？</p><div class="facts"><div class="fact"><span>影片長度</span><strong>'+duration()+' 秒</strong></div><div class="fact"><span>發布狀態</span><strong>尚未發布</strong></div></div><div class="stack">'+primary('核准發布','publish-demo')+secondary('修改內容','product-edit')+'</div><p class="action-note">修改後的新成品，仍需重新確認。</p></aside>';}
function productPage(){
 const listening=screen===7;
 let view=film(listening);
 if(currentTab==='script')view='<div class="reading-in-product">'+prose()+'</div>';
 if(currentTab==='ai')view=advice();
 return '<section class="product-document">'+nav(currentTab)+'<div class="product-grid">'+view+(listening?'<aside class="product-action">'+audio(true)+'</aside>':productDecision())+'</div></section>';
}
const titles=['','講稿審閱','修改講稿','更新內容','無法整理講稿','AI 建議','成品審閱','原音查核'];
const statuses=['','待你確認講稿','有未套用修改',renderMode?'正在製作短片':'正在更新內容','目前無法產生講稿','待你確認講稿','尚未發布','正在聽原話・尚未發布'];
function render(){
 let content=screen===1?'<div class="layout">'+paper()+decision()+'</div>':screen===2?editing():screen===3?busy():screen===4?empty():screen===5?'<div class="layout"><div class="document">'+nav('ai')+advice()+'</div>'+decision()+'</div>':productPage();
 const menu=[['home','總覽'],['film','課程管理'],['upload','上傳影片'],['course','短影片腳本'],['play','短影片審核']];
 document.querySelector('#app').innerHTML='<section class="screen" data-screen="'+screen+'"><div class="note-bar"><b>設計原型｜'+titles[screen]+'</b><span class="prototype-label">示意資料，未連接音訊、AI 或發布</span><details class="prototype-tools"><summary>原型工具</summary><div class="prototype-menu"><label for="scene-select">切換示意畫面</label><select id="scene-select">'+titles.slice(1).map((t,i)=>'<option value="'+(i+1)+'" '+(screen===i+1?'selected':'')+'>'+t+'</option>').join('')+'</select><a href="design-review.md">設計取捨與自評</a><p>2026-10-23 · 第六輪修訂</p></div></details></div><div class="app"><aside class="side"><div class="logo"><img class="brand-mark" src="../../../../../frontend/focus-flow/src/assets/mark-white.svg" alt=""><span class="brand-wordmark"><strong>focus</strong> <em>flow</em></span></div><ul class="nav">'+menu.map(([name,label])=>'<li class="'+((product?label==='短影片審核':label==='短影片腳本')?'on':'')+'">'+icon(name)+'<span class="nav-label">'+label+'</span></li>').join('')+'</ul><div class="side-foot"><div class="role-card"><div class="role-line"><span class="role-dot"></span>教師</div><strong>教師工作區</strong></div></div></aside><main class="main"><div class="project-topbar"><div><div class="topbar-heading">'+(product?'短影片審核':'短影片腳本')+'</div></div><div class="topbar-actions"><button class="chrome-btn" type="button" data-action="chrome-demo" aria-label="通知示意"><span class="chrome-face">'+icon('bell')+'</span></button><button class="chrome-btn" type="button" data-action="chrome-demo" aria-label="教師帳號示意"><span class="chrome-avatar">教</span></button></div></div><div class="workspace"><div class="crumb"><span>短影片</span>'+icon('chevron')+'<span>'+(product?'成品審閱':screen===2?'修改講稿':'講稿審閱')+'</span><details class="source-details"><summary>'+icon('course')+'課程來源<span class="source-chevron">'+icon('chevron')+'</span></summary><div class="source-popover"><strong>影片處理工具 — OpenCV</strong><p>第 6 講</p></div></details></div><div class="title-line"><h1>OpenCV 跟 YOLO 差在哪？</h1><div class="status-label">'+statuses[screen]+'</div></div>'+workflow()+content+'</div></main></div></section>';
 bind();
}
function toast(message){const box=document.querySelector('.demo-toast');box.textContent=message;box.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>box.hidden=true,5000);}
function updateEditing(){
 document.querySelector('.source-list').innerHTML=sourceRows();
 document.querySelector('#edit-duration').textContent=duration()+' 秒';
 const isDirty=dirty(),valid=Number(duration())>=30&&Number(duration())<=65;
 const notice=document.querySelector('#dirty-notice');
 notice.hidden=!isDirty;
 notice.querySelector('span').textContent='有未套用修改。請先套用修改或全部復原。';
 document.querySelector('button[data-action=approve]').disabled=isDirty||!valid;
 document.querySelector('button[data-action=apply]').disabled=!isDirty||!valid;
 document.querySelector('.review-actions .action-note').textContent=isDirty?'尚有未套用修改。':'已回復原本選句，可以繼續確認。';
}
function applyUpdate(selected=currentSelection,intent='manual'){go(3,{sel:[...selected].join(','),base:[...baseline].join(','),run:'1',intent});}
function bind(){
 document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('details[open]').forEach(detail=>{detail.open=false;detail.querySelector('summary').focus();});});
 document.addEventListener('click',event=>{document.querySelectorAll('details[open]').forEach(detail=>{if(!detail.contains(event.target))detail.open=false;});});
 document.querySelector('#scene-select').addEventListener('change',event=>go(Number(event.target.value)));
 document.addEventListener('change',event=>{
 if(event.target.matches('.source-check input')){
 const id=event.target.value;
 if(id==='s14'&&!event.target.checked&&!confirm('這句是目前的片頭，移除後會改變開場。是否移除？')){event.target.checked=true;return;}
 event.target.checked?currentSelection.add(id):currentSelection.delete(id);
 updateEditing();
 }
 if(event.target.matches('.ai-choice')){
 const count=document.querySelectorAll('.ai-choice:checked').length,button=document.querySelector('[data-action=apply-ai]');
 button.textContent='套用所選建議（'+count+' 項）';button.disabled=count===0;
 }
 });
 document.addEventListener('click',event=>{
 const listen=event.target.closest('[data-listen]');
 if(listen){const row=transcript.find(r=>r[0]===listen.dataset.listen);document.querySelector('.audio-box .quote').textContent=row[2];document.querySelector('.source-time').textContent='原錄音 '+row[1];document.querySelector('.audio-timing span:last-child').textContent='00:'+durations[transcript.indexOf(row)].toFixed(1);document.querySelectorAll('.listen-btn').forEach(e=>e.classList.toggle('active',e===listen));document.querySelector('.audio-box .mode span').textContent='正在聽老師原話';return;}
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 const action=button.dataset.action;
 if(action==='edit'||action==='product-edit')go(2,{sel:[...currentSelection].join(','),base:[...currentSelection].join(',')});
 if(action==='reset'){currentSelection=new Set(baseline);updateEditing();}
 if(action==='apply')applyUpdate();
 if(action==='apply-ai'){const picked=new Set(currentSelection),changesSpeech=document.querySelector('.ai-choice[value=sentence]').checked;if(changesSpeech)picked.add('s12');if(product&&!changesSpeech)go(3,{mode:'render',run:'1',sel:[...picked].join(',')});else applyUpdate(picked,'ai');}
 if(action==='approve')go(3,{mode:'render',run:'1',sel:[...currentSelection].join(',')});
 if(action==='cancel-update')go(renderMode?1:2,{sel:[...currentSelection].join(','),base:[...baseline].join(',')});
 if(action==='pause-audio'){const paused=button.textContent==='暫停試聽';button.textContent=paused?'繼續試聽':'暫停試聽';document.querySelector('.audio-box .mode span').textContent=paused?'原音試聽已暫停':'正在聽老師原話';}
 if(action==='stop-audio'){if(product)go(6,{paused:'1'});else{document.querySelector('.audio-box .mode span').textContent='已停止試聽';document.querySelector('.audio-box .audio-return').textContent='仍保留你剛才閱讀的位置。';}}
 if(action==='publish-demo')toast('這是設計示意，沒有實際發布影片。');
 if(action==='play-demo')go(6,{paused:query.get('paused')==='1'?'0':'1'});
 if(action==='chrome-demo')toast('此原型僅示範審閱流程，未連接帳號或通知。');
 if(action==='unavailable')toast('此示意版只呈現審閱流程，尚未接選題或其他產片頁。');
 });
 if(screen===2)updateEditing();
 if(screen===3&&query.get('run')==='1')setTimeout(()=>go(renderMode?6:1,{sel:[...currentSelection].join(',')}),1800);
}
render();
</script>
</body>
</html>
