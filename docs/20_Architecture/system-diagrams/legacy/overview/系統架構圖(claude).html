  qa: '問答檢索服務：收到學生問題後，計算問題 embedding，在 video_segments 集合做向量相似度比對，找出最相關片段，交給短影音生成服務處理。',

function highlight(key) {
  const box = document.getElementById('info-box');
  box.textContent = INFO[key] || '（無說明）';
  box.style.borderColor = 'var(--color-border-info)';
  box.style.color = 'var(--color-text-primary)';
  setTimeout(() => { box.style.borderColor = 'var(--color-border-secondary)'; }, 1200);
