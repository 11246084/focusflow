name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /opt/focusflow
          git pull origin main

      - name: Backend dependencies
        run: |
          cd /opt/focusflow/backend
          npm install --production

      - name: Build frontend
        run: |
          set -euo pipefail
          cd /opt/focusflow/frontend/focus-flow
          npm install
          npm run build

      - name: Verify frontend same-origin build
        run: |
          set -euo pipefail
          cd /opt/focusflow/frontend/focus-flow
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('dist');
          if (!fs.existsSync(root) || !fs.statSync(root).isDirectory()) {
            throw new Error('Frontend dist is missing; stop before restarting services.');
          }
          const violations = [];
          let fileCount = 0;
          function inspect(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const filename = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                inspect(filename);
              } else if (entry.isFile()) {
                fileCount += 1;
                const contents = fs.readFileSync(filename, 'utf8');
                if (/localhost|127\.0\.0\.1|https?:\/\/[^\s"'<>`\\]*\/api(?:[/?#\s"'<>`\\]|$)/i.test(contents)) {
                  violations.push(path.relative(root, filename));
                }
              } else {
                throw new Error('Unexpected frontend dist entry; stop before restarting services.');
              }
            }
          }
          inspect(root);
          if (!fileCount || violations.length) {
            console.error(JSON.stringify({ error: 'Frontend same-origin build check failed.', files: violations }));
            process.exit(1);
          }
          console.log(`Frontend same-origin build check passed (${fileCount} files).`);
          NODE

      - name: Fix SELinux
        run: sudo restorecon -Rv /opt/focusflow/frontend/focus-flow/dist

      - name: Restart services
        env:
          QA_VECTOR_SEARCH_MODE: atlas
          QA_QUERY_EMBEDDING_PROVIDER: gemini
          GEMINI_EMBEDDING_MODEL_NAME: gemini-embedding-2
          QA_ATLAS_VECTOR_INDEX_NAME: text_embedding_index
          QA_ATLAS_FILTER_MODE: bridge_course_or_video
          QA_ACTIVE_LEAF_EMBEDDING_CONTRACT_JSON: >-
            {"provider":"gemini","model":"gemini-embedding-2","dimension":3072,"instructionVersion":"gemini_embedding_2_asymmetric_retrieval_v2","generationVersion":"text_search_generation_v2","normalizationVersion":"unit_l2_v1","contractVersion":"gemini_embedding_2_text_v2","schemaVersion":"gemini_embedding_2_text_v2","taskType":null}
        run: |
          pm2 restart focusflow-backend --update-env
          pm2 save
          sudo systemctl reload nginx

      - name: Verify backend and proxy readiness
        run: |
          for attempt in {1..30}; do
            if health_json=$(curl --fail --silent --show-error http://127.0.0.1:4000/health); then
              if node -e 'const qa=JSON.parse(process.argv[1])?.data?.runtime?.qa; const ready=qa?.readyForAsk === true && qa?.vectorSearchMode === "atlas" && qa?.queryEmbeddingProvider === "gemini" && qa?.atlasVectorIndexConfigured === true && qa?.dataContractCompatibility?.leaf?.status === "compatible"; process.exit(ready ? 0 : 1)' "$health_json"; then
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend did not reach readyForAsk=true."
              exit 1
            fi
            sleep 2
          done

          proxy_status=$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' \
            --resolve focusflow.ntub.edu.tw:443:127.0.0.1 \
            https://focusflow.ntub.edu.tw/api/v1/courses)
          if [ "$proxy_status" != "401" ]; then
            echo "Nginx API proxy readiness failed with HTTP $proxy_status."
            exit 1
          fi
          echo "Backend QA readiness and Nginx API proxy checks passed."

      - name: Verify production Atlas QA once
        if: github.event.head_commit.message == 'Validate production Atlas QA'
        run: |
          cd /opt/focusflow/backend
          node <<'NODE'
          const mongoose = require('mongoose');
          const env = require('./src/config/env');
          const User = require('./src/models/user.model');
          const Enrollment = require('./src/models/enrollment.model');
          const { buildActiveEnrollmentFilter } = require('./src/services/courseAccess.service');
          const { issueSession } = require('./src/services/authTokens.service');
          const baseUrl = 'http://127.0.0.1:4000/api/v1';
          const courseId = '69fb4d4c069e21f4e65b74dc';
          const allowedVideoIds = new Set([
            '69fb55edb52433fda32db4e8', '69fb57edb52433fda32db706',
            '69fb59cfb52433fda32db827', '69fb5b5eb52433fda32db907',
            '69fb5c8db52433fda32dbab5', '69fb5d78b52433fda32dbc81',
            '69fc291cadf6d9dc08eb4cb7', '6a02f2d417c615e872035a68',
            '6a02f34d17c615e872035b3d', '6a02f38c17c615e872035b94',
            '6a02f3b217c615e872035beb', '6a02f42a17c615e872035c42',
            '6a02f46317c615e872035c93', '6a02f48c17c615e872035cea',
            '6a02f4b017c615e872035d41',
          ]);

          async function request(path, { token, body } = {}) {
            const response = await fetch(`${baseUrl}${path}`, {
              method: body ? 'POST' : 'GET',
              headers: {
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
                ...(body ? { 'Content-Type': 'application/json; charset=utf-8' } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Internal production request failed with HTTP ${response.status}.`);
            return JSON.parse(text);
          }

          (async () => {
            mongoose.set('autoCreate', false);
            mongoose.set('autoIndex', false);
            let token;
            try {
              await mongoose.connect(env.mongodbUri, { autoCreate: false, autoIndex: false });
              const student = await User.findOne({ email: 'deploy-probe@focusflow.local', role: 'student' })
                .select('_id role isActive tokenVersion emailVerifiedAt mustChangePassword')
                .lean();
              if (student?.isActive !== true || !student.emailVerifiedAt || student.mustChangePassword !== false) {
                throw new Error('Verified, active deployment probe student was not found.');
              }
              const enrollments = await Enrollment.find(buildActiveEnrollmentFilter({ studentId: student._id }))
                .select('courseId').lean();
              if (enrollments.length !== 1 || String(enrollments[0].courseId) !== courseId) {
                throw new Error('Deployment probe must be enrolled only in the required probe course.');
              }
              ({ token } = await issueSession(student, { expiresIn: '5m', userAgent: 'deploy-atlas-qa-validation' }));
            } finally {
              await mongoose.disconnect();
            }
            const qa = await request('/qa/ask', {
              token,
              body: {
                courseId,
                question: '請依教材比較沒有 GPU 時選擇 OpenCV 或 YOLO 的考量，並說明訓練需求。',
              },
            });
            const citations = Array.isArray(qa?.data?.citations) ? qa.data.citations : [];
            const valid = qa?.success === true
              && qa?.data?.answerStatus?.status === 'answered'
              && qa?.data?.runtime?.searchBackendUsed === 'atlas'
              && qa?.data?.runtime?.answerProviderUsed === 'gemini'
              && citations.length > 0
              && citations.every((citation) => allowedVideoIds.has(String(citation.videoId || '')))
              && citations.every((citation) => Number.isFinite(citation?.timestamp?.startSec)
                && Number.isFinite(citation?.timestamp?.endSec)
                && citation.timestamp.endSec > citation.timestamp.startSec);
            if (!valid) throw new Error('Internal production Atlas QA acceptance failed.');
            console.log(JSON.stringify({
              status: 'passed',
              searchBackend: qa.data.runtime.searchBackendUsed,
              answerProvider: qa.data.runtime.answerProviderUsed,
              citationCount: citations.length,
            }));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Report sanitized backend process diagnostics
        if: failure() && github.event.head_commit.message == 'Validate production Atlas QA'
        run: |
          pm2 jlist | node -e 'let raw=""; process.stdin.on("data", chunk => raw += chunk); process.stdin.on("end", () => { const rows=JSON.parse(raw).filter(item => item.name === "focusflow-backend").map(item => ({ name:item.name, status:item.pm2_env?.status, restartCount:item.pm2_env?.restart_time, unstableRestarts:item.pm2_env?.unstable_restarts, uptime:item.pm2_env?.pm_uptime, memoryBytes:item.monit?.memory })); console.log(JSON.stringify(rows)); });'

      - name: Diagnose production Atlas QA lifecycle once
        id: atlas_qa_probe
        if: github.event.head_commit.message == 'Diagnose production Atlas QA'
        continue-on-error: true
        run: |
          cd /opt/focusflow/backend
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const mongoose = require('mongoose');
          const env = require('./src/config/env');
          const User = require('./src/models/user.model');
          const Enrollment = require('./src/models/enrollment.model');
          const { buildActiveEnrollmentFilter } = require('./src/services/courseAccess.service');
          const { issueSession } = require('./src/services/authTokens.service');
          const courseId = '69fb4d4c069e21f4e65b74dc';

          function backendPid() {
            const raw = execFileSync('pm2', ['pid', 'focusflow-backend'], { encoding: 'utf8' });
            return Number(String(raw).match(/\d+/)?.[0] || 0);
          }

          function memoryBucket(pid) {
            try {
              const status = fs.readFileSync(`/proc/${pid}/status`, 'utf8');
              const rssKiB = Number(status.match(/^VmRSS:\s+(\d+)/m)?.[1] || 0);
              if (rssKiB < 262144) return 'under_256_mib';
              if (rssKiB < 524288) return '256_to_512_mib';
              if (rssKiB < 786432) return '512_to_768_mib';
              return 'at_least_768_mib';
            } catch {
              return 'unknown';
            }
          }

          function setOutputs(values) {
            const lines = Object.entries(values).map(([key, value]) => `${key}=${value}`).join('\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines}\n`);
            console.log(JSON.stringify(values));
          }

          (async () => {
            const beforePid = backendPid();
            const rssBucket = memoryBucket(beforePid);
            let result = 'pass';
            let errorClass = 'none';
            try {
              mongoose.set('autoCreate', false);
              mongoose.set('autoIndex', false);
              let token;
              try {
                await mongoose.connect(env.mongodbUri, { autoCreate: false, autoIndex: false });
                const student = await User.findOne({ email: 'deploy-probe@focusflow.local', role: 'student' })
                  .select('_id role isActive tokenVersion emailVerifiedAt mustChangePassword')
                  .lean();
                if (student?.isActive !== true || !student.emailVerifiedAt || student.mustChangePassword !== false) {
                  throw new Error('PROBE_SETUP_STUDENT');
                }
                const enrollments = await Enrollment.find(buildActiveEnrollmentFilter({ studentId: student._id }))
                  .select('courseId').lean();
                if (enrollments.length !== 1 || String(enrollments[0].courseId) !== courseId) {
                  throw new Error('PROBE_SETUP_ENROLLMENT');
                }
                ({ token } = await issueSession(student, { expiresIn: '5m', userAgent: 'deploy-atlas-qa-diagnostic' }));
              } finally {
                await mongoose.disconnect();
              }
              const response = await fetch('http://127.0.0.1:4000/api/v1/qa/ask', {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify({
                  courseId,
                  question: '請依教材說明沒有 GPU 時使用 OpenCV 的理由，以及它和 YOLO 的訓練需求差異。',
                }),
              });
              const payload = await response.json();
              if (!response.ok) throw new Error(`PROBE_HTTP_${response.status}`);
              if (payload?.data?.runtime?.searchBackendUsed !== 'atlas'
                  || payload?.data?.answerStatus?.status !== 'answered'
                  || !Array.isArray(payload?.data?.citations)
                  || payload.data.citations.length === 0) {
                throw new Error('PROBE_ACCEPTANCE');
              }
            } catch (error) {
              result = 'failed';
              const message = String(error?.message || '');
              errorClass = message.startsWith('PROBE_HTTP_')
                ? 'http'
                : message === 'PROBE_ACCEPTANCE'
                  ? 'acceptance'
                  : message.startsWith('PROBE_SETUP_')
                    ? 'setup'
                    : 'transport_or_process';
            }
            await new Promise((resolve) => setTimeout(resolve, 2000));
            const afterPid = backendPid();
            setOutputs({
              result,
              error_class: errorClass,
              pid_changed: beforePid > 0 && afterPid > 0 && beforePid !== afterPid,
              rss_bucket: rssBucket,
            });
          })().catch(() => {
            setOutputs({ result: 'probe_infrastructure_failed', error_class: 'probe', pid_changed: 'unknown', rss_bucket: 'unknown' });
          });
          NODE

      - name: Diagnostic outcome - VM Atlas QA passed
        if: steps.atlas_qa_probe.outputs.result == 'pass'
        run: echo "VM internal Atlas QA passed."

      - name: Diagnostic outcome - backend restarted during QA
        if: steps.atlas_qa_probe.outputs.pid_changed == 'true'
        run: exit 1

      - name: Diagnostic outcome - QA failed without backend restart
        if: steps.atlas_qa_probe.outputs.result == 'failed' && steps.atlas_qa_probe.outputs.pid_changed != 'true'
        run: exit 1

      - name: Diagnostic outcome - probe infrastructure failed
        if: steps.atlas_qa_probe.outputs.result == 'probe_infrastructure_failed'
        run: exit 1

      - name: Diagnostic error class - transport or process
        if: steps.atlas_qa_probe.outputs.error_class == 'transport_or_process'
        run: echo "QA transport ended before an application response."

      - name: Diagnostic error class - application HTTP response
        if: steps.atlas_qa_probe.outputs.error_class == 'http'
        run: echo "QA returned a non-success application HTTP response."

      - name: Diagnostic error class - acceptance mismatch
        if: steps.atlas_qa_probe.outputs.error_class == 'acceptance'
        run: echo "QA returned JSON that did not satisfy Atlas acceptance."

      - name: Diagnostic error class - probe setup
        if: steps.atlas_qa_probe.outputs.error_class == 'setup'
        run: echo "QA probe account or least-privilege enrollment is not ready."

      - name: Diagnostic memory - under 256 MiB before QA
        if: steps.atlas_qa_probe.outputs.rss_bucket == 'under_256_mib'
        run: echo "Backend RSS was under 256 MiB before QA."

      - name: Diagnostic memory - 256 to 512 MiB before QA
        if: steps.atlas_qa_probe.outputs.rss_bucket == '256_to_512_mib'
        run: echo "Backend RSS was between 256 and 512 MiB before QA."

      - name: Diagnostic memory - at least 512 MiB before QA
        if: steps.atlas_qa_probe.outputs.rss_bucket == '512_to_768_mib' || steps.atlas_qa_probe.outputs.rss_bucket == 'at_least_768_mib'
        run: echo "Backend RSS was at least 512 MiB before QA."
