    QaMatch:
      description: QA 搜尋後回傳的單一片段命中結果。
      type: object
      required:
        - segmentId
        - videoId
        - startSec
        - endSec
        - transcript
        - score
      properties:
        segmentId:
          type: string
        modality:
          type: string
          enum:
            - text
            - video
          default: text
        videoId:
          type: string
        startSec:
          type: number
          minimum: 0
        endSec:
          type: number
          minimum: 0
        transcript:
          type: string
        score:
          type: number
          minimum: 0
        sourceUrl:
          anyOf:
            - type: string
            - type: 'null'
        videoUrl:
          anyOf:
            - type: string
            - type: 'null'
        youtubeVideoId:
          anyOf:
            - type: string
            - type: 'null'
        jumpUrl:
          anyOf:
            - type: string
            - type: 'null'
        clipPath:
          anyOf:
            - type: string
            - type: 'null'
    QaCitation:
      description: |
        Phase-2 QA 引用欄位。前端與 LINE 顯示來源時應優先使用 `citations[]`，
        `matches[]` 則保留作為 legacy/debug 的命中片段資料。
      type: object
      required:
        - citationId
        - modality
        - segmentId
        - videoId
        - videoTitle
        - sourceVideo
        - timestamp
        - match
        - clipPath
        - transcriptSnippet
      properties:
        citationId:
          type: string
          example: C1
        modality:
          type: string
          enum:
            - text
            - video
        segmentId:
          type: string
        videoId:
          type: string
        videoTitle:
          anyOf:
            - type: string
            - type: 'null'
        sourceVideo:
          type: object
          required:
            - videoId
            - title
            - sourceUrl
            - videoUrl
            - youtubeVideoId
          properties:
            videoId:
              type: string
            title:
              anyOf:
                - type: string
                - type: 'null'
            sourceUrl:
              anyOf:
                - type: string
                - type: 'null'
            videoUrl:
              anyOf:
                - type: string
                - type: 'null'
            youtubeVideoId:
              anyOf:
                - type: string
                - type: 'null'
        timestamp:
          type: object
          required:
            - startSec
            - endSec
            - label
            - jumpUrl
          properties:
            startSec:
              type: number
              minimum: 0
            endSec:
              type: number
              minimum: 0
            label:
              type: string
              example: '0:12'
            jumpUrl:
              anyOf:
                - type: string
                - type: 'null'
        match:
          type: object
          required:
            - status
            - score
            - confidence
          properties:
            status:
              type: string
              enum:
                - matched
            score:
              type: number
              minimum: 0
            confidence:
              type: string
              enum:
                - high
                - medium
                - low
        transcriptSnippet:
          type: string
        clipPath:
          anyOf:
            - type: string
            - type: 'null'
    QaAnswerStatus:
      description: QA 回答狀態。前端與 LINE Bot 應以此欄位判斷是否可顯示答案、低信心或無答案狀態。
      type: object
      required:
        - status
        - isAnswerable
        - matchStatus
        - confidence
        - noAnswerReason
      properties:
        status:
          type: string
          enum:
            - answered
            - no_answer
        isAnswerable:
          type: boolean
        matchStatus:
          type: string
          enum:
            - matched
            - no_relevant_match
            - no_searchable_segments
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
            - none
        noAnswerReason:
          anyOf:
            - type: string
              enum:
                - NO_RELEVANT_MATCH
                - NO_SEARCHABLE_SEGMENTS
            - type: 'null'
    QaClip:
      description: QA 命中的 clip 快取資訊；若目前沒有 clip，回應中可能為 null。
      type: object
      required:
        - segmentId
        - clipUrl
        - jumpUrl
        - keyPoints
        - hitCount
      properties:
        segmentId:
          type: string
        clipUrl:
          type: string
        jumpUrl:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        hitCount:
          type: integer
          minimum: 0
    QaFallback:
      description: QA 在 retrieval 或 answer generation 階段發生 fallback 時的說明項目。
      type: object
      required:
        - stage
        - code
        - message
      properties:
        stage:
          type: string
        code:
          type: string
        message:
          type: string
        from:
          anyOf:
            - type: string
            - type: 'null'
        to:
          anyOf:
            - type: string
            - type: 'null'
    QaRuntimeCourseSummary:
      description: QA runtime 內附帶的課程範圍摘要。
      type: object
      required:
        - isBridgeCourse
        - qaScopeOnly
        - bridgeMode
        - videoCount
        - appVideoCount
        - bridgeVideoCount
        - appOwnedVideoCount
        - metadataOnlyVideoCount
        - bridgeContract
        - bridgeContractPath
      properties:
        isBridgeCourse:
          description: 方便 QA client 快速辨識這次問答是否落在 bridge-first 課程範圍內。
          type: boolean
        qaScopeOnly:
          description: "`true` 代表這門課目前只有 QA scope 的可用性，不保證具備完整影片管理體驗。"
          type: boolean
        bridgeMode:
          $ref: '#/components/schemas/BridgeMode'
        videoCount:
          type: integer
          minimum: 0
        appVideoCount:
          description: QA 範圍內 app-owned video 的正式統計欄位。
          type: integer
          minimum: 0
        bridgeVideoCount:
          description: QA 範圍內 bridge / pipeline metadata video 的正式統計欄位。
          type: integer
          minimum: 0
        appOwnedVideoCount:
          description: "`appVideoCount` 的 readability alias，統計來源完全相同。"
          type: integer
          minimum: 0
        metadataOnlyVideoCount:
          description: "`bridgeVideoCount` 的 readability alias，統計來源完全相同。"
          type: integer
          minimum: 0
        bridgeContract:
          description: QA scope 使用的 bridge contract 名稱。
          type: string
        bridgeContractPath:
          description: QA scope 使用的 bridge contract 路徑說明。
          type: string
    QaRuntime:
      description: |
        QA 執行結果對應的 runtime 診斷資訊。

        `degraded` 代表系統仍可回答，但目前條件不是理想狀態，例如 fallback、bridge-only scope 或 retrieval 條件不足。
        `no_searchable_segments` 代表目前課程缺少可搜尋片段，而不是單純沒有相關答案。
      allOf:
        - $ref: '#/components/schemas/QaRuntimeSnapshot'
        - type: object
          required:
            - status
            - degraded
            - degradedReasons
            - searchBackendUsed
            - scoringMode
            - searchableSegmentCount
            - matchStatus
            - matchModality
            - resultCategory
            - course
            - answerProviderUsed
            - visualSearch
            - fallbacks
          properties:
            status:
              description: QA runtime 的總體狀態；`degraded` 代表仍可用，但不在理想條件。
              type: string
              enum:
                - ready
                - degraded
            degraded:
              description: 是否處於 `degraded` 狀態。
              type: boolean
            degradedReasons:
              description: 導致 `degraded` 的原因代碼列表。
              type: array
              items:
                type: string
            searchBackendUsed:
              description: 實際使用的搜尋 backend。
              type: string
            scoringMode:
              description: 本次 QA 命中排序所使用的 scoring 模式。
              type: string
            searchableSegmentCount:
              description: 目前課程範圍內可搜尋的 segment 數量。
              type: integer
              minimum: 0
            matchStatus:
              description: QA 命中狀態；`no_searchable_segments` 代表沒有可搜尋片段，`no_relevant_match` 則代表有資料但未命中相關片段。
              type: string
              enum:
                - matched
                - no_relevant_match
                - no_searchable_segments
            matchModality:
              description: 命中來源；文字 transcript 命中為 `text`，`video_segments_video` 命中為 `video`。
              type: string
              enum:
                - text
                - video
            resultCategory:
              description: Phase-1 的 convenience field，方便 frontend / demo 先分流結果；真正細節仍應以 `status`、`matchStatus` 與 `degradedReasons` 為準。
              type: string
              enum:
                - matched
                - matched_degraded
                - no_relevant_match
                - no_searchable_segments
            course:
              $ref: '#/components/schemas/QaRuntimeCourseSummary'
            answerProviderUsed:
              description: 本次實際用來產生答案的 provider；若未產生答案則可能為 null。
              anyOf:
                - type: string
                - type: 'null'
            visualSearch:
              description: 若文字片段未命中，嘗試 `video_segments_video` 檢索時的診斷；未嘗試時為 null。
              anyOf:
                - type: object
                  additionalProperties: true
                - type: 'null'
            fallbacks:
              description: 本次請求中發生的 fallback 列表。
              type: array
              items:
                $ref: '#/components/schemas/QaFallback'
    LineEventSource:
