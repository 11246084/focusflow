        - vectorSearchMode
        - answerProvider
        - atlasVectorIndexConfigured
        - atlasFilterMode
        - geminiConfigured
        - openaiConfigured
        - readiness
        - readyForAsk
        - costControl
        - warnings
        - hardFailures
      properties:
        queryEmbeddingProvider:
          type: string
          enum:
            - mock
            - openai
            - gemini
        vectorSearchMode:
          type: string
          enum:
            - memory
            - atlas
        answerProvider:
          type: string
          enum:
            - template
            - openai
            - gemini
        atlasVectorIndexConfigured:
          type: boolean
        atlasFilterMode:
          type: string
          enum:
            - bridge_course_or_video
        geminiConfigured:
          type: boolean
        openaiConfigured:
          type: boolean
        readiness:
          type: string
          enum:
            - ready
            - hard_fail
        readyForAsk:
          type: boolean
        costControl:
          $ref: '#/components/schemas/QaCostControlSnapshot'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
        hardFailures:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticItem'
    LineRuntimeSnapshot:
      description: LINE runtime 的靜態快照，用來描述簽章驗證、reply 能力與 delivery mode。
