  /api/v1/courses/{courseId}/short-scripts/auto:
    post:
      tags:
        - Short Scripts
      summary: 自動選題並凍結證據，建立腳本
      description: |
        排除課程內已有腳本的主題後，依熱度排序逐一評估候選：對候選問句做片段檢索與鄰接擴展，
        證據數達 `SHORT_SCRIPT_EVIDENCE_MIN_ITEMS` 的第一名即被選中，並把證據凍結成快照。
        被淘汰的候選會記在 `selectionReason.rejectedForEvidence`。

        傳 `topicKey` 時只評估教師指定的那一題；該題證據不足即失敗，不會改選其他題。
        新腳本狀態為 `evidence_ready`，尚未呼叫 LLM。
      operationId: createShortScript
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortScriptCreateRequest'
      responses:
        '201':
          description: 腳本已建立，證據已凍結
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortScriptResponse'
        '400':
          $ref: '#/components/responses/InvalidIdError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ShortScriptManageForbiddenError'
        '404':
          $ref: '#/components/responses/ShortScriptCourseNotFoundError'
        '409':
          description: 同時建立同一主題的腳本時撞到 `courseId + topicKey` 唯一索引（`DUPLICATE_RESOURCE`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  value:
                    success: false
                    message: Resource already exists.
                    error:
                      code: DUPLICATE_RESOURCE
        '422':
          description: |
            - `SHORT_SCRIPT_NO_CANDIDATE`：沒有候選通過過濾，或指定的 `topicKey` 不是合格候選
            - `SHORT_SCRIPT_EVIDENCE_EMPTY`：所有評估過的候選證據都不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noCandidate:
                  value:
                    success: false
                    message: No topic candidate passed the automatic selection filters.
                    error:
                      code: SHORT_SCRIPT_NO_CANDIDATE
                evidenceEmpty:
                  value:
                    success: false
                    message: Not enough transcript evidence to build a script.
                    error:
                      code: SHORT_SCRIPT_EVIDENCE_EMPTY
        '502':
          $ref: '#/components/responses/EmbeddingProviderError'
  /api/v1/short-scripts/{scriptId}:
    get:
      tags:
        - Short Scripts
